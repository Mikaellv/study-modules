\omega)}{1-V(q)\\,\\chi^R_0(q,\\omega)}$$", "note": "Eq. (9.57)."}, {"name": "RPA dielectric function", "latex": "$$\\varepsilon_{\\rm RPA}(q,\\omega)=1-V(q)\\,\\chi^R_0(q,\\omega)$$", "note": "Eq. (9.58); the plasmon pole, Eq. (9.59), is not reproduced here because the md extraction of it is unreadable."}]}], "questions": [{"id": "ch09-E1", "tier": "easy", "type": "free", "prompt": "Derive the equation of motion for $C^R_{AB}(t)=-i\\theta(t)\\langle[A(t),B]\\rangle$ and write it in frequency space.", "solution": "Differentiating $\\theta(t)$ gives $\\delta(t)\\langle[A,B]\\rangle$, and $i\\partial_tA(t)=[A,H](t)$ (since $\\partial_tA=i[H,A]$). The result is\n$$(\\omega+i\\eta)\\,C^R_{AB}(\\omega)=\\langle[A,B]\\rangle+C^R_{[A,H],B}(\\omega).$$\nFor fermions the commutator in the first term is an anticommutator.", "source": "Sec. 9.1, Eqs. (9.1)-(9.10)"}, {"id": "ch09-E2", "tier": "easy", "type": "mc", "prompt": "In the wide-band limit a single level coupled to a continuum has spectral function", "choices": ["a delta peak at $\\xi_0$", "a Lorentzian of full width $\\Gamma=2\\pi\\sum_\\nu|t_\\nu|^2\\delta(\\omega-\\xi_\\nu)$", "a Gaussian of width $\\Gamma$", "a step function"], "answerIndex": 1, "solution": "Eq. (9.22) with the constant coupling of Eq. (9.40) gives $\\Sigma^R\\approx -i\\Gamma/2$ plus a real shift (Eq. 9.41), so $A=\\Gamma/[(\\omega-\\tilde\\xi_0)^2+\\Gamma^2/4]$, a Lorentzian of full width $\\Gamma$ (Eq. 9.42). A delta peak would need zero coupling, and a Gaussian is not produced by a constant self-energy.", "source": "Sec. 9.2, Eq. (9.22); Sec. 9.3.2, Eqs. (9.39)-(9.42)"}, {"id": "ch09-E3", "tier": "easy", "type": "free", "prompt": "Why does the EOM for the Anderson model not close, and what does the mean-field approximation do?", "solution": "Commuting $d_\\sigma$ with the interaction $Un_{d\\uparrow}n_{d\\downarrow}$ produces $n_{d\\bar\\sigma}d_\\sigma$, a two-particle Green's function $D^R$ (Eqs. 9.30-9.34). Its own equation of motion generates yet another function, so the set does not close. Mean field replaces $n_{d\\bar\\sigma}$ by $\\langle n_{d\\bar\\sigma}\\rangle$, which gives a level shifted to $\\varepsilon_d+U\\langle n_{\\bar\\sigma}\\rangle$ (Eqs. 9.35-9.38).", "source": "Sec. 9.3.1-9.3.2, Eqs. (9.30)-(9.38)"}, {"id": "ch09-E4", "tier": "easy", "type": "mc", "prompt": "The RPA density response of the electron gas is", "choices": ["$\\dfrac{\\chi_0}{1-V\\chi_0}$", "$\\chi_0\\,(1-V\\chi_0)$", "$\\chi_0+V$", "$V\\chi_0^2$"], "answerIndex": 0, "solution": "Eq. (9.57) follows from the equation of motion for $\\chi^R(kq,\\omega)$ truncated in the random phase approximation (Eqs. 9.54-9.56), giving $\\chi_0/(1-V\\chi_0)$. The option $\\chi_0(1-V\\chi_0)$ has the wrong structure (no pole from the interaction), and the others do not reduce to $\\chi_0$ for $V\\to0$.", "source": "Sec. 9.4.1, Eqs. (9.57)-(9.58)"}, {"id": "ch09-H1", "tier": "hard", "type": "free", "prompt": "Ex. 9.1. Two orbitals have $H=E_1c^\\dagger_1c_1+E_2c^\\dagger_2c_2+t\\,c^\\dagger_1c_2+t^*c^\\dagger_2c_1$. Use the EOM to find $G^R_{11}(\\omega)$ and $G^R_{21}(\\omega)$, and interpret the poles.", "solution": "Book Exercise 9.1. In the basis $(1,2)$ the EOM (Eq. 9.10a) is a $2\\times2$ matrix equation. Inverting gives\n$$G^R_{11}(\\omega)=\\frac{\\omega-E_2}{(\\omega-E_1)(\\omega-E_2)-|t|^2},\\qquad G^R_{21}(\\omega)=\\frac{t^*}{(\\omega-E_1)(\\omega-E_2)-|t|^2}.$$\nThe poles are at $E_\\pm=\\frac{E_1+E_2}{2}\\pm\\sqrt{\\left(\\frac{E_1-E_2}{2}\\right)^2+|t|^2}$, the bonding and antibonding levels. The residues give the weight of orbital 1 in each eigenstate.", "source": "Ex. 9.1; Sec. 9.1.1, Eq. (9.11)"}, {"id": "ch09-H2", "tier": "hard", "type": "free", "prompt": "Ex. 9.2. Derive the EOM relations of Eqs. (9.30)-(9.31) by differentiating the Green's functions of Eq. (9.28). Show the dot and lead equations.", "solution": "Book Exercise 9.2. With the book's hybridization $t_kc^\\dagger_{d\\sigma}c_{k\\sigma}+t_k^*c^\\dagger_{k\\sigma}c_{d\\sigma}$ (Eq. 9.25), compute $[d_\\sigma,H]$ and $[c_{k\\sigma},H]$. The commutators give\n$$(\\omega+i\\eta-\\varepsilon_d+\\mu)\\,G^R(d\\sigma,\\omega)-\\sum_kt_k\\,G^R(k\\sigma,d\\sigma,\\omega)=1+U\\,D^R(d\\sigma,\\omega),\\qquad (\\omega+i\\eta-\\varepsilon_k+\\mu)\\,G^R(k\\sigma,d\\sigma,\\omega)=t_k^*\\,G^R(d\\sigma,\\omega),$$\nwith $D^R=\\langle\\langle n_{d\\bar\\sigma}d_\\sigma;d^\\dagger_\\sigma\\rangle\\rangle$. The first equation uses $[d_\\sigma,Un_{d\\uparrow}n_{d\\downarrow}]=Un_{d\\bar\\sigma}d_\\sigma$.", "source": "Ex. 9.2; Sec. 9.3.1, Eqs. (9.28)-(9.31)"}, {"id": "ch09-H3", "tier": "hard", "type": "free", "prompt": "Ex. 9.3. An STM tip sits over an adatom described by the Anderson model. The tip-to-atom tunneling is described by Eq. (8.65). Show that $dI/dV$ measures the adatom spectral function, and state its mean-field form.", "solution": "Book Exercise 9.3. The tunneling current of Eq. (8.74) with a flat tip density of states gives $dI/dV\\propto A_d(-eV)$ (Eq. 8.77, for the book's $V=V_1-V_2$). In mean field (Sec. 9.3.2) the adatom spectral function is, for each spin, a Lorentzian of full width $\\Gamma$ centered at $\\omega=\\tilde\\varepsilon-\\mu+U\\langle n_{\\bar\\sigma}\\rangle$ (Eq. 9.42), so $dI/dV$ shows one peak per spin. Without magnetization the two peaks coincide.", "source": "Ex. 9.3; Sec. 8.4.1; Sec. 9.3.2"}, {"id": "ch09-H4", "tier": "hard", "type": "free", "prompt": "From the self-consistency condition of Eq. (9.45) in the symmetric case $x=1/2$, find the condition for a magnetic solution with $\\langle n_\\uparrow\\rangle\\neq\\langle n_\\downarrow\\rangle$.", "solution": "Put $\\langle n_{\\uparrow,\\downarrow}\\rangle=\\tfrac12\\pm\\delta$. Then $\\cot(\\pi\\langle n_\\uparrow\\rangle)=-\\tan(\\pi\\delta)$ and the right side is $(\\langle n_\\downarrow\\rangle-\\tfrac12)y=-y\\delta$, so\n$$\\tan(\\pi\\delta)=y\\,\\delta.$$\nThe ratio $\\tan(\\pi\\delta)/\\delta$ rises monotonically from $\\pi$ at $\\delta\\to0$ to infinity at $\\delta\\to\\tfrac12$. A non-zero root therefore exists exactly when $y>\\pi$, that is $U>\\pi\\Gamma/2$.", "source": "Sec. 9.3.2, Eq. (9.45)"}]}, {"chapter": 10, "title": "Transport in interacting mesoscopic systems", "scope": "Sec. 10.1 (lead-dot-lead model), 10.2 and 10.2.1-10.2.2 (sequential tunneling, Coulomb blockade), 10.4 and 10.4.1-10.4.2 (linear conductance for Anderson-type models). Excludes 10.3 (coherent many-body transport) and 10.5 (Kondo effect). Summary omitted.", "sections": [{"id": "10.1", "title": "Model Hamiltonians", "keyResults": [{"name": "Lead-dot-lead Hamiltonian", "latex": "$$H=H_L+H_R+H_D+H_T$$", "note": "Eqs. (10.1)-(10.3a); the tunneling term is H_T = sum (t c^dagger_{nu_R} c_{nu_D} + h.c.)."}]}, {"id": "10.2", "title": "Sequential tunneling: the Coulomb blockade regime", "keyResults": []}, {"id": "10.2.1", "title": "Coulomb blockade for a metallic dot", "keyResults": [{"name": "Charging energy", "latex": "$$E(N)=E_C N^2-eV_gN,\\qquad E_C=\\frac{e^2}{2C}$$", "note": "Eqs. (10.7), (10.12)-(10.13); constant-interaction model with H_int = E_C (sum_nu n_nu)^2. Optimum charge N_opt = eV_g/2E_C."}, {"name": "Master equation", "latex": "$$\\frac{dP(\\alpha)}{dt}=\\sum_\\beta\\big[\\Gamma_{\\alpha\\beta}P(\\beta)-\\Gamma_{\\beta\\alpha}P(\\alpha)\\big]$$", "note": "Eq. (10.10); steady state gives Eq. (10.11)."}, {"name": "Tunneling rate, metallic dot", "latex": "$$\\Gamma^\\alpha_{N+1,N}=\\gamma_\\alpha\\,f\\big(E(N+1)-E(N)+\\mu_D-\\mu_\\alpha\\big),\\qquad f(E)=\\frac{E}{e^{\\beta E}-1}$$", "note": "Eqs. (10.20)-(10.21); f(E) = E n_B(E), from the identities (10.19a,b). Removal rate (Eq. 10.22): Gamma^alpha_{N-1,N} = gamma_alpha f(E(N-1)-E(N)-mu_D+mu_alpha)."}, {"name": "Detailed balance and current", "latex": "$$\\Gamma_{N-1,N}P(N)=\\Gamma_{N,N-1}P(N-1),\\qquad I=(-e)\\sum_N\\big(\\Gamma^L_{N+1,N}-\\Gamma^L_{N-1,N}\\big)P(N)$$", "note": "Eqs. (10.25)-(10.26)."}]}, {"id": "10.2.2", "title": "Coulomb blockade for a quantum dot", "keyResults": [{"name": "Quantum dot rates", "latex": "$$\\Gamma^L_{\\beta_{N+1}\\alpha_N}=\\gamma_L\\sum_{\\nu_D}|\\langle\\beta|c^\\dagger_{\\nu_D}|\\alpha\\rangle|^2\\,n_F(E_{\\beta}-E_{\\alpha}-\\mu_L),\\qquad \\Gamma^L_{\\beta_{N-1}\\alpha_N}=\\gamma_L\\sum_{\\nu_D}|\\langle\\beta|c_{\\nu_D}|\\alpha\\rangle|^2\\big[1-n_F(E_{\\alpha}-E_{\\beta}-\\mu_L)\\big]$$", "note": "Eqs. (10.29)-(10.30), from the golden-rule start Eqs. (10.27)-(10.28). Adding an electron costs E_beta - E_alpha; removing one frees E_alpha - E_beta."}]}, {"id": "10.4", "title": "The conductance for Anderson-type models", "keyResults": []}, {"id": "10.4.1", "title": "The conductance in linear response", "keyResults": [{"name": "Even-odd rotation", "latex": "$$c_{\\nu e\\sigma}=\\frac{t_L^*c_{\\nu L\\sigma}+t_R^*c_{\\nu R\\sigma}}{\\sqrt{|t_L|^2+|t_R|^2}},\\quad c_{\\nu o\\sigma}=\\frac{-t_Rc_{\\nu L\\sigma}+t_Lc_{\\nu R\\sigma}}{\\sqrt{|t_L|^2+|t_R|^2}},\\qquad H_T=\\sqrt{|t_L|^2+|t_R|^2}\\sum_{\\nu\\sigma}\\big(c^\\dagger_{\\nu e\\sigma}c_{d\\sigma}+\\mathrm{h.c.}\\big)$$", "note": "Eqs. (10.43)-(10.45); only the even combination couples to the dot, the odd one decouples. Rotation matrix read from Eq. (10.43)."}, {"name": "Linear conductance", "latex": "$$G=e^2\\sum_\\sigma\\int\\frac{d\\xi}{2\\pi}\\,\\frac{\\Gamma_L\\Gamma_R}{\\Gamma_L+\\Gamma_R}\\,A(d\\sigma,\\xi)\\left(-\\frac{\\partial n_F}{\\partial\\xi}\\right)$$", "note": "Eq. (10.56); the spectral function is computed with the leads included."}]}, {"id": "10.4.2", "title": "Calculation of Coulomb blockade peaks", "keyResults": [{"name": "Dot retarded function", "latex": "$$G^R(d\\sigma,\\omega)=\\frac{1-\\langle n_{\\bar\\sigma}\\rangle}{\\omega-\\xi_d-\\Sigma^R(\\omega)}+\\frac{\\langle n_{\\bar\\sigma}\\rangle}{\\omega-\\xi_d-U-\\Sigma^R(\\omega)},\\qquad \\Sigma^R(\\omega)=\\int\\frac{d\\xi}{2\\pi}\\frac{\\Gamma}{\\omega-\\xi+i\\eta}=-\\frac{i\\Gamma}{2}$$", "note": "Eqs. (10.65)-(10.68), with D^R = <n_sigmabar>/(omega - xi_d - U - Sigma) from Eq. (10.65); Gamma = Gamma_L + Gamma_R, wide band. Spin-flip terms are dropped to close the EOM."}, {"name": "Spectral function, two Lorentzians", "latex": "$$A(d\\sigma,\\omega)=\\Gamma\\left[\\frac{1-\\langle n_{\\bar\\sigma}\\rangle}{(\\omega-\\xi_d)^2+(\\Gamma/2)^2}+\\frac{\\langle n_{\\bar\\sigma}\\rangle}{(\\omega-\\xi_d-U)^2+(\\Gamma/2)^2}\\right]$$", "note": "Eq. (10.69); follows from -2 Im of Eq. (10.68) with Sigma = -i Gamma/2, so the numerator is Gamma. Integrates to 1 with the measure d omega/2 pi."}, {"name": "Self-consistent occupation", "latex": "$$\\langle n_{d\\sigma}\\rangle=\\int\\frac{d\\omega}{2\\pi}\\,n_F(\\omega)\\,A(d\\sigma,\\omega)$$", "note": "Eq. (10.70)."}]}], "questions": [{"id": "ch10-E1", "tier": "easy", "type": "free", "prompt": "Give the two conditions for Coulomb blockade in a metallic dot.", "solution": "(i) The charging energy must exceed the thermal energy, $E_C=e^2/2C\\gg k_BT$ (Eqs. 10.7, 10.13; Fig. 10.2 shows the oscillations washing out as $k_BT/E_C$ grows). (ii) The tunnel coupling must be weak, so that the charge on the dot is well defined: the dwell time on the dot is the longest time scale (Sec. 10.2), equivalent to a tunnel resistance $R_T\\gg h/e^2$.", "source": "Sec. 10.1, Eq. (10.7); Sec. 10.2, 10.2.1, Eq. (10.13)", "checkerNote": "The book states the weak-tunneling condition in words (Sec. 10.2) and does not print R_T >> h/e^2; that form is the standard criterion, kept as an equivalence."}, {"id": "ch10-E2", "tier": "easy", "type": "mc", "prompt": "After the rotation of Eq. (10.43) the dot couples to", "choices": ["both lead combinations equally", "only the even combination", "only the odd combination", "neither combination"], "answerIndex": 1, "solution": "Eqs. (10.43)-(10.45) show that only the even combination $c_{\\nu e}$ hybridizes with the dot. The odd combination decouples and does not contribute to the dot spectral function.", "source": "Sec. 10.4, Eqs. (10.43)-(10.45)"}, {"id": "ch10-E3", "tier": "easy", "type": "free", "prompt": "Write the steady-state solution of the sequential-tunneling master equation for a chain of charge states.", "solution": "Detailed balance between neighbouring charge states (Eq. 10.25) gives\n$$\\Gamma_{N-1,N}\\,P(N)=\\Gamma_{N,N-1}\\,P(N-1)\\quad\\Longrightarrow\\quad P(N)=P(N-1)\\,\\frac{\\Gamma_{N,N-1}}{\\Gamma_{N-1,N}},$$\nwhich determines all $P(N)$ up to a constant. Normalization $\\sum_NP(N)=1$ fixes the constant.", "source": "Sec. 10.2.1, Eq. (10.25)"}, {"id": "ch10-E4", "tier": "easy", "type": "free", "prompt": "Eq. (10.56) gives $G=e^2\\sum_\\sigma\\int\\frac{d\\xi}{2\\pi}\\frac{\\Gamma_L\\Gamma_R}{\\Gamma_L+\\Gamma_R}A(d\\sigma,\\xi)\\left(-\\frac{\\partial n_F}{\\partial\\xi}\\right)$ in units $\\hbar=1$. Take the Lorentzian $A(d\\sigma,\\xi)=\\Gamma/[(\\xi-\\xi_d)^2+(\\Gamma/2)^2]$ with $\\Gamma=\\Gamma_L+\\Gamma_R$ and find $G$ at $T=0$ for a symmetric non-interacting level on resonance, $\\xi_d=0$ and $\\Gamma_L=\\Gamma_R$.", "solution": "At $T=0$, $-\\partial n_F/\\partial\\xi=\\delta(\\xi)$, so each spin gives\n$$G_\\sigma=e^2\\,\\frac{1}{2\\pi}\\,\\frac{\\Gamma_L\\Gamma_R}{\\Gamma_L+\\Gamma_R}\\,A(0)=\\frac{e^2}{2\\pi}\\cdot\\frac{\\Gamma}{4}\\cdot\\frac{4}{\\Gamma}=\\frac{e^2}{h}.$$\nWith two spins, $G=2e^2/h$.", "source": "Sec. 10.4.1, Eq. (10.56)"}, {"id": "ch10-H1", "tier": "hard", "type": "free", "prompt": "Ex. 10.2. A single-level dot (Eq. 10.8) is in sequential tunneling. (a) Write the master equations for $P(0), P(\\uparrow), P(\\downarrow), P(d)$ with rates $\\Gamma_{\\beta\\alpha}$ for the transition $\\alpha\\to\\beta$. (b) In the large-$U$ limit with a degenerate level, find $P(0)$ and $P(\\sigma)$. (c) For a Zeeman-split level with only $P(0)$ and $P(\\uparrow)$ occupied, find both occupations. (d) Find the current from Eq. (10.26) and the linear conductance.", "solution": "Book Exercise 10.2. (a) Steady state (Eq. 10.11) for the empty state: rate out equals rate in,\n$$\\big(\\Gamma_{\\uparrow0}+\\Gamma_{\\downarrow0}\\big)P(0)=\\Gamma_{0\\uparrow}P(\\uparrow)+\\Gamma_{0\\downarrow}P(\\downarrow),$$\nand similarly for $P(\\uparrow),P(\\downarrow),P(d)$, with $\\Gamma_{\\beta\\alpha}=\\Gamma^L_{\\beta\\alpha}+\\Gamma^R_{\\beta\\alpha}$ and $\\sum P=1$.\n(b) With degenerate spins and $P(d)=0$ (large $U$), $P(0)=\\dfrac{\\Gamma_{01}}{\\Gamma_{01}+2\\Gamma_{10}}$ and $P(\\uparrow)=P(\\downarrow)=\\dfrac{\\Gamma_{10}}{\\Gamma_{01}+2\\Gamma_{10}}$, where $\\Gamma_{01}$ is the removal rate and $\\Gamma_{10}$ the addition rate.\n(c) With the Zeeman split and only two states, $P(0)=\\dfrac{\\Gamma_{0\\uparrow}}{\\Gamma_{0\\uparrow}+\\Gamma_{\\uparrow0}}$ and $P(\\uparrow)=\\dfrac{\\Gamma_{\\uparrow0}}{\\Gamma_{0\\uparrow}+\\Gamma_{\\uparrow0}}$.\n(d) The rates are $\\Gamma^x_{\\uparrow0}=\\Gamma_xn_F(\\varepsilon-\\mu_x)$ and $\\Gamma^x_{0\\uparrow}=\\Gamma_x[1-n_F(\\varepsilon-\\mu_x)]$ for $x=L,R$. Eq. (10.26) then gives\n$$I=e\\,\\frac{\\Gamma_L\\Gamma_R}{\\Gamma_L+\\Gamma_R}\\big[n_F(\\varepsilon-\\mu_R)-n_F(\\varepsilon-\\mu_L)\\big],\\qquad G=\\frac{e^2}{\\hbar}\\frac{\\Gamma_L\\Gamma_R}{\\Gamma_L+\\Gamma_R}\\,\\frac{1}{4k_BT\\cosh^2[(\\varepsilon-\\mu)/2k_BT]},$$\na thermally broadened peak whose height grows as $1/k_BT$.", "source": "Ex. 10.2; Sec. 10.2.2, Eqs. (10.26), (10.29)", "checkerNote": "Part (d) forms taken from the exercise statement (E.10.3)-(E.10.6); overall sign of I follows the book's convention."}, {"id": "ch10-H2", "tier": "hard", "type": "free", "prompt": "Ex. 10.6. Starting from Eqs. (10.56) and (10.69), show that in the weak-tunneling limit $\\Gamma\\ll k_BT$ the conductance reproduces the master-equation result of Ex. 10.2 for large $U$.", "solution": "Book Exercise 10.6. In the limit $\\Gamma\\ll k_BT$ the Lorentzians become delta functions,\n$$A(d\\sigma,\\omega)\\to 2\\pi\\big[(1-\\langle n_{\\bar\\sigma}\\rangle)\\,\\delta(\\omega-\\xi_d)+\\langle n_{\\bar\\sigma}\\rangle\\,\\delta(\\omega-\\xi_d-U)\\big].$$\nFor large $U$ the second delta lies far above $\\mu$ and drops out. Eq. (10.70) then gives $n=(1-n)\\,n_F(\\xi_d)$, so $n=n_F/(1+n_F)$ and $1-n=1/(1+n_F)$. Inserting into Eq. (10.56),\n$$G=2e^2\\frac{\\Gamma_L\\Gamma_R}{\\Gamma_L+\\Gamma_R}\\,\\frac{1}{1+n_F(\\xi_d)}\\left(-\\frac{\\partial n_F}{\\partial\\xi}\\right)_{\\xi_d},$$\na thermally broadened peak of height proportional to $\\Gamma_L\\Gamma_R/[(\\Gamma_L+\\Gamma_R)k_BT]$. This equals the master-equation result of Ex. 10.2 for a degenerate level with large $U$, where $P(0)+P(\\sigma)=1/(1+n_F)$ is the probability that the spin-$\\sigma$ level is available.", "source": "Ex. 10.6; Sec. 10.4.2, Eqs. (10.56), (10.69)-(10.70)"}, {"id": "ch10-H3", "tier": "hard", "type": "free", "prompt": "Ex. 10.7. For $\\varepsilon_{d\\uparrow}=\\varepsilon_{d\\downarrow}=\\varepsilon$, show that the self-consistent solution of Eq. (10.70) with the spectral function of Eq. (10.69) at $T=0$ is given in closed form. Use $\\Gamma$ for the full width.", "solution": "Book Exercise 10.7. Define $F(E)=\\int_{-\\infty}^{0}\\frac{d\\omega}{2\\pi}\\frac{\\Gamma}{(\\omega-E)^2+\\Gamma^2/4}=\\tfrac12-\\tfrac1\\pi\\arctan\\frac{2E}{\\Gamma}$. Eq. (10.70) with Eq. (10.69) gives, for $\\langle n_\\sigma\\rangle=\\langle n_{\\bar\\sigma}\\rangle=n$,\n$$n=(1-n)\\,F(\\varepsilon)+n\\,F(\\varepsilon+U)\\quad\\Longrightarrow\\quad n=\\frac{F(\\varepsilon)}{1+F(\\varepsilon)-F(\\varepsilon+U)}.$$\nChecks: $n\\to1$ for $\\varepsilon\\ll-U$ (both $F\\to1$), $n\\to0$ for $\\varepsilon\\gg0$, and $n\\approx\\tfrac12$ between the resonances for $U\\gg\\Gamma$ ($F(\\varepsilon)\\approx1$, $F(\\varepsilon+U)\\approx0$). In the book's notation $n=n_0/(1-n_U+n_0)$ with $n_0=F(\\varepsilon)$ and $n_U=F(\\varepsilon+U)$.", "source": "Ex. 10.7; Sec. 10.4.2, Eqs. (10.69)-(10.70)"}]}, {"chapter": "11", "title": "Imaginary-time Green's functions", "scope": "Chapter introduction (Eqs. 11.1-11.19) and Secs. 11.1-11.7; the summary in Sec. 11.8 is left out.", "sections": [{"id": "intro", "title": "Imaginary-time formalism (chapter introduction)", "keyResults": [{"name": "Imaginary-time Heisenberg operator", "latex": "$$A(\\tau)=e^{\\tau H}\\,A\\,e^{-\\tau H}$$", "note": "Eq. (11.5); the Greek argument marks imaginary time."}, {"name": "Matsubara function", "latex": "$$\\mathcal C_{AB}(\\tau,\\tau')=-\\langle T_\\tau A(\\tau)B(\\tau')\\rangle$$", "note": "Eqs. (11.20)-(11.21); the time ordering carries + for bosons and - for fermions."}, {"name": "Imaginary-time evolution operator", "latex": "$$\\hat U(\\tau,\\tau')=T_\\tau\\exp\\Big[-\\int_{\\tau'}^{\\tau}d\\tau_1\\,\\hat V(\\tau_1)\\Big]$$", "note": "Eq. (11.12); combined with Eq. (11.13) it gives e^{-beta H} as one time-ordered exponential."}]}, {"id": "11.1", "title": "Definitions of Matsubara Green's functions", "keyResults": [{"name": "Periodicity in tau", "latex": "$$\\mathcal C_{AB}(\\tau-\\beta)=\\pm\\,\\mathcal C_{AB}(\\tau),\\qquad \\text{upper sign: bosons, lower sign: fermions}$$", "note": "Eqs. (11.22)-(11.24); follows from the cyclic property of the trace."}, {"name": "Matsubara frequencies", "latex": "$$\\omega_n=\\frac{2n\\pi}{\\beta}\\ \\text{(bosons)},\\qquad \\omega_n=\\frac{(2n+1)\\pi}{\\beta}\\ \\text{(fermions)}$$", "note": "Eq. (11.28); beta = 1/k_B T enters only through the frequencies."}, {"name": "Fourier transform on [0, beta]", "latex": "$$\\mathcal C_{AB}(i\\omega_n)=\\int_0^\\beta d\\tau\\,e^{i\\omega_n\\tau}\\,\\mathcal C_{AB}(\\tau)$$", "note": "Eq. (11.28); a delta function at tau = 0 is placed at 0^+."}]}, {"id": "11.1.1", "title": "Fourier transform of Matsubara Green's functions", "keyResults": []}, {"id": "11.2", "title": "Connection between Matsubara and retarded functions", "keyResults": [{"name": "Analytic continuation to the retarded function", "latex": "$$\\mathcal C^R_{AB}(\\omega)=\\mathcal C_{AB}(i\\omega_n\\to\\omega+i\\eta)$$", "note": "Eq. (11.33); valid when the Matsubara function is written as a rational function analytic in the upper half plane."}]}, {"id": "11.2.1", "title": "Advanced functions", "keyResults": [{"name": "Advanced function", "latex": "$$\\mathcal C^A_{AB}(\\omega)=\\mathcal C_{AB}(i\\omega_n\\to\\omega-i\\eta)$$", "note": "Eq. (11.34); continuation from the lower half plane."}]}, {"id": "11.3", "title": "Single-particle Matsubara Green's function", "keyResults": [{"name": "Single-particle Matsubara function", "latex": "$$\\mathcal G(\\nu,\\tau)=-\\langle T_\\tau\\, c_\\nu(\\tau)\\,c^\\dagger_\\nu\\rangle$$", "note": "Eq. (11.36b)."}]}, {"id": "11.3.1", "title": "Matsubara Green's function for non-interacting particles", "keyResults": [{"name": "Free function in imaginary time", "latex": "$$\\mathcal G_0(\\nu,\\tau)=-\\big(1-n_F(\\xi_\\nu)\\big)e^{-\\xi_\\nu\\tau},\\qquad 0<\\tau<\\beta$$", "note": "Eq. (11.40)."}, {"name": "Free function in Matsubara frequency", "latex": "$$\\mathcal G_0(\\nu,i\\omega_n)=\\frac{1}{i\\omega_n-\\xi_\\nu}$$", "note": "Eq. (11.42); fermionic omega_n."}, {"name": "Free retarded function", "latex": "$$G^R_0(\\nu,\\omega)=\\frac{1}{\\omega-\\xi_\\nu+i\\eta}$$", "note": "Eq. (11.44); agrees with Eq. (8.55)."}]}, {"id": "11.4", "title": "Evaluation of Matsubara sums", "keyResults": []}, {"id": "11.4.1", "title": "Summations over functions with simple poles", "keyResults": [{"name": "Fermionic Matsubara sum", "latex": "$$\\frac1\\beta\\sum_{i\\omega_n}g(i\\omega_n)\\,e^{i\\omega_n\\tau}=\\sum_j \\mathrm{Res}_{z=z_j}\\!\\big[g(z)e^{z\\tau}\\big]\\,n_F(z_j)$$", "note": "Eq. (11.57); sum over fermionic frequencies with the poles z_j of g."}, {"name": "Bosonic Matsubara sum", "latex": "$$\\frac1\\beta\\sum_{i\\omega_n}g(i\\omega_n)\\,e^{i\\omega_n\\tau}=-\\sum_j \\mathrm{Res}_{z=z_j}\\!\\big[g(z)e^{z\\tau}\\big]\\,n_B(z_j)$$", "note": "Eq. (11.58); the minus sign is the difference from the fermion case."}]}, {"id": "11.4.2", "title": "Summations over functions with known branch cuts", "keyResults": [{"name": "Occupation from the spectral function", "latex": "$$\\langle n_\\nu\\rangle=\\int\\frac{d\\omega}{2\\pi}\\,A(\\nu,\\omega)\\,n_F(\\omega)$$", "note": "Eq. (11.62); agrees with Eq. (8.62)."}]}, {"id": "11.5", "title": "Equation of motion", "keyResults": [{"name": "Free equation of motion", "latex": "$$\\left(-\\partial_\\tau-\\xi_\\nu\\right)\\mathcal G_0(\\nu,\\tau)=\\delta(\\tau)$$", "note": "Eq. (11.66); with the boundary condition G_0(tau + beta) = -G_0(tau) it fixes G_0 (Eq. 11.67)."}]}, {"id": "11.6", "title": "Wick's theorem", "keyResults": [{"name": "Wick's theorem for free particles", "latex": "$$\\mathcal G^{(n)}_0=\\det\\big[\\mathcal G_0(i,j')\\big]\\ \\text{(fermions)},\\qquad \\mathcal G^{(n)}_0=\\mathrm{perm}\\big[\\mathcal G_0(i,j')\\big]\\ \\text{(bosons)}$$", "note": "Eq. (11.82); the n-particle function is a sum over all pairings of single-particle functions."}]}, {"id": "11.7", "title": "Example: polarizability of free electrons", "keyResults": [{"name": "Free Matsubara polarizability", "latex": "$$\\chi_0(q,iq_n)=\\frac1{\\mathcal V}\\sum_{k\\sigma}\\frac{n_F(\\xi_k)-n_F(\\xi_{k+q})}{iq_n+\\xi_k-\\xi_{k+q}}$$", "note": "Eq. (11.88); continuing iq_n to omega + i eta gives the retarded form of Eq. (8.85)."}]}], "questions": [{"id": "ch11-E1", "tier": "easy", "type": "mc", "prompt": "Which set gives the fermionic Matsubara frequencies $\\omega_n$ at inverse temperature $\\beta$?", "choices": ["$\\omega_n=2n\\pi/\\beta$", "$\\omega_n=(2n+1)\\pi/\\beta$", "$\\omega_n=n\\pi/\\beta$", "$\\omega_n=(2n+1)\\pi\\beta$"], "answerIndex": 1, "solution": "Fermionic functions are antiperiodic in $\\tau$, so $e^{i\\omega_n\\beta}=-1$, which requires odd multiples of $\\pi/\\beta$ (Eq. 11.28). The set $2n\\pi/\\beta$ is the bosonic one. The last option has the wrong dimension.", "source": "Sec. 11.1.1, Eq. (11.28)"}, {"id": "ch11-E2", "tier": "easy", "type": "free", "prompt": "For fermions and bosons alike, the Matsubara function obeys $\\mathcal C_{AB}(\\tau-\\beta)=\\pm\\mathcal C_{AB}(\\tau)$ for $0<\\tau<\\beta$. Show this and state the sign for each statistics.", "solution": "Write $\\mathcal C_{AB}(\\tau)=-\\langle T_\\tau A(\\tau)B\\rangle$ with $\\langle X\\rangle=\\mathrm{Tr}[e^{-\\beta H}X]/Z$. Let $\\varepsilon=+1$ for bosons and $\\varepsilon=-1$ for fermions.\n\nFor $\\tau-\\beta<0$ the time ordering puts $B$ first, so $T_\\tau[A(\\tau-\\beta)B]=\\varepsilon\\,B\\,A(\\tau-\\beta)$ and\n$$\\mathcal C_{AB}(\\tau-\\beta)=-\\varepsilon\\,\\langle B\\,A(\\tau-\\beta)\\rangle .$$\nCyclicity of the trace gives $\\mathrm{Tr}[e^{-\\beta H}B\\,A(\\tau-\\beta)]=\\mathrm{Tr}[A(\\tau-\\beta)\\,e^{-\\beta H}B]$. Since $e^{\\beta H}A(\\tau-\\beta)e^{-\\beta H}=A(\\tau)$, this equals $\\mathrm{Tr}[e^{-\\beta H}A(\\tau)B]$. Hence $\\langle B\\,A(\\tau-\\beta)\\rangle=\\langle A(\\tau)B\\rangle=-\\mathcal C_{AB}(\\tau)$ for $0<\\tau<\\beta$, and\n$$\\mathcal C_{AB}(\\tau-\\beta)=\\varepsilon\\,\\mathcal C_{AB}(\\tau).$$\nSo the sign is $+$ for bosons and $-$ for fermions.", "source": "Sec. 11.1, Eqs. (11.22)-(11.24)"}, {"id": "ch11-E3", "tier": "easy", "type": "mc", "prompt": "How is the retarded function $\\mathcal C^R_{AB}(\\omega)$ obtained from the Matsubara function $\\mathcal C_{AB}(i\\omega_n)$?", "choices": ["Replace $i\\omega_n\\to\\omega-i\\eta$, which gives the advanced function", "Take the real part of $\\mathcal C_{AB}(i\\omega_n)$ and set $\\omega_n=\\omega$", "Integrate $\\mathcal C_{AB}(\\tau)$ over $\\tau$ with weight $e^{-i\\omega\\tau}$", "Replace $i\\omega_n\\to\\omega+i\\eta$ and continue analytically"], "answerIndex": 3, "solution": "The Matsubara function is the restriction of an analytic function $\\mathcal C_{AB}(z)$ to $z=i\\omega_n$. Approaching the real axis from above gives $\\mathcal C^R_{AB}$ (Eq. 11.33). The $-i\\eta$ continuation gives the advanced function (Eq. 11.34). A naive real-part or Fourier integral is not an analytic continuation.", "source": "Sec. 11.2, Eq. (11.33)"}, {"id": "ch11-E4", "tier": "easy", "type": "free", "prompt": "For a single fermionic level, $\\mathcal G_0(\\nu,\\tau)=-(1-n_F(\\xi_\\nu))e^{-\\xi_\\nu\\tau}$ on $0<\\tau<\\beta$. Compute $\\mathcal G_0(\\nu,i\\omega_n)=\\int_0^\\beta d\\tau\\,e^{i\\omega_n\\tau}\\mathcal G_0(\\nu,\\tau)$ for fermionic $\\omega_n$.", "solution": "Use $e^{i\\omega_n\\beta}=-1$:\n$$\\int_0^\\beta d\\tau\\,e^{(i\\omega_n-\\xi_\\nu)\\tau}=\\frac{e^{(i\\omega_n-\\xi_\\nu)\\beta}-1}{i\\omega_n-\\xi_\\nu}=\\frac{-e^{-\\beta\\xi_\\nu}-1}{i\\omega_n-\\xi_\\nu}.$$\nTherefore $\\mathcal G_0=(1-n_F)(1+e^{-\\beta\\xi_\\nu})/(i\\omega_n-\\xi_\\nu)$. With $1-n_F(\\xi)=e^{\\beta\\xi}/(e^{\\beta\\xi}+1)$ the prefactor equals 1, giving\n$$\\mathcal G_0(\\nu,i\\omega_n)=\\frac{1}{i\\omega_n-\\xi_\\nu}.$$", "source": "Sec. 11.3.1, Eqs. (11.40)-(11.42)"}, {"id": "ch11-E5", "tier": "easy", "type": "mc", "prompt": "Wick's theorem is applied to $\\langle T_\\tau c_1 c_2 c^\\dagger_{2'} c^\\dagger_{1'}\\rangle_0$ for non-interacting fermions. How many full pairings (terms) appear?", "choices": ["1", "4", "2", "24"], "answerIndex": 2, "solution": "Two annihilation and two creation operators give $2!=2$ pairings: $(1,1')(2,2')$ with sign $+$ and $(1,2')(2,1')$ with sign $-$. This is the determinant of Eq. (11.82). The value 24 counts all orderings of the four operators, which is not the number of pairings.", "source": "Sec. 11.6, Eq. (11.82)"}, {"id": "ch11-H1", "tier": "hard", "type": "free", "prompt": "Book Exercise 11.1. Derive $\\langle c^\\dagger_\\nu c_\\nu\\rangle=n_F(\\xi_\\nu)$ from the Matsubara function. Use $\\langle c^\\dagger_\\nu c_\\nu\\rangle=\\mathcal G_0(\\nu,\\tau=0^-)$, the inverse transform $\\mathcal G_0(\\nu,\\tau)=\\frac1\\beta\\sum_n e^{-i\\omega_n\\tau}\\mathcal G_0(\\nu,i\\omega_n)$, and $\\mathcal G_0(\\nu,i\\omega_n)=1/(i\\omega_n-\\xi_\\nu)$.", "solution": "Setting $\\tau=0^-$ in the inverse transform gives\n$$\\langle c^\\dagger_\\nu c_\\nu\\rangle=\\frac1\\beta\\sum_{i\\omega_n}\\frac{e^{i\\omega_n0^+}}{i\\omega_n-\\xi_\\nu}.$$\nApply Eq. (11.57) with $g(z)=1/(z-\\xi_\\nu)$. The only pole of $g$ is $z=\\xi_\\nu$, with residue 1. The convergence factor $e^{z0^+}\\to1$ at that pole, so\n$$\\langle c^\\dagger_\\nu c_\\nu\\rangle=\\mathrm{Res}_{z=\\xi_\\nu}\\!\\Big[\\frac{1}{z-\\xi_\\nu}\\Big]\\,n_F(\\xi_\\nu)=n_F(\\xi_\\nu)=\\frac{1}{e^{\\beta\\xi_\\nu}+1}.$$", "source": "Ex. 11.1; Sec. 11.4.1, Eq. (11.57)"}, {"id": "ch11-H2", "tier": "hard", "type": "free", "prompt": "Book Exercise 11.2 (redo of Exercise 8.5 in the Matsubara formalism). For a free one-dimensional electron gas with spin, write the current-current Matsubara function in Wick-paired form, evaluate the Matsubara sum with Eq. (11.57), continue $iq_n\\to\\omega+i\\eta$, and take the small-$\\omega$ limit of the conductance. Show that the result is $G=2e^2/h$.", "solution": "Outline of the worked answer.\n\n1. The current operator of free electrons is $I(q)=\\sum_{k\\sigma}v_k\\,c^\\dagger_{k+q\\sigma}c_{k\\sigma}$ with $v_k=k/m$. The Kubo formula of Sec. 6.3 relates the conductance to the retarded current-current function.\n2. Wick's theorem (Eqs. 11.83-11.86) pairs the operators into a single loop, so the Matsubara function is a sum of products $\\mathcal G_0(k,\\tau)\\mathcal G_0(k+q,-\\tau)$ weighted by $v_kv_{k+q}$.\n3. Fourier transforming and using Eq. (11.57) gives the same structure as Eq. (11.88), with the velocity factors in the numerator.\n4. Continue $iq_n\\to\\omega+i\\eta$. Taking $q\\to0$ first and then $\\omega\\to0$ leaves the Fermi-surface term $\\propto\\sum_{k\\sigma}v_k^2\\,\\delta(\\xi_k)$. The two Fermi points and the spin sum give $G=2e^2/h$, the Landauer value for one spin-degenerate channel (Ex. 8.5).\n\n[UNVERIFIED: this is an outline only. The order of limits ($q\\to0$ then $\\omega\\to0$), the spin factor and the $\\hbar$ factors were not checked against the full solution of Exercise 8.5.]", "source": "Ex. 11.2; Sec. 11.7, Eqs. (11.83)-(11.88); Ex. 8.5"}, {"id": "ch11-H3", "tier": "hard", "type": "free", "prompt": "Book Exercise 11.3. Starting from $(-\\partial_\\tau-\\xi)\\mathcal G_0(\\tau)=\\delta(\\tau)$ with $\\mathcal G_0(\\tau)=-\\mathcal G_0(\\tau+\\beta)$, show that $\\mathcal G_0(i\\omega_n)=1/(i\\omega_n-\\xi)$ by Fourier transforming the equation.", "solution": "Multiply the equation by $e^{i\\omega_n\\tau}$ and integrate over $(0^+,\\beta^-)$. The delta function at $\\tau=0$ sits outside this interval, so the right side is zero there. Integrating by parts,\n$$-\\int_{0^+}^{\\beta^-}d\\tau\\,e^{i\\omega_n\\tau}\\partial_\\tau\\mathcal G_0=-\\Big[e^{i\\omega_n\\tau}\\mathcal G_0\\Big]_{0^+}^{\\beta^-}+i\\omega_n\\,\\mathcal G_0(i\\omega_n).$$\nWith $e^{i\\omega_n\\beta}=-1$ and antiperiodicity, $e^{i\\omega_n\\beta}\\mathcal G_0(\\beta^-)=\\mathcal G_0(0^-)$. The bracket $[e^{i\\omega_n\\tau}\\mathcal G_0]_{0^+}^{\\beta^-}$ equals $\\mathcal G_0(0^-)-\\mathcal G_0(0^+)$. Using $\\mathcal G_0(0^-)=n_F$ and $\\mathcal G_0(0^+)=-(1-n_F)$, the bracket is 1 and the boundary term $-[\\cdots]$ is $-1$. Hence\n$$-1+(i\\omega_n-\\xi)\\mathcal G_0(i\\omega_n)=0\\quad\\Rightarrow\\quad \\mathcal G_0(i\\omega_n)=\\frac{1}{i\\omega_n-\\xi}.$$", "source": "Ex. 11.3; Sec. 11.5, Eq. (11.66)"}, {"id": "ch11-H4", "tier": "hard", "type": "free", "prompt": "Derive the free Matsubara polarizability $\\chi_0(q,iq_n)$ from $\\chi_0(q,\\tau)=-\\frac1{\\mathcal V}\\langle T_\\tau\\rho(q,\\tau)\\rho(-q,0)\\rangle_0$, with $\\rho(q)=\\sum_{k\\sigma}c^\\dagger_{k\\sigma}c_{k+q\\sigma}$ and $\\mathcal G_0(k,i\\omega_n)=1/(i\\omega_n-\\xi_k)$. Show that the Matsubara sum gives the Lindhard form with the $n_F$ difference.", "solution": "1. Wick's theorem (Eq. 11.82) keeps only the single-loop pairing. Contracting $c_{k+q}(\\tau)$ with $c^\\dagger_{k+q}(0)$ and $c^\\dagger_k(\\tau)$ with $c_k(0)$ gives $\\langle T\\rho\\rho\\rangle_0=-\\sum_{k\\sigma}\\mathcal G_0(k+q,\\tau)\\,\\mathcal G_0(k,-\\tau)$, so\n$$\\chi_0(q,\\tau)=\\frac1{\\mathcal V}\\sum_{k\\sigma}\\mathcal G_0(k+q,\\tau)\\,\\mathcal G_0(k,-\\tau).$$\n2. The Fourier transform of this product is a convolution, so $\\chi_0(q,iq_n)=\\frac1{\\mathcal V}\\sum_{k\\sigma}\\frac1\\beta\\sum_{ik_n}\\mathcal G_0(k,ik_n)\\,\\mathcal G_0(k+q,ik_n+iq_n)$, with bosonic $iq_n$ and fermionic $ik_n$.\n3. The summand is $g(z)=1/[(z-\\xi_k)(z+iq_n-\\xi_{k+q})]$. Its poles are $z=\\xi_k$ and $z=\\xi_{k+q}-iq_n$. Eq. (11.57) at $\\tau=0$ gives\n$$\\frac{n_F(\\xi_k)}{\\xi_k+iq_n-\\xi_{k+q}}+\\frac{n_F(\\xi_{k+q}-iq_n)}{\\xi_{k+q}-iq_n-\\xi_k}.$$\nBecause $e^{i\\beta q_n}=1$, $n_F(\\xi_{k+q}-iq_n)=n_F(\\xi_{k+q})$. Hence\n$$\\chi_0(q,iq_n)=\\frac1{\\mathcal V}\\sum_{k\\sigma}\\frac{n_F(\\xi_k)-n_F(\\xi_{k+q})}{iq_n+\\xi_k-\\xi_{k+q}}.$$", "source": "Sec. 11.7, Eqs. (11.83)-(11.88)"}]}, {"chapter": "12", "title": "Feynman diagrams and external potentials (Sec. 12.1 only)", "scope": "Sec. 12.1 (Eqs. 12.1-12.10): non-interacting fermions in an external potential. Secs. 12.2-12.6 are out of scope.", "sections": [{"id": "12.1", "title": "Non-interacting particles in external potentials", "keyResults": [{"name": "Hamiltonian with external potential", "latex": "$$H=H_0+V,\\qquad V=\\sum_\\sigma\\int d\\mathbf r\\,\\Psi^\\dagger_\\sigma(\\mathbf r)V_\\sigma(\\mathbf r)\\Psi_\\sigma(\\mathbf r)$$", "note": "Eqs. (12.1)-(12.2); short-hand 1 = (r_1, sigma_1, tau_1)."}, {"name": "Equation of motion for the full function", "latex": "$$\\left(-\\partial_{\\tau_b}-H(b)\\right)\\mathcal G(b,a)=\\delta(b-a)$$", "note": "Eq. (12.3b); same sign convention as Eq. (11.66)."}, {"name": "Dyson equation in integral form", "latex": "$$\\mathcal G(b,a)=\\mathcal G_0(b,a)+\\int d1\\,\\mathcal G_0(b,1)\\,V(1)\\,\\mathcal G(1,a)$$", "note": "Eq. (12.5)."}, {"name": "Perturbation series", "latex": "$$\\mathcal G=\\mathcal G_0+\\mathcal G_0V\\mathcal G_0+\\mathcal G_0V\\mathcal G_0V\\mathcal G_0+\\cdots$$", "note": "Eq. (12.6); each term is a sum over scattering events by V."}, {"name": "Feynman rules for the external potential", "latex": "$$\\text{full line: }\\mathcal G,\\qquad \\text{thin line: }\\mathcal G_0,\\qquad \\text{cross: }V(1)$$", "note": "Eqs. (12.7)-(12.8); internal vertices are integrated over 1."}, {"name": "Diagrammatic Dyson equation", "latex": "$$\\mathcal G=\\mathcal G_0+\\mathcal G_0\\,V\\,\\mathcal G$$", "note": "Eqs. (12.9)-(12.10); the integral form (12.5) is recovered from the diagrams."}]}], "questions": [{"id": "ch12-E1", "tier": "easy", "type": "free", "prompt": "Write the integral Dyson equation for $\\mathcal G(b,a)$ of non-interacting fermions in an external potential $V(1)$, and write its first two iterations in terms of $\\mathcal G_0$.", "solution": "$$\\mathcal G(b,a)=\\mathcal G_0(b,a)+\\int d1\\,\\mathcal G_0(b,1)V(1)\\mathcal G(1,a)\\qquad\\text{(Eq. 12.5)}.$$\nInserting the equation into itself gives\n$$\\mathcal G(b,a)=\\mathcal G_0(b,a)+\\int d1\\,\\mathcal G_0(b,1)V(1)\\mathcal G_0(1,a)+\\int d1\\,d2\\,\\mathcal G_0(b,1)V(1)\\mathcal G_0(1,2)V(2)\\mathcal G_0(2,a)+\\cdots\\quad\\text{(Eq. 12.6)}.$$", "source": "Sec. 12.1, Eqs. (12.3)-(12.6)"}, {"id": "ch12-E2", "tier": "easy", "type": "mc", "prompt": "In the diagrams of Sec. 12.1 the external potential is drawn as a cross. What does an internal vertex with a cross mean?", "choices": ["A fixed external point with no integration", "An integral $\\int d1$ over space and imaginary time with the factor $V(1)$ at that vertex", "A sum over spin only, with no factor", "A factor $-1$ for each closed fermion loop"], "answerIndex": 1, "solution": "Each internal vertex is integrated over $1=(\\mathbf r_1,\\sigma_1,\\tau_1)$ and carries the factor $V(1)$ (Eqs. 12.7-12.8). The external points $a$ and $b$ are fixed. The other options describe other rules of the book.", "source": "Sec. 12.1, Eqs. (12.7)-(12.8)"}, {"id": "ch12-H1", "tier": "hard", "type": "free", "prompt": "Book Exercise 12.1. One-dimensional electrons with $U(x)=U_0\\delta(x)$ and $\\hbar=1$. Use $v=k/m$ and the free retarded function $G^R_0(x,x',\\omega)=-\\frac{i}{v}e^{ik|x-x'|}$. Solve the Dyson equation for $x'<0<x$ and find the transmission amplitude $t$ and $|t|^2$.", "solution": "1. Dyson's equation with the delta potential gives $G(x,x')=G_0(x,x')+G_0(x,0)\\,U_0\\,G(0,x')$. Setting $x=0$ gives $G(0,x')=G_0(0,x')/[1-U_0G_0(0,0)]$.\n2. With $G_0(0,0)=-i/v$, the denominator is $1+iU_0/v$.\n3. For $x'<0<x$, $G_0(x,0)U_0G_0(0,x')=-(U_0/v^2)e^{ik(x-x')}$. Collecting terms, $G(x,x')=-\\frac{i}{v}\\,t\\,e^{ik(x-x')}$ with\n$$t=\\frac{1}{1+iU_0/v},\\qquad |t|^2=\\frac{1}{1+(U_0/v)^2}.$$\nThis matches the barrier result of Ex. 7.2.", "source": "Ex. 12.1; Sec. 12.1, Eqs. (12.5), (12.9); cf. Ex. 7.2"}, {"id": "ch12-H2", "tier": "hard", "type": "free", "prompt": "Book Exercise 12.2 (resonant tunneling). The potential is $U_0[\\delta(x-a_1)+\\delta(x-a_2)]$. Define $\\alpha=U_0/(iv)$ and $\\theta=k(a_2-a_1)$, and use $G^R_0$ as in Ex. 12.1. For $x'<a_1<a_2<x$, show that $G^R=-\\frac{i}{v}\\,t\\,e^{ik(x-x')}$ with $t=[(1-\\alpha)^2-\\alpha^2e^{2i\\theta}]^{-1}$, and show that $|t|=1$ when $\\alpha=i\\cot\\theta$.", "solution": "1. Write $G(x,x')=G_0(x,x')+\\sum_j G_0(x,a_j)U_jG(a_j,x')$ with $G_0(x,x')=-\\frac iv e^{ik|x-x'|}$. Put $\\Phi_j=G(a_j,x')$, $E=e^{i\\theta}$ and $\\alpha_j=U_j/(iv)=U_jG_0(0,0)$. Setting $x=a_1,a_2$ gives the 2x2 system\n$$(1-\\alpha_1)\\Phi_1-\\alpha_2E\\,\\Phi_2=s_1,\\qquad -\\alpha_1E\\,\\Phi_1+(1-\\alpha_2)\\Phi_2=s_1E,\\qquad s_1=-\\tfrac iv e^{ik(a_1-x')}.$$\nIts determinant is $D=(1-\\alpha_1)(1-\\alpha_2)-\\alpha_1\\alpha_2E^2$. Inserting $\\Phi_{1,2}$ in $G(x,x')$ for $x>a_2$, the numerator collapses to 1, so\n$$G^R(x,x')=-\\frac iv\\,t\\,e^{ik(x-x')},\\qquad t=\\frac1D.$$\n2. For equal barriers, $\\alpha_1=\\alpha_2=\\alpha$, this is the stated $t=[(1-\\alpha)^2-\\alpha^2e^{2i\\theta}]^{-1}$. For $U_2=0$ it reduces to $1/(1-\\alpha_1)$, the single-barrier result of Ex. 12.1.\n3. Put $\\alpha=i\\cot\\theta$ into $D=(1-\\alpha)^2-\\alpha^2e^{2i\\theta}$. Using $\\alpha^2=-\\cot^2\\theta$ and $e^{2i\\theta}-1=2i\\sin\\theta\\,e^{i\\theta}$ one finds $D=1-2\\cos\\theta\\,e^{i\\theta}$. Then $D=1-2\\cos^2\\theta-2i\\sin\\theta\\cos\\theta=-\\cos2\\theta-i\\sin2\\theta=-e^{2i\\theta}$, so\n$$|t|=1/|D|=1.$$\nThis is the resonance condition of the exercise (Eq. E.12.6). Physically, the two paths $x'\\to a_1\\to x$ and $x'\\to a_1\\to a_2\\to a_1\\to a_2\\to x$ and all longer ones interfere constructively.", "source": "Ex. 12.2 (Eqs. E.12.4-E.12.6); Sec. 12.1"}]}, {"chapter": "13", "title": "Feynman diagrams and pair interactions", "scope": "Chapter introduction and Secs. 13.1-13.5 (Eqs. 13.1-13.37). Secs. 13.6 and 13.7 are out of scope.", "sections": [{"id": "intro", "title": "Pair-interaction Hamiltonian (chapter introduction)", "keyResults": [{"name": "Pair-interaction Hamiltonian", "latex": "$$W=\\frac12\\int\\Psi^\\dagger\\Psi^\\dagger\\,W\\,\\Psi\\Psi$$", "note": "Eqs. (13.1)-(13.3); W(1,2) is the pair potential."}]}, {"id": "13.1", "title": "The perturbation series for G", "keyResults": [{"name": "Perturbation series for the Green's function", "latex": "$$\\mathcal G(b,a)=-\\frac{\\langle T_\\tau\\,\\hat U(\\beta,0)\\,\\Psi(b)\\Psi^\\dagger(a)\\rangle_0}{\\langle \\hat U(\\beta,0)\\rangle_0}$$", "note": "Eq. (13.7); the denominator is the vacuum sum that cancels in Sec. 13.2.3."}]}, {"id": "13.2", "title": "The Feynman rules for pair interactions", "keyResults": [{"name": "Closed fermion loops", "latex": "$$\\text{each diagram is multiplied by }(-1)^F,\\quad F=\\text{number of closed fermion loops}$$", "note": "Eq. (13.18) and Sec. 13.2.1; the rules are stated for topologically distinct connected diagrams."}]}, {"id": "13.2.1", "title": "Feynman rules for the denominator of G", "keyResults": []}, {"id": "13.2.2", "title": "Feynman rules for the numerator of G", "keyResults": []}, {"id": "13.2.3", "title": "The cancellation of disconnected Feynman diagrams", "keyResults": [{"name": "Only connected diagrams remain", "latex": "$$\\mathcal G(b,a)=\\text{sum of connected, topologically distinct diagrams}$$", "note": "Eqs. (13.15)-(13.17); the denominator cancels all disconnected parts of the numerator."}]}, {"id": "13.3", "title": "Self-energy and Dyson's equation", "keyResults": [{"name": "Dyson equation with self-energy", "latex": "$$\\mathcal G=\\mathcal G_0+\\mathcal G_0\\,\\Sigma\\,\\mathcal G$$", "note": "Eqs. (13.21)-(13.22); Sigma is the sum of irreducible diagrams."}]}, {"id": "13.4", "title": "The Feynman rules in Fourier space", "keyResults": [{"name": "Algebraic Dyson equation", "latex": "$$\\mathcal G_\\sigma(k,ik_n)=\\frac{1}{ik_n-\\xi_k-\\Sigma_\\sigma(k,ik_n)}$$", "note": "Eqs. (13.29)-(13.30); valid for a translation-invariant system."}]}, {"id": "13.5", "title": "Examples of how to evaluate Feynman diagrams", "keyResults": []}, {"id": "13.5.1", "title": "The Hartree self-energy diagram", "keyResults": [{"name": "Hartree self-energy", "latex": "$$\\Sigma^H_\\sigma=W(0)\\,\\frac{N}{\\mathcal V}$$", "note": "Eq. (13.32); cancelled by the positive background in jellium."}]}, {"id": "13.5.2", "title": "The Fock self-energy diagram", "keyResults": [{"name": "Fock self-energy", "latex": "$$\\Sigma^F_\\sigma(k)=-\\int\\frac{d\\mathbf p}{(2\\pi)^3}\\,W(\\mathbf k-\\mathbf p)\\,n_F(\\xi_{\\mathbf p})$$", "note": "Eq. (13.34); the internal spin equals the external spin, and there is no loop."}]}, {"id": "13.5.3", "title": "The pair-bubble self-energy diagram", "keyResults": []}], "questions": [{"id": "ch13-E1", "tier": "easy", "type": "mc", "prompt": "Each closed fermion loop in a diagram of the imaginary-time expansion contributes which factor?", "choices": ["$+1$", "$-1$ per loop", "$i$", "$1/\\beta$"], "answerIndex": 1, "solution": "Fermion loops give $(-1)^F$ (Eq. 13.18, rule 5). The spin sum over a loop is a separate factor 2. The $1/\\beta$ factors come from the Matsubara sums over internal frequencies, not from the loop itself.", "source": "Sec. 13.2, Eq. (13.18); Sec. 13.2.1"}, {"id": "ch13-E2", "tier": "easy", "type": "free", "prompt": "Explain why disconnected diagrams drop out of $\\mathcal G(b,a)$ in Eq. (13.7).", "solution": "The numerator contains terms where the external vertices $a$ and $b$ connect to one piece, and other pieces are vacuum diagrams with no external line. The vacuum pieces are products of the same diagrams that appear in the denominator $\\langle\\hat U(\\beta,0)\\rangle_0$. The denominator divides out these products exactly, so only connected diagrams remain (Eqs. 13.15-13.17).", "source": "Sec. 13.2.3, Eqs. (13.15)-(13.17)"}, {"id": "ch13-E3", "tier": "easy", "type": "free", "prompt": "Solve the Dyson equation $\\mathcal G=\\mathcal G_0+\\mathcal G_0\\Sigma\\mathcal G$ in Fourier space for $\\mathcal G$ in terms of $\\Sigma$, with $\\mathcal G_0(k,ik_n)=1/(ik_n-\\xi_k)$.", "solution": "Write the equation as $\\mathcal G^{-1}=\\mathcal G_0^{-1}-\\Sigma$. Then\n$$\\mathcal G(k,ik_n)=\\frac{1}{\\mathcal G_0^{-1}-\\Sigma}=\\frac{1}{ik_n-\\xi_k-\\Sigma(k,ik_n)}.$$", "source": "Sec. 13.4, Eqs. (13.29)-(13.30)"}, {"id": "ch13-E4", "tier": "easy", "type": "mc", "prompt": "In jellium with the Coulomb interaction, the Hartree self-energy is $W(0)N/\\mathcal V$. What happens to it?", "choices": ["It is momentum dependent", "It equals the Fock term", "It is cancelled by the positive background, which removes the $q=0$ term", "It diverges and is not cancelled"], "answerIndex": 2, "solution": "The $q=0$ Hartree term is cancelled exactly by the uniform positive background of the jellium model (Eq. 2.34), so $\\Sigma^H$ vanishes. The Fock term is momentum dependent, so the first two options describe the Fock term, not the Hartree term.", "source": "Sec. 13.5.1, Eq. (13.32); Sec. 2.2, Eq. (2.34)"}, {"id": "ch13-H1", "tier": "hard", "type": "free", "prompt": "Book Exercise 13.1. Evaluate the Matsubara sum $\\frac1\\beta\\sum_{ip_n}\\frac{e^{ip_n0^+}}{ip_n-\\xi_p}$ with Eq. (11.57). Use it for the Fock self-energy $\\Sigma^F_\\sigma$ of Eq. (13.33) and the pair bubble $\\Pi_0$ of Eq. (13.37), and check that the Hartree term gives $\\Sigma^H_\\sigma=W(0)N/\\mathcal V$.", "solution": "1. By Eq. (11.57) with $g(z)=1/(z-\\xi_p)$, the sum equals $n_F(\\xi_p)$, as in ch11-H1. The factor $e^{ip_n0^+}$ is the same-time convergence factor of rule (6) in Eq. (13.27).\n2. Fock (no fermion loop, $F=0$, internal spin fixed to $\\sigma$, interaction line $-W(\\mathbf k-\\mathbf p)$): $\\Sigma^F_\\sigma(k)=-\\int\\frac{d\\mathbf p}{(2\\pi)^3}W(\\mathbf k-\\mathbf p)\\,\\frac1\\beta\\sum_{ip_n}\\frac{e^{ip_n\\eta}}{ip_n-\\xi_p}=-\\int\\frac{d\\mathbf p}{(2\\pi)^3}W(\\mathbf k-\\mathbf p)\\,n_F(\\xi_p)$.\n3. Hartree ($F=1$ gives $-1$, the interaction line gives $-W(0)$, the spin sum gives 2): $\\Sigma^H_\\sigma=2W(0)\\int\\frac{d\\mathbf p}{(2\\pi)^3}n_F(\\xi_p)=W(0)N/\\mathcal V$.\n4. Pair bubble: with $F=1$ and spin sum 2, $\\Pi_0(q,iq_n)=-2\\int\\frac{d\\mathbf p}{(2\\pi)^3}\\frac1\\beta\\sum_{ip_n}\\frac{1}{(ip_n+iq_n-\\xi_{p+q})(ip_n-\\xi_p)}$. The poles of $g(z)$ are $z=\\xi_p$ and $z=\\xi_{p+q}-iq_n$, and $n_F(\\xi_{p+q}-iq_n)=n_F(\\xi_{p+q})$ for bosonic $iq_n$. Eq. (11.57) gives\n$$\\Pi_0(q,iq_n)=-2\\int\\frac{d\\mathbf p}{(2\\pi)^3}\\frac{n_F(\\xi_p)-n_F(\\xi_{p+q})}{iq_n+\\xi_p-\\xi_{p+q}}=-\\chi_0(q,iq_n),$$\nwhich is Eq. (14.21) up to the sign convention $\\chi_0\\equiv-\\Pi_0$ of Eq. (14.12).", "source": "Ex. 13.1; Sec. 13.5, Eqs. (13.32)-(13.34), (13.37); Eq. (11.57)"}, {"id": "ch13-H2", "tier": "hard", "type": "free", "prompt": "Book Exercise 13.2. Expand the numerator and denominator of $\\mathcal G(b,a)$ in Eq. (13.7) to second order in $W$. Show that the disconnected pieces cancel and that $\\mathcal G=\\mathcal G_0+\\mathcal N_1^c+\\mathcal N_2^c+O(W^3)$, where $\\mathcal N^c_n$ are the connected $n$-th order contributions.", "solution": "Write the denominator as $D=1+D_1+D_2+\\cdots$, where $D_n$ are the vacuum diagrams of order $n$ (Eq. 13.14). Every numerator diagram factorizes into a part connected to the external points $a$ and $b$ times a vacuum part (Eqs. 13.15-13.16). Summing all vacuum parts of every order gives the same series $D$, so\n$$N=(\\mathcal G_0+N_1^c+N_2^c+\\cdots)\\,(1+D_1+D_2+\\cdots),$$\nwhere $N^c_n$ is the connected $n$-th order contribution. Through second order,\n$$N=\\mathcal G_0(1+D_1+D_2)+N_1^c(1+D_1)+N_2^c+O(W^3).$$\nThe term $N_1^cD_1$ is a connected first-order piece times a first-order vacuum loop. Dividing by $D$ gives\n$$\\mathcal G=\\frac ND=\\mathcal G_0+N_1^c+N_2^c+O(W^3),$$\nbecause $\\mathcal G_0(1+D_1+D_2)/D=\\mathcal G_0$ and $[N_1^c(1+D_1)+N_2^c]/(1+D_1+\\cdots)=N_1^c+N_2^c+O(W^3)$. Only connected diagrams remain. The all-orders version is the combinatorial argument of Eqs. (13.19)-(13.20).", "source": "Ex. 13.2; Sec. 13.2.3, Eqs. (13.15)-(13.20)"}, {"id": "ch13-H3", "tier": "hard", "type": "free", "prompt": "Book Exercise 13.3 (homework). For the Anderson model of Eqs. (9.23)-(9.26), derive the mean-field Dyson equation diagrammatically. Show that $\\mathcal G_{d\\sigma}(ik_n)=\\dfrac{1}{ik_n-(\\varepsilon_d-\\mu)-U\\langle n_{\\bar\\sigma}\\rangle-\\Sigma_{\\rm hyb}(ik_n)}$, with $\\Sigma_{\\rm hyb}(ik_n)=\\sum_k |t_k|^2/(ik_n-\\xi_k)$, $\\xi_k=\\varepsilon_k-\\mu$.", "solution": "1. The hybridization vertices $t_k$ connect the dot line to the lead line. Two such vertices, with the lead propagator between them, form the hybridization self-energy $\\Sigma_{\\rm hyb}(ik_n)=\\sum_k |t_k|^2\\,\\mathcal G_0(k,ik_n)=\\sum_k |t_k|^2/(ik_n-\\xi_k)$.\n2. The term $Un_{d\\uparrow}n_{d\\downarrow}$ in mean field gives a constant shift $U\\langle n_{\\bar\\sigma}\\rangle$ of the dot level $\\varepsilon_d-\\mu$. It has no internal momentum and adds to the self-energy as a constant.\n3. Summing the geometric series of Dyson's equation (13.29) gives the stated $\\mathcal G_{d\\sigma}$. This is the diagrammatic version of Eqs. (9.37)-(9.38).", "source": "Ex. 13.3; Sec. 13.3-13.4; Sec. 9.3.2, Eqs. (9.37)-(9.38)"}]}, {"chapter": "14", "title": "The interacting electron gas", "scope": "Secs. 14.1-14.5 (Eqs. 14.1-14.81). The summary in Sec. 14.6 is left out.", "sections": [{"id": "14.1", "title": "The self-energy in the random phase approximation", "keyResults": []}, {"id": "14.1.1", "title": "The density dependence of self-energy diagrams", "keyResults": []}, {"id": "14.1.2", "title": "The divergence number of self-energy diagrams", "keyResults": []}, {"id": "14.1.3", "title": "RPA resummation of the self-energy", "keyResults": [{"name": "RPA self-energy", "latex": "$$\\Sigma^{\\rm RPA}_\\sigma(k,ik_n)=-\\frac1\\beta\\sum_{iq_n}\\frac1{\\mathcal V}\\sum_q W^{\\rm RPA}(q,iq_n)\\,\\mathcal G_0(k+q,ik_n+iq_n)$$", "note": "Eqs. (14.11)-(14.14); Fock form with the bare W replaced by the RPA interaction."}]}, {"id": "14.2", "title": "The renormalized Coulomb interaction in RPA", "keyResults": [{"name": "RPA-renormalized interaction", "latex": "$$W^{\\rm RPA}(q,iq_n)=\\frac{W(q)}{1-W(q)\\,\\chi_0(q,iq_n)}$$", "note": "Eqs. (14.15)-(14.16); from the Dyson equation for the interaction."}, {"name": "Static long-wavelength screening", "latex": "$$W^{\\rm RPA}(q,0)=\\frac{e^2}{\\epsilon_0\\,(q^2+k_s^2)},\\qquad k_s^2=-\\frac{e^2}{\\epsilon_0}\\chi_0(0,0)$$", "note": "Eq. (14.18); the Thomas-Fermi wavenumber k_s is defined in Eq. (14.19), and W^RPA(0,0) = -1/chi_0(0,0) is Eq. (14.20)."}]}, {"id": "14.2.1", "title": "Calculation of the pair-bubble", "keyResults": [{"name": "Pair bubble", "latex": "$$\\chi_0(q,iq_n)=2\\int\\frac{d\\mathbf p}{(2\\pi)^3}\\,\\frac{n_F(\\xi_{\\mathbf p})-n_F(\\xi_{\\mathbf p+\\mathbf q})}{iq_n+\\xi_{\\mathbf p}-\\xi_{\\mathbf p+\\mathbf q}}$$", "note": "Eq. (14.21); the factor 2 is the spin sum, from Eq. (11.88)."}, {"name": "Screening wavenumber", "latex": "$$k_s^2=\\frac{e^2}{\\epsilon_0}\\,d(\\varepsilon_F)=\\frac{4}{\\pi}\\frac{k_F}{a_0}$$", "note": "Eq. (14.24); d(eps_F) is the density of states at the Fermi level."}]}, {"id": "14.2.2", "title": "The electron-hole pair interpretation of RPA", "keyResults": [{"name": "Imaginary part of the pair bubble", "latex": "$$\\mathrm{Im}\\,\\chi^R_0(q,\\omega)\\neq0\\ \\text{only inside the particle-hole continuum}$$", "note": "Eq. (14.30); the RPA screening can only absorb energy by creating electron-hole pairs."}]}, {"id": "14.3", "title": "The groundstate energy of the electron gas", "keyResults": [{"name": "Coupling-constant integration", "latex": "$$E=E_0+\\int_0^1\\frac{d\\lambda}{\\lambda}\\,\\langle\\lambda W\\rangle_\\lambda$$", "note": "Eqs. (14.33)-(14.41); standard form of the coupling-constant integral used in the RPA treatment."}, {"name": "Ground-state energy per particle", "latex": "$$\\frac{E}{N}=\\frac{2.211}{r_s^2}-\\frac{0.916}{r_s}+\\Big(0.0622\\ln r_s-0.094\\Big)\\ \\text{Ry}$$", "note": "Eq. (14.45); the constant is -0.094 Ry (checked against the book, including the summary of Sec. 14.6)."}]}, {"id": "14.4", "title": "The dielectric function and screening", "keyResults": [{"name": "RPA dielectric function", "latex": "$$\\epsilon_{\\rm RPA}(q,iq_n)=1-\\frac{e^2}{\\epsilon_0 q^2}\\,\\chi_0(q,iq_n)$$", "note": "Eq. (14.67); screened impurity potential follows in Eqs. (14.68)-(14.70)."}]}, {"id": "14.5", "title": "Plasma oscillations and Landau damping", "keyResults": [{"name": "High-frequency long-wavelength dielectric function", "latex": "$$\\epsilon_{\\rm RPA}(q,\\omega)\\approx1-\\frac{\\omega_p^2}{\\omega^2}\\Big[1+\\frac35\\Big(\\frac{qv_F}{\\omega}\\Big)^2\\Big]$$", "note": "Eq. (14.76); the limit is taken in Eqs. (14.71)-(14.75)."}]}, {"id": "14.5.1", "title": "Plasma oscillations and plasmons", "keyResults": [{"name": "Plasma frequency", "latex": "$$\\omega_p=\\sqrt{\\frac{ne^2}{m\\epsilon_0}}$$", "note": "Eq. (14.77)."}, {"name": "Plasmon dispersion", "latex": "$$\\omega(q)\\approx\\omega_p\\Big(1+\\frac{3}{10}\\,\\frac{q^2v_F^2}{\\omega_p^2}\\Big)$$", "note": "Eq. (14.78); the mode lies outside the particle-hole continuum, so it is undamped."}]}, {"id": "14.5.2", "title": "Landau damping", "keyResults": [{"name": "Damping condition", "latex": "$$\\mathrm{Im}\\,\\chi^R_0(q,\\omega)\\neq0\\quad\\text{on the plasmon branch}$$", "note": "Eqs. (14.79)-(14.80); a pole with real frequency needs Im chi_0 = 0 at that point."}]}], "questions": [{"id": "ch14-E1", "tier": "easy", "type": "mc", "prompt": "What is the plasma frequency of a three-dimensional electron gas of density $n$ and effective mass $m$?", "choices": ["$ne^2/(m\\epsilon_0)$", "$\\sqrt{ne^2/\\epsilon_0}$", "$v_Fk_F$", "$\\sqrt{ne^2/(m\\epsilon_0)}$"], "answerIndex": 3, "solution": "The plasma frequency is $\\omega_p=\\sqrt{ne^2/(m\\epsilon_0)}$ (Eq. 14.77). The first option is $\\omega_p^2$, not $\\omega_p$. The second has no mass. The third is a product of a velocity and a wave number.", "source": "Sec. 14.5.1, Eq. (14.77)"}, {"id": "ch14-E2", "tier": "easy", "type": "free", "prompt": "At high density, why are the bubble-chain diagrams the leading terms in the self-energy?", "solution": "At high density ($r_s\\to0$) the low-order diagrams dominate, because the scaling of each diagram with $k_F$, equivalently $r_s$, makes a diagram of order $n$ larger than one of higher order $n'>n$ (Eqs. 14.6-14.7). Within a given order the most divergent diagram dominates: the divergence number $\\delta$ counts the interaction lines that carry the same small momentum, and the diagram with $\\delta=n$ diverges most strongly as $q\\to0$ (Eqs. 14.8-14.9). That diagram at each order is a chain of pair bubbles (Eq. 14.10). Summing these chains is the RPA resummation of Eqs. (14.11)-(14.14).", "source": "Secs. 14.1.1-14.1.3, Eqs. (14.6)-(14.11)"}, {"id": "ch14-E3", "tier": "easy", "type": "free", "prompt": "Write the RPA interaction as a series in the bare interaction $W$ and the pair bubble $\\chi_0$. Give its static long-wavelength form with the Thomas-Fermi wavenumber $k_s$.", "solution": "$$W^{\\rm RPA}=W+W\\chi_0W+W\\chi_0W\\chi_0W+\\cdots=\\frac{W}{1-W\\chi_0}\\quad\\text{(Eqs. 14.15-14.16)}.$$\nFor $q\\to0$ and $\\omega=0$, with $W=e^2/(\\epsilon_0q^2)$,\n$$W^{\\rm RPA}(q,0)=\\frac{e^2}{\\epsilon_0(q^2+k_s^2)},\\qquad k_s^2=\\frac{e^2}{\\epsilon_0}d(\\varepsilon_F)\\quad\\text{(Eqs. 14.18-14.19, 14.24)}.$$", "source": "Sec. 14.2, Eqs. (14.15)-(14.18), (14.24)"}, {"id": "ch14-E4", "tier": "easy", "type": "mc", "prompt": "Landau damping of a plasmon occurs when:", "choices": ["$\\omega>\\omega_p$", "the plasmon dispersion enters the particle-hole continuum, where $\\mathrm{Im}\\,\\chi^R_0\\neq0$", "$T=0$", "$q=0$"], "answerIndex": 1, "solution": "A pole of Eq. (14.79) lies on the real axis only where $\\mathrm{Im}\\,\\chi^R_0=0$. Where the plasmon enters the particle-hole continuum, the pole broadens into a Lorentzian and the mode is damped (Eqs. 14.79-14.80; Eq. 14.30 for the continuum). The conditions in the other options are not the criterion.", "source": "Sec. 14.5.2, Eqs. (14.79)-(14.80); Sec. 14.2.1, Eq. (14.30)"}, {"id": "ch14-H1", "tier": "hard", "type": "free", "prompt": "Book Exercise 14.1. Classical derivation of $\\omega_p$. Displace a slab of electrons of density $n$ by a distance $\\xi$ perpendicular to its surfaces, against the uniform positive background. Find the restoring field and the frequency of the oscillation.", "solution": "The displacement leaves a surface charge $\\pm ne\\xi$ on the two faces of the slab. Each face contributes $ne\\xi/(2\\epsilon_0)$ to the field, so the field inside is $E=ne\\xi/\\epsilon_0$. Each electron feels a force $-eE$, so\n$$m\\ddot\\xi=-\\frac{ne^2}{\\epsilon_0}\\,\\xi\\quad\\Rightarrow\\quad \\omega_p=\\sqrt{\\frac{ne^2}{m\\epsilon_0}}.$$\nNo $\\hbar$ appears, which is the classical result of Eq. (14.77).", "source": "Ex. 14.1; Sec. 14.5.1, Eq. (14.77)"}, {"id": "ch14-H2", "tier": "hard", "type": "free", "prompt": "Book Exercise 14.2. A two-dimensional electron gas in GaAs ($m^*=0.067m$, $\\varepsilon_r=13$). Show that the two-dimensional Fourier transform of the Coulomb interaction $\\frac{e^2}{4\\pi\\varepsilon_r\\epsilon_0 r}$ is $W^{2D}(q)=\\dfrac{e^2}{2\\varepsilon_r\\epsilon_0 q}$.", "solution": "Use $\\int d^2r\\,e^{-i\\mathbf q\\cdot\\mathbf r}f(r)=2\\pi\\int_0^\\infty dr\\,r\\,f(r)J_0(qr)$. For $f=e^2/(4\\pi\\varepsilon_r\\epsilon_0r)$,\n$$W^{2D}(q)=\\frac{e^2}{4\\pi\\varepsilon_r\\epsilon_0}\\,2\\pi\\int_0^\\infty dr\\,J_0(qr)=\\frac{e^2}{2\\varepsilon_r\\epsilon_0}\\cdot\\frac1q=\\frac{e^2}{2\\varepsilon_r\\epsilon_0\\,q},$$\nusing $\\int_0^\\infty J_0(qr)\\,dr=1/q$ (the hint $\\int_0^\\pi d\\theta\\cos(\\alpha\\cos\\theta)=\\pi J_0(\\alpha)$ gives the angular integral).", "source": "Ex. 14.2; Sec. 1.4.4; Sec. 2.3.2"}, {"id": "ch14-H3", "tier": "hard", "type": "free", "prompt": "Book Exercise 14.3 (homework). For a two-dimensional gas use $\\varepsilon_{\\rm RPA}=1-W^{2D}(q)\\chi^{2D}_0(q,\\omega)$ with the high-frequency limit $\\chi^{2D}_0\\approx n_{2D}q^2/(m^*\\omega^2)$. Find the plasmon dispersion and show that it is gapless, with $k_F=\\sqrt{2\\pi n_{2D}}$.", "solution": "Setting $\\varepsilon_{\\rm RPA}=0$ gives $1=W^{2D}(q)\\,n_{2D}q^2/(m^*\\omega^2)$. Inserting $W^{2D}(q)=e^2/(2\\varepsilon_r\\epsilon_0q)$,\n$$\\omega^2(q)=\\frac{n_{2D}e^2}{2\\varepsilon_r\\epsilon_0m^*}\\,q\\quad\\Rightarrow\\quad \\omega(q)=\\sqrt{\\frac{n_{2D}e^2\\,q}{2\\varepsilon_r\\epsilon_0m^*}}\\propto\\sqrt q.$$\nThe mode has no gap at $q=0$, unlike the three-dimensional plasmon of Eq. (14.78). The Fermi wavenumber follows from $n_{2D}=2\\cdot\\pi k_F^2/(2\\pi)^2=k_F^2/(2\\pi)$, so $k_F=\\sqrt{2\\pi n_{2D}}$.", "source": "Ex. 14.3; Sec. 14.5, Eqs. (14.71)-(14.78)"}, {"id": "ch14-H4", "tier": "hard", "type": "free", "prompt": "Book Exercise 14.4. For the two-dimensional gas take the static pair bubble at small $q$ as $\\chi^{2D}_0(q\\to0,0)=-m^*/(\\pi\\hbar^2)$ (both spins). Show that $W^{2D}_{\\rm RPA}(q,0)=\\dfrac{e^2}{2\\varepsilon_r\\epsilon_0\\,(q+k_s^{2D})}$ with $k_s^{2D}=2/a_0^*$ and $a_0^*=4\\pi\\varepsilon_r\\epsilon_0\\hbar^2/(m^*e^2)$.", "solution": "From Eq. (14.16) with $W^{2D}=e^2/(2\\varepsilon_r\\epsilon_0q)$,\n$$W^{2D}_{\\rm RPA}=\\frac{W^{2D}}{1-W^{2D}\\chi_0^{2D}}=\\frac{W^{2D}}{1+W^{2D}d^{2D}},\\qquad d^{2D}=\\frac{m^*}{\\pi\\hbar^2}.$$\nMultiplying numerator and denominator by $2\\varepsilon_r\\epsilon_0q$ gives $e^2/[2\\varepsilon_r\\epsilon_0(q+k_s^{2D})]$ with\n$$k_s^{2D}=\\frac{e^2d^{2D}}{2\\varepsilon_r\\epsilon_0}=\\frac{e^2m^*}{2\\pi\\varepsilon_r\\epsilon_0\\hbar^2}=\\frac{2}{a_0^*}.$$\nThe last step uses $a_0^*=4\\pi\\varepsilon_r\\epsilon_0\\hbar^2/(m^*e^2)$.", "source": "Ex. 14.4; Sec. 14.2, Eqs. (14.16)-(14.24)"}]}, {"chapter": "15", "title": "Fermi liquid theory (Secs. 15.1 and 15.4)", "scope": "Secs. 15.1 (15.1.1, 15.1.2) and 15.4 (15.4.1-15.4.3). Secs. 15.2, 15.3 and 15.5 are out of scope; Eq. (15.44) is quoted only as a pointer.", "sections": [{"id": "15.1", "title": "Adiabatic continuity", "keyResults": [{"name": "Adiabatic solution", "latex": "$$\\psi_{\\rm adia}(x,t)\\approx\\psi_{V_0(t)}(x)\\,\\exp\\Big[-i\\int^t E\\,dt'\\Big]$$", "note": "Eqs. (15.1)-(15.4); the states follow the instantaneous eigenstates when the change is slow (validity condition Eq. 15.4)."}]}, {"id": "15.1.1", "title": "Example: one-dimensional well", "keyResults": []}, {"id": "15.1.2", "title": "The quasiparticle concept and conserved quantities", "keyResults": [{"name": "Quasiparticle state", "latex": "$$|(k\\sigma)_p\\rangle=c^\\dagger_{k\\sigma}|G\\rangle$$", "note": "Eqs. (15.6)-(15.7); adiabatically connected to a free particle state, with momentum, spin and charge conserved."}]}, {"id": "15.4", "title": "Microscopic basis of the Fermi liquid theory", "keyResults": []}, {"id": "15.4.1", "title": "Renormalization of the single particle Green's function", "keyResults": [{"name": "Retarded Green's function with self-energy", "latex": "$$G^R(k,\\omega)=\\frac{1}{\\omega-\\xi_k-\\Sigma^R(k,\\omega)}$$", "note": "Eqs. (15.47)-(15.48)."}, {"name": "Renormalized Fermi surface", "latex": "$$\\tilde\\xi_{\\tilde k_F}+\\mathrm{Re}\\,\\Sigma^R(\\tilde k_F,0)=0$$", "note": "Eq. (15.49)."}, {"name": "Quasiparticle weight", "latex": "$$Z=\\Big[1-\\partial_\\omega\\,\\mathrm{Re}\\,\\Sigma^R(\\tilde k_F,\\omega)\\big|_{\\omega=0}\\Big]^{-1}$$", "note": "Eq. (15.50); the jump of n_k at k_F equals Z (Eq. 15.57)."}, {"name": "Effective mass", "latex": "$$\\frac{m^*}{m}=Z^{-1}\\Big[1+\\frac{m}{\\tilde k_F}\\,\\partial_k\\mathrm{Re}\\,\\Sigma(k,0)\\Big]^{-1}$$", "note": "Eqs. (15.53)-(15.54)."}, {"name": "Quasiparticle lifetime", "latex": "$$\\frac{1}{\\tilde\\tau_k}=-2Z\\,\\mathrm{Im}\\,\\Sigma^R(k,\\tilde\\xi_k)$$", "note": "Eq. (15.52)."}, {"name": "Quasiparticle peak and background", "latex": "$$A(k,\\omega)=2\\pi Z\\,\\delta(\\omega-\\tilde\\xi_k)+A'(k,\\omega),\\qquad \\int\\frac{d\\omega}{2\\pi}A'=1-Z$$", "note": "Eqs. (15.55)-(15.57); the peak is Lorentzian when Im Sigma is small."}]}, {"id": "15.4.2", "title": "Imaginary part of the single-particle Green's function", "keyResults": [{"name": "Quasiparticle decay near the Fermi surface", "latex": "$$\\frac1{\\tau_k}=\\frac{\\sqrt3\\pi^2}{128}\\,\\omega_p\\Big(\\frac{\\xi_k}{\\varepsilon_F}\\Big)^2,\\qquad \\mathrm{Im}\\,\\Sigma^R(k,\\xi_k)\\propto\\xi_k^2$$", "note": "Eq. (15.68), Quinn-Ferrell result from the RPA self-energy. The lifetime diverges as xi_k goes to 0; Luttinger showed the decay is at least xi_k^2 to all orders."}]}, {"id": "15.4.3", "title": "Mass renormalization?", "keyResults": []}], "questions": [{"id": "ch15-E1", "tier": "easy", "type": "free", "prompt": "State the principle of adiabatic continuity. Why does it allow the low-lying states of the interacting gas to be labelled by the free-particle quantum numbers?", "solution": "Switching the interaction on slowly maps the non-interacting eigenstates one-to-one onto the interacting ones, without level crossings and without transitions between states. Quantum numbers such as $\\mathbf k$, spin and charge therefore carry over, so the low-energy excitations can be labelled like free particles and holes (Sec. 15.1.2, Eqs. 15.6-15.7).", "source": "Sec. 15.1, Sec. 15.1.2, Eqs. (15.4), (15.6)-(15.7)"}, {"id": "ch15-E2", "tier": "easy", "type": "mc", "prompt": "The quasiparticle residue $Z$ satisfies which statement?", "choices": ["$Z=m^*/m$ always", "$Z>1$", "$0<Z\\le1$, and $Z$ equals the jump of $n_k$ at $k_F$", "$Z=0$ in a Fermi liquid"], "answerIndex": 2, "solution": "$Z$ is a weight between 0 and 1: $Z=[1-\\partial_\\omega\\mathrm{Re}\\,\\Sigma]^{-1}$ (Eq. 15.50), and the sum rule gives $\\int\\frac{d\\omega}{2\\pi}A'=1-Z\\ge0$ (Eq. 15.56-15.57). It equals the jump of $n_k$ at $k_F$ (Eq. 15.57). The mass ratio $m^*/m$ is a separate quantity, and $Z$ vanishes only in the absence of a quasiparticle peak, which a Fermi liquid does not have.", "source": "Sec. 15.4.1, Eqs. (15.50), (15.57)"}, {"id": "ch15-E3", "tier": "easy", "type": "free", "prompt": "Write $Z$ and $m^*$ in terms of the real part of the self-energy $\\mathrm{Re}\\,\\Sigma$.", "solution": "$$Z=\\Big[1-\\partial_\\omega\\mathrm{Re}\\,\\Sigma^R(\\tilde k_F,\\omega)\\big|_{\\omega=0}\\Big]^{-1}\\quad\\text{(Eq. 15.50)}.$$\nDifferentiating the renormalized dispersion gives $\\tilde k_F/m^*=Z\\,(\\tilde k_F/m)\\,[1+(m/\\tilde k_F)\\partial_k\\mathrm{Re}\\,\\Sigma]$, so\n$$\\frac{m}{m^*}=Z\\Big(1+\\frac{m}{\\tilde k_F}\\,\\partial_k\\mathrm{Re}\\,\\Sigma(k,0)\\Big)\\quad\\text{(Eqs. 15.51-15.54)}.$$\nEquivalently $m^*/m=Z^{-1}[1+(m/\\tilde k_F)\\partial_k\\mathrm{Re}\\,\\Sigma(k,0)]^{-1}$.", "source": "Sec. 15.4.1, Eqs. (15.50)-(15.54)"}, {"id": "ch15-E4", "tier": "easy", "type": "free", "prompt": "Why are quasiparticles long-lived close to the Fermi surface? Use the scaling of the decay rate with $\\xi_k$.", "solution": "Pauli blocking restricts the decay. The scattered particle and the created particle-hole pair must both lie within an energy $\\sim\\xi_k$ of $\\varepsilon_F$, which cuts the phase space. The Quinn-Ferrell result is $1/\\tau_k=\\frac{\\sqrt3\\pi^2}{128}\\,\\omega_p\\,(\\xi_k/\\varepsilon_F)^2$ (Eq. 15.68), so $1/\\tau\\propto\\xi_k^2$ (and $\\propto T^2$ at finite temperature), so the width over energy goes to zero at the Fermi surface (Eqs. 15.63-15.68).", "source": "Sec. 15.4.2, Eqs. (15.63)-(15.68)"}, {"id": "ch15-H1", "tier": "hard", "type": "free", "prompt": "Book Exercise 15.2. Compton scattering and the jump $Z$. Starting from the spectral function of Eq. (15.57), compute $n_k=\\int\\frac{d\\omega}{2\\pi}A(k,\\omega)n_F(\\omega)$ and explain how the impulse-approximation intensity measures the jump of $n_k$ at $k_F$.", "solution": "1. Insert $A=2\\pi Z\\delta(\\omega-\\tilde\\xi_k)+A'$ (Eq. 15.57). The quasiparticle term gives $Z\\,n_F(\\tilde\\xi_k)$, which is a step of height $Z$ at $\\tilde k_F$ because $n_F$ becomes a step at $T=0$.\n2. The incoherent part $A'$ carries weight $1-Z$ and gives a smooth contribution to $n_k$.\n3. In the impulse approximation the Compton intensity is a projection of $n_k$ onto the momentum component fixed by the scattering kinematics. The derivative of the Compton profile therefore has a jump at the Fermi momentum whose size is proportional to $Z$.", "source": "Ex. 15.2; Sec. 15.4.1, Eq. (15.57); Sec. 8.3.4, Eq. (8.62)"}, {"id": "ch15-H2", "tier": "hard", "type": "free", "prompt": "Book Exercise 15.4. In the high-frequency limit $\\epsilon=1-\\omega_p^2/\\omega^2$ (Eq. 14.76), a wave in a metal propagates for $\\omega>\\omega_p$ and is reflected below. For sodium (bcc, $a=4.23$ Å, one electron per atom), find $n$, $\\omega_p$ and the wavelength $\\lambda_p=2\\pi c/\\omega_p$.", "solution": "1. A bcc cubic cell contains two atoms, so $n=2/a^3=2/(4.23\\times10^{-10}\\,\\mathrm{m})^3\\approx2.64\\times10^{28}\\,\\mathrm{m^{-3}}$.\n2. $\\omega_p=\\sqrt{ne^2/(m\\epsilon_0)}\\approx9.17\\times10^{15}\\,\\mathrm{s^{-1}}$ (Eq. 14.77).\n3. $\\lambda_p=2\\pi c/\\omega_p\\approx 205$ nm. The book quotes 206 nm as the observed UV transparency edge; the two agree within rounding. Light with $\\lambda<\\lambda_p$ ($\\omega>\\omega_p$) propagates in the metal, and light with longer wavelength is reflected, which is why polished metals look shiny.", "source": "Ex. 15.4; Sec. 14.5, Eqs. (14.76)-(14.77)"}, {"id": "ch15-H3", "tier": "hard", "type": "free", "prompt": "Book Exercise 15.1, adapted to Sec. 15.1.2. A wave packet $\\psi(\\mathbf r,t)=\\int d\\mathbf k\\,a(\\mathbf k)\\,e^{i(\\mathbf k\\cdot\\mathbf r-\\omega(\\mathbf k)t)}$ is peaked at $\\mathbf k_0$. Expand $\\omega(\\mathbf k)$ to first order and find the energy and the group velocity. Then argue why the number of quasiparticles is conserved when the external potential varies slowly in space and time.", "solution": "1. Expand $\\omega(\\mathbf k)\\approx\\omega(\\mathbf k_0)+\\mathbf v_g\\cdot(\\mathbf k-\\mathbf k_0)$ with $\\mathbf v_g=\\nabla_{\\mathbf k}\\omega(\\mathbf k_0)$. Then $\\psi\\approx e^{i(\\mathbf k_0\\cdot\\mathbf r-\\omega_0t)}F(\\mathbf r-\\mathbf v_gt)$, where $F$ is the envelope. The packet has energy $\\omega(\\mathbf k_0)$ and moves at $\\mathbf v_g$.\n2. A slowly varying potential does not induce transitions between states (adiabatic continuity, Sec. 15.1.2). The packet can change its $\\mathbf k$ and position, but it stays one quasiparticle state for each quantum number, so the number of quasiparticles is fixed.", "source": "Ex. 15.1; Sec. 15.1.2"}]}]</script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
(function () {
  "use strict";
  var DATA = [];
  try { DATA = JSON.parse(document.getElementById("course-data").textContent) || []; } catch (e) { DATA = []; }
  var KEY = "qm-exam-prep-v1";
  var state = { answers: {}, filter: "all" };
  try { state.answers = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state.answers = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state.answers)); } catch (e) {} }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function math(node) {
    if (window.renderMathInElement) {
      renderMathInElement(node, { delimiters: [
        { left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false }, { left: "\\[", right: "\\]", display: true } ],
        throwOnError: false });
    }
    return node;
  }
  function visible(q) { return state.filter === "all" || q.tier === state.filter; }

  function renderQuestion(q) {
    var a = state.answers[q.id] || {};
    var card = el("div", "q");
    var head = el("div");
    head.appendChild(el("span", "tag " + q.tier, q.tier === "easy" ? "Easy · closed book" : "Hard · open book"));
    head.appendChild(el("span", "qid", q.id));
    card.appendChild(head);
    card.appendChild(math(el("div", "qprompt", q.prompt)));
    var fb = el("div", "fb");
    if (q.type === "mc") {
      var box = el("div", "choices");
      q.choices.forEach(function (c, i) {
        var b = el("button", "choice", c);
        if (a.picked != null) {
          if (i === q.answerIndex) b.classList.add("right");
          else if (i === a.picked) b.classList.add("wrong");
          b.disabled = true;
        }
        b.addEventListener("click", function () {
          if (a.picked != null) return;
          a.picked = i; a.ok = (i === q.answerIndex); state.answers[q.id] = a; save(); rerender();
        });
        box.appendChild(b);
      });
      card.appendChild(box);
      if (a.picked != null) {
        fb.textContent = a.ok ? "Correct." : "Not quite.";
        fb.className = "fb " + (a.ok ? "ok" : "bad");
        card.appendChild(fb);
        card.classList.add(a.ok ? "done-ok" : "done-bad");
      }
    } else {
      var ta = el("textarea"); ta.placeholder = "Work it out here (optional). Nothing is graded automatically.";
      ta.value = a.text || "";
      ta.addEventListener("input", function () { a.text = ta.value; state.answers[q.id] = a; save(); });
      card.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn ghost", a.revealed ? "Hide solution" : "Show solution");
      reveal.addEventListener("click", function () { a.revealed = !a.revealed; state.answers[q.id] = a; save(); rerender(); });
      row.appendChild(reveal);
      var mk = el("div", "mark");
      ["Got it", "Missed it"].forEach(function (lab, idx) {
        var lb = el("label"); var r = el("input"); r.type = "radio"; r.name = q.id; r.checked = (a.self === (idx === 0));
        r.addEventListener("change", function () { a.self = (idx === 0); state.answers[q.id] = a; save(); rerender(); });
        lb.appendChild(r); lb.appendChild(document.createTextNode(" " + lab)); mk.appendChild(lb);
      });
      row.appendChild(mk);
      card.appendChild(row);
      if (a.revealed) {
        var s = el("div", "sol"); s.appendChild(math(el("div", null, q.solution)));
        card.appendChild(s);
      }
      if (a.self === true) card.classList.add("done-ok");
      if (a.self === false) card.classList.add("done-bad");
    }
    if (q.source) card.appendChild(el("div", "qid", "Source: " + q.source));
    if (q.checkerNote) card.appendChild(el("div", "qid", "Unverified: " + q.checkerNote));
    return card;
  }

  function answeredCount(q) {
    var a = state.answers[q.id];
    if (!a) return false;
    return q.type === "mc" ? a.picked != null : a.self != null;
  }

  function stats(questions) {
    var total = questions.length, done = questions.filter(answeredCount).length;
    var ok = questions.filter(function (q) { var a = state.answers[q.id]; return a && (q.type === "mc" ? a.ok : a.self === true); }).length;
    return { total: total, done: done, ok: ok };
  }

  function render() {
    var app = document.getElementById("app"), toc = document.getElementById("toc");
    app.innerHTML = ""; toc.innerHTML = "";
    var all = [];
    DATA.forEach(function (ch) { ch.questions.forEach(function (q) { all.push(q); }); });
    var s0 = stats(all);
    document.getElementById("pt").textContent = s0.done + " of " + s0.total + " answered" + (s0.done ? " · " + s0.ok + " correct" : "");
    document.getElementById("pb").style.width = (s0.total ? Math.round(100 * s0.done / s0.total) : 0) + "%";

    if (!DATA.length) { app.appendChild(el("p", "empty", "No content loaded.")); return; }
    DATA.forEach(function (ch) {
      var id = "ch" + ch.chapter;
      var link = el("a", null, "Ch " + ch.chapter + " · " + ch.title); link.href = "#" + id;
      var qs = ch.questions.filter(visible);
      var sc = stats(ch.questions);
      link.appendChild(el("span", "sc", sc.done + "/" + sc.total));
      toc.appendChild(link);
      var sec = el("section", "ch"); sec.id = id;
      if (!qs.length) sec.classList.add("hidden");
      var sc2 = el("span", "score", sc.done + "/" + sc.total + " answered");
      sec.appendChild(sc2);
      sec.appendChild(el("h2", null, "Chapter " + ch.chapter + ": " + ch.title));
      if (ch.scope) sec.appendChild(el("p", "sub", ch.scope));
      ch.sections.forEach(function (s) {
        var h = el("h3", null, s.title); sec.appendChild(h);
        (s.keyResults || []).forEach(function (k) {
          var d = el("div", "kr");
          d.appendChild(el("b", null, k.name));
          d.appendChild(math(el("div", null, k.latex)));
          if (k.note) d.appendChild(el("div", "note", k.note));
          if (k.checkerNote) d.appendChild(el("div", "note", "Unverified: " + k.checkerNote));
          sec.appendChild(d);
        });
      });
      if (ch.questions.length) sec.appendChild(el("h3", null, "Exercises"));
      ch.questions.forEach(function (q) { if (visible(q)) sec.appendChild(renderQuestion(q)); });
      app.appendChild(sec);
    });
    var end = el("section", "ch");
    end.appendChild(el("h2", null, "Exam-day checklist"));
    var ul = el("ul", "checklist");
    ["Bring a calculator if the exam allows it and a pen; check the rules for book and notes.",
     "Easy questions first: they test definitions and one-line derivations you should do without the book.",
     "For hard questions, write the setup (Hamiltonian, correlator, Feynman rules) before any algebra.",
     "Check units, limits (T→0, q→0, ω→0) and symmetry of your final expression.",
     "Leave a short justification with every answer, even if the algebra is incomplete."].forEach(function (t) {
      var li = el("li", null, "☐ " + t); ul.appendChild(li);
    });
    end.appendChild(ul); app.appendChild(end);
    math(app);
  }

  function rerender() { var y = window.scrollY; render(); window.scrollTo(0, y); }

  document.querySelectorAll("[data-filter]").forEach(function (b) {
    b.addEventListener("click", function () {
      state.filter = b.getAttribute("data-filter");
      document.querySelectorAll("[data-filter]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      rerender();
    });
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Clear all saved answers and self-marks?")) return;
    state.answers = {}; save(); rerender();
  });
  render();
})();
</script>

</body>
</html>
