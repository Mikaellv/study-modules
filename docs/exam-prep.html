<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Many-Body Exam Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eceff3; --ink: #1d2430; --muted: #5b6676; --line: #d9dee6;
  --accent: #3b5bdb; --accent-soft: #e4eaff; --accent-ink: #ffffff;
  --ok: #2b8a3e; --ok-soft: #e2f3e5; --bad: #c0392b; --bad-soft: #fbe4e1; --warn: #9a6700; --warn-soft: #fff4d6;
  --code-bg: #f7f8fa; --radius: 10px;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1218; --surface: #161b24; --surface-2: #1d2430; --ink: #e6eaf1; --muted: #9aa5b5; --line: #2a3340;
  --accent: #8ca4ff; --accent-soft: #1d2847; --accent-ink: #0b1020;
  --ok: #5cc277; --ok-soft: #14301c; --bad: #ff8a7a; --bad-soft: #3a1c18; --warn: #f0c060; --warn-soft: #3a2f10;
  --code-bg: #111620; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #161b24; --surface-2: #1d2430; --ink: #e6eaf1; --muted: #9aa5b5; --line: #2a3340;
  --accent: #8ca4ff; --accent-soft: #1d2847; --accent-ink: #0b1020;
  --ok: #5cc277; --ok-soft: #14301c; --bad: #ff8a7a; --bad-soft: #3a1c18; --warn: #f0c060; --warn-soft: #3a2f10;
  --code-bg: #111620; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--font-body); }
button, select { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hidden { display: none !important; }

.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.top h1 { font: 600 1.05rem var(--font-display); margin: 0; flex: 1 1 260px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.progress { flex: 0 0 180px; font-size: .85rem; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }

.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
nav.toc { position: sticky; top: 90px; align-self: start; font-size: .92rem; }
nav.toc a { display: block; padding: 5px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; }
nav.toc a:hover, nav.toc a.on { background: var(--accent-soft); color: var(--ink); }
nav.toc .sc { font-size: .75rem; margin-left: 6px; }

main section.ch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 22px; }
main h2 { font: 700 1.25rem var(--font-display); margin: 0 0 4px; }
main h3 { font: 600 1rem var(--font-display); margin: 22px 0 8px; }
.sub { color: var(--muted); font-size: .9rem; margin: 0 0 14px; }
.score { float: right; font-size: .85rem; color: var(--muted); }

.kr { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
.kr b { display: block; margin-bottom: 2px; }
.kr .note { color: var(--muted); font-size: .9rem; }

.q { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 12px 0; background: var(--surface); }
.q.done-ok { border-color: var(--ok); }
.q.done-bad { border-color: var(--bad); }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border-radius: 4px; padding: 2px 7px; margin-right: 6px; }
.tag.easy { background: var(--ok-soft); color: var(--ok); }
.tag.hard { background: var(--warn-soft); color: var(--warn); }
.qid { color: var(--muted); font-size: .8rem; }
.qprompt { margin: 8px 0 10px; }
.choices { display: grid; gap: 6px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 6px; padding: 7px 10px; }
.choice.right { background: var(--ok-soft); border-color: var(--ok); }
.choice.wrong { background: var(--bad-soft); border-color: var(--bad); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 6px 12px; font-size: .9rem; }
.btn.ghost { background: transparent; color: var(--accent); }
textarea { width: 100%; min-height: 70px; font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--code-bg); color: var(--ink); resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.sol { margin-top: 10px; border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 6px 6px 0; }
.mark { font-size: .9rem; }
.mark label { margin-right: 10px; cursor: pointer; }
.fb { font-weight: 600; margin-top: 8px; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }
.checklist { list-style: none; padding: 0; }
.checklist li { padding: 4px 0; }
.empty { color: var(--muted); font-style: italic; }

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav.toc { position: static; display: flex; overflow-x: auto; gap: 4px; }
  nav.toc a { white-space: nowrap; }
  .progress { flex-basis: 100%; }
}

<script type="application/json" id="course-data">[{"chapter": "1", "title": "First and second quantization", "scope": "Secs. 1.1 to 1.5 (includes 1.4.1, 1.4.3, 1.4.4, 1.4.5). Excluded: 1.4.2 (electromagnetic field, Eqs. 1.78-1.87) and the 1.6 summary.", "sections": [{"id": "1.1", "title": "First quantization, single-particle systems", "keyResults": [{"name": "Completeness of a single-particle basis", "latex": "$$\\sum_\\nu |\\nu\\rangle\\langle\\nu| = 1$$", "note": "Eq. (1.7). Follows from requiring that a particle is found somewhere in the basis with probability one."}]}, {"id": "1.2", "title": "First quantization, many-particle systems", "keyResults": []}, {"id": "1.2.1", "title": "Permutation symmetry and indistinguishability", "keyResults": [{"name": "Exchange symmetry", "latex": "$$\\psi(\\dots,r_j,\\dots,r_k,\\dots)=\\pm\\,\\psi(\\dots,r_k,\\dots,r_j,\\dots)$$", "note": "Eqs. (1.15)-(1.16). Plus sign for bosons, minus for fermions. Two exchanges give lambda squared = 1."}]}, {"id": "1.2.2", "title": "The single-particle states as basis states", "keyResults": [{"name": "Slater determinant and permanent (fermions, bosons)", "latex": "$$\\psi_{\\nu_1\\cdots\\nu_N}(r_1,\\dots,r_N)=\\frac{1}{\\sqrt{N!}}\\sum_{p\\in S_N}\\mathrm{sign}(p)\\prod_j\\psi_{\\nu_j}(r_{p(j)})$$", "note": "Eqs. (1.23)-(1.26). Fermions: determinant (sign of the permutation). Bosons: permanent (no sign). The fermion version vanishes when two labels coincide (Pauli). The 1/sqrt(N!) prefactor is for normalized states with all labels different. In general (footnote 2) the normalization is 1/(sqrt(N!) prod_nu sqrt(n_nu!)), where n_nu counts how often state nu appears. For fermions n_nu! = 1, and for bosons the factor is needed when a state is multiply occupied."}]}, {"id": "1.2.3", "title": "Operators in first quantization", "keyResults": [{"name": "Typical N-particle Hamiltonian", "latex": "$$H=\\sum_{j}T_j+\\sum_{j>k}V_{jk}$$", "note": "Eqs. (1.31)-(1.33). One-particle operators act on each coordinate; two-particle operators act on each pair."}]}, {"id": "1.3", "title": "Second quantization, basic concepts", "keyResults": []}, {"id": "1.3.1", "title": "The occupation number representation", "keyResults": [{"name": "Occupation number eigenvalues", "latex": "$$\\hat n_\\nu|n_\\nu\\rangle=n_\\nu|n_\\nu\\rangle,\\qquad n_\\nu\\in\\{0,1\\}\\ \\text{(fermions)},\\quad n_\\nu\\in\\{0,1,2,\\dots\\}\\ \\text{(bosons)}$$", "note": "Eqs. (1.36)-(1.37). Fock space is the direct sum over particle numbers N."}]}, {"id": "1.3.2", "title": "The boson creation and annihilation operators", "keyResults": [{"name": "Boson algebra", "latex": "$$[b_\\nu,b^\\dagger_{\\nu'}]=\\delta_{\\nu\\nu'},\\qquad [b_\\nu,b_{\\nu'}]=[b^\\dagger_\\nu,b^\\dagger_{\\nu'}]=0$$", "note": "Eq. (1.41)."}, {"name": "Boson ladder action", "latex": "$$b^\\dagger_\\nu|n_\\nu\\rangle=\\sqrt{n_\\nu+1}\\,|n_\\nu+1\\rangle,\\qquad b_\\nu|n_\\nu\\rangle=\\sqrt{n_\\nu}\\,|n_\\nu-1\\rangle,\\qquad b^\\dagger_\\nu b_\\nu=\\hat n_\\nu$$", "note": "Eqs. (1.45)-(1.46)."}]}, {"id": "1.3.3", "title": "The fermion creation and annihilation operators", "keyResults": [{"name": "Fermion algebra", "latex": "$$\\{c_\\nu,c^\\dagger_{\\nu'}\\}=\\delta_{\\nu\\nu'},\\qquad \\{c_\\nu,c_{\\nu'}\\}=\\{c^\\dagger_\\nu,c^\\dagger_{\\nu'}\\}=0,\\qquad (c^\\dagger_\\nu)^2=0$$", "note": "Eqs. (1.52)-(1.53)."}, {"name": "Fermion occupation", "latex": "$$\\hat n_\\nu=c^\\dagger_\\nu c_\\nu,\\qquad \\hat n_\\nu^2=\\hat n_\\nu,\\qquad n_\\nu\\in\\{0,1\\}$$", "note": "Eqs. (1.54)-(1.57). The operator c-dagger raises n by one and c lowers it by one."}]}, {"id": "1.3.4", "title": "The general form for second quantization operators", "keyResults": [{"name": "One-body operator", "latex": "$$\\hat T=\\sum_{\\nu\\mu}T_{\\nu\\mu}\\,a^\\dagger_\\nu a_\\mu$$", "note": "Eq. (1.61). Valid for bosons and fermions, with a-dagger standing for b-dagger or c-dagger."}, {"name": "Two-body operator", "latex": "$$\\hat V=\\frac12\\sum_{\\nu_i\\nu_j\\nu_k\\nu_l}V_{\\nu_i\\nu_j,\\nu_k\\nu_l}\\,a^\\dagger_{\\nu_i}a^\\dagger_{\\nu_j}a_{\\nu_l}a_{\\nu_k}$$", "note": "Eq. (1.62). The order of the annihilators carries the fermion sign."}]}, {"id": "1.3.5", "title": "Change of basis in second quantization", "keyResults": [{"name": "Creation and annihilation operators under a basis change", "latex": "$$a^\\dagger_\\mu=\\sum_\\nu\\langle\\nu|\\mu\\rangle\\,a^\\dagger_\\nu,\\qquad a_\\mu=\\sum_\\nu\\langle\\mu|\\nu\\rangle\\,a_\\nu$$", "note": "Eq. (1.65). Preserves the commutation or anticommutation rules and the particle number (Eqs. 1.67-1.68)."}]}, {"id": "1.3.6", "title": "Quantum field operators and their Fourier transforms", "keyResults": [{"name": "Field operators", "latex": "$$\\Psi^\\dagger(r)=\\sum_\\nu\\psi_\\nu^*(r)\\,a^\\dagger_\\nu,\\qquad \\Psi(r)=\\sum_\\nu\\psi_\\nu(r)\\,a_\\nu$$", "note": "Eq. (1.69)."}, {"name": "Field (anti)commutator", "latex": "$$[\\Psi(r_1),\\Psi^\\dagger(r_2)]=\\delta(r_1-r_2)\\ \\text{(bosons)},\\qquad \\{\\Psi(r_1),\\Psi^\\dagger(r_2)\\}=\\delta(r_1-r_2)\\ \\text{(fermions)}$$", "note": "Eqs. (1.70a)-(1.70b). Boson case is 1.70a, fermion case is 1.70b."}, {"name": "Plane-wave field operators", "latex": "$$\\Psi^\\dagger(r)=\\frac{1}{\\sqrt{\\mathcal V}}\\sum_k e^{-ik\\cdot r}a^\\dagger_k,\\qquad \\Psi(r)=\\frac{1}{\\sqrt{\\mathcal V}}\\sum_k e^{ik\\cdot r}a_k$$", "note": "Eq. (1.72). Inverse: a-dagger_q = (1/sqrt(V)) times the integral of e^{iq.r} Psi-dagger(r), Eq. (1.73)."}]}, {"id": "1.4", "title": "Second quantization, specific operators", "keyResults": []}, {"id": "1.4.1", "title": "The harmonic oscillator in second quantization", "keyResults": [{"name": "Ladder operator and Hamiltonian", "latex": "$$a=\\tfrac{1}{\\sqrt2}\\left(\\frac{x}{\\ell}+i\\frac{\\ell p}{\\hbar}\\right),\\qquad \\hat H=\\hbar\\omega\\left(a^\\dagger a+\\tfrac12\\right),\\qquad \\ell=\\sqrt{\\hbar/m\\omega}$$", "note": "Eqs. (1.74)-(1.76). Here [p, x] = -i hbar."}]}, {"id": "1.4.3", "title": "Operators for kinetic energy, spin, density and current", "keyResults": [{"name": "Kinetic energy", "latex": "$$\\hat T=\\sum_{k\\sigma}\\frac{\\hbar^2k^2}{2m}\\,c^\\dagger_{k\\sigma}c_{k\\sigma}$$", "note": "Eq. (1.89)."}, {"name": "Spin operator", "latex": "$$\\hat{\\mathbf S}=\\frac{\\hbar}{2}\\sum_{\\mu\\sigma\\sigma'}c^\\dagger_{\\mu\\sigma}\\,\\boldsymbol\\tau_{\\sigma\\sigma'}\\,c_{\\mu\\sigma'}$$", "note": "Eq. (1.92). Pauli matrices tau. The factor hbar/2 is the usual spin-1/2 normalization (s = hbar tau/2)."}, {"name": "Density Fourier component", "latex": "$$\\hat\\rho_\\sigma(q)=\\sum_{k}c^\\dagger_{k\\sigma}c_{k+q\\,\\sigma}$$", "note": "Eqs. (1.94)-(1.95). Momentum transfer q couples k to k+q."}, {"name": "Paramagnetic current density", "latex": "$$\\hat J^{\\nabla}_\\sigma(r)=\\frac{\\hbar}{2mi}\\left[\\Psi^\\dagger_\\sigma\\nabla\\Psi_\\sigma-(\\nabla\\Psi^\\dagger_\\sigma)\\Psi_\\sigma\\right]$$", "note": "Eq. (1.98a). The diamagnetic part, proportional to A(r) times the density (Eq. 1.98c), is added in the presence of a vector potential."}]}, {"id": "1.4.4", "title": "The Coulomb interaction in second quantization", "keyResults": [{"name": "Coulomb interaction in k-space", "latex": "$$\\hat V=\\frac{1}{2\\mathcal V}\\sum_{\\sigma_1\\sigma_2}\\sum_{k_1k_2q}V_q\\,c^\\dagger_{k_1+q\\,\\sigma_1}c^\\dagger_{k_2-q\\,\\sigma_2}c_{k_2\\sigma_2}c_{k_1\\sigma_1}$$", "note": "Eq. (1.103). Built from Eq. (1.100a) with the Fourier transform of Eq. (1.102)."}, {"name": "Fourier transform of the Coulomb potential", "latex": "$$V_q=\\frac{4\\pi e_0^2}{q^2}=\\frac{e^2}{\\epsilon_0 q^2},\\qquad e_0^2=\\frac{e^2}{4\\pi\\epsilon_0}$$", "note": "Eqs. (1.100b), (1.102). Yukawa version (Ex. 1.6): V_q = 4 pi e_0^2/(q^2 + k_s^2)."}]}, {"id": "1.4.5", "title": "Basis states for systems with different kinds of particles", "keyResults": []}, {"id": "1.5", "title": "Second quantization and statistical mechanics", "keyResults": [{"name": "Grand canonical density matrix and potential", "latex": "$$\\rho_G=\\frac{e^{-\\beta(\\hat H-\\mu\\hat N)}}{Z_G},\\qquad Z_G=\\mathrm{Tr}\\,e^{-\\beta(\\hat H-\\mu\\hat N)},\\qquad \\Omega=-k_BT\\ln Z_G$$", "note": "Eqs. (1.117)-(1.121). Z_G = exp(-beta Omega)."}]}, {"id": "1.5.1", "title": "The distribution function for non-interacting fermions", "keyResults": [{"name": "Fermi-Dirac distribution", "latex": "$$n_F(\\varepsilon)=\\frac{1}{e^{\\beta(\\varepsilon-\\mu)}+1},\\qquad \\xi_k=\\varepsilon_k-\\mu$$", "note": "Eqs. (1.125)-(1.126)."}]}, {"id": "1.5.2", "title": "The distribution function for non-interacting bosons", "keyResults": [{"name": "Bose-Einstein distribution", "latex": "$$n_B(\\varepsilon)=\\frac{1}{e^{\\beta(\\varepsilon-\\mu)}-1}$$", "note": "Eq. (1.127). Classical Maxwell-Boltzmann limit when the occupation is much below one."}]}], "questions": [{"id": "ch01-E1", "tier": "easy", "type": "mc", "prompt": "Which relation defines the fermion annihilation and creation operators?", "choices": ["$[c_\\nu,c^\\dagger_{\\nu'}]=\\delta_{\\nu\\nu'}$", "$\\{c_\\nu,c^\\dagger_{\\nu'}\\}=\\delta_{\\nu\\nu'}$", "$\\{c_\\nu,c_{\\nu'}\\}=1$", "$c^\\dagger_\\nu c_\\nu=1$"], "answerIndex": 1, "solution": "Fermions obey anticommutators, Eq. (1.52). The commutator form is the boson rule (1.41). The anticommutator of two annihilators vanishes, and $c^\\dagger c$ is the occupation number, not 1.", "source": "Sec. 1.3.3, Eq. (1.52)"}, {"id": "ch01-E2", "tier": "easy", "type": "free", "prompt": "From the fermion anticommutators, show $(c^\\dagger_\\nu)^2=0$ and $\\hat n_\\nu^2=\\hat n_\\nu$, so that $n_\\nu\\in\\{0,1\\}$.", "solution": "From $\\{c^\\dagger_\\nu,c^\\dagger_\\nu\\}=2(c^\\dagger_\\nu)^2=0$ we get $(c^\\dagger_\\nu)^2=0$.\n\nUsing $c_\\nu c^\\dagger_\\nu=1-c^\\dagger_\\nu c_\\nu$:\n$$\\hat n_\\nu^2=c^\\dagger_\\nu(c_\\nu c^\\dagger_\\nu)c_\\nu=c^\\dagger_\\nu(1-c^\\dagger_\\nu c_\\nu)c_\\nu=\\hat n_\\nu-(c^\\dagger_\\nu)^2c_\\nu^2=\\hat n_\\nu.$$\nAn operator with $\\lambda^2=\\lambda$ has eigenvalues 0 and 1 only.", "source": "Sec. 1.3.3, Eqs. (1.52)-(1.54)"}, {"id": "ch01-E3", "tier": "easy", "type": "mc", "prompt": "For bosons, $b^\\dagger|n\\rangle$ equals", "choices": ["$\\sqrt n\\,|n+1\\rangle$", "$\\sqrt{n+1}\\,|n+1\\rangle$", "$(n+1)\\,|n+1\\rangle$", "$\\sqrt{n+1}\\,|n\\rangle$"], "answerIndex": 1, "solution": "The normalization follows from $b b^\\dagger=n+1$ and $b^\\dagger b=n$, Eq. (1.45). The option $(n+1)|n+1\\rangle$ is wrong because the normalization is a square root.", "source": "Sec. 1.3.2, Eqs. (1.45)-(1.46)"}, {"id": "ch01-E4", "tier": "easy", "type": "free", "prompt": "Write the kinetic energy and the Fourier component $\\hat\\rho_\\sigma(q)$ of free electrons in the plane-wave basis.", "solution": "$$\\hat T=\\sum_{k\\sigma}\\varepsilon_k\\,c^\\dagger_{k\\sigma}c_{k\\sigma},\\qquad \\varepsilon_k=\\frac{\\hbar^2k^2}{2m},$$\n$$\\hat\\rho_\\sigma(q)=\\sum_k c^\\dagger_{k\\sigma}c_{k+q\\,\\sigma}.$$\nThe density operator changes the momentum by q, so it creates particle-hole pairs.", "source": "Sec. 1.4.3, Eqs. (1.89), (1.95)"}, {"id": "ch01-E5", "tier": "easy", "type": "free", "prompt": "For $\\hat H=\\sum_{ij}a^\\dagger_i h_{ij}a_j$ with $h$ hermitian, what must the unitary $U$ in $\\alpha_i=\\sum_j U_{ij}a_j$ satisfy so that $\\hat H=\\sum_i\\epsilon_i\\alpha^\\dagger_i\\alpha_i$?", "solution": "Write $a=U^\\dagger\\alpha$, so $a^\\dagger=\\alpha^\\dagger U$ and $\\hat H=\\alpha^\\dagger(UhU^\\dagger)\\alpha$.\nThe condition is\n$$UhU^\\dagger=\\mathrm{diag}(\\epsilon_1,\\epsilon_2,\\dots).$$\nEquivalently, the $i$-th row $u_i$ of $U$ satisfies $u_i h=\\epsilon_i u_i$. Because $U$ is unitary, the new $\\alpha_i$ obey the same canonical algebra as the $a_i$, Eq. (1.65).", "source": "Ex. 1.3; Sec. 1.3.5, Eq. (1.65)"}, {"id": "ch01-H1", "tier": "hard", "type": "free", "prompt": "Prove that the one-body operator $\\hat T=\\sum_{\\nu\\mu}T_{\\nu\\mu}c^\\dagger_\\nu c_\\mu$ holds for fermions (Eq. 1.61), by repeating the boson argument of Eqs. (1.58)-(1.60) (Book Exercise 1.1).", "solution": "Book Exercise 1.1. Act with $\\hat T_{tot}=\\sum_j T_j$ on $|\\nu_1\\cdots\\nu_N\\rangle=c^\\dagger_{\\nu_1}\\cdots c^\\dagger_{\\nu_N}|0\\rangle$. Each term $T_j$ replaces the operator in position $j$, so\n$$\\hat T|\\nu_1\\cdots\\nu_N\\rangle=\\sum_j\\sum_{ab}T_{ab}\\,\\delta_{a,\\nu_j}\\,c^\\dagger_{\\nu_1}\\cdots\\underbrace{c^\\dagger_b}_{\\text{position }j}\\cdots c^\\dagger_{\\nu_N}|0\\rangle,$$\nwith $T_{ab}=\\int dr\\,\\psi^*_b T\\psi_a$ as in Eq. (1.27b).\n\nSign count for fermions. Writing the replacement as an operator, $c_a$ must first move past the $j-1$ operators in front of position $j$, giving $(-1)^{j-1}$. Then $c^\\dagger_b$ must move back to position $j$, giving another $(-1)^{j-1}$. The two signs cancel, so each occurrence gives the same term with a plus sign.\n\nSumming over $j$ (the occupied states $a$ that equal $\\nu_j$) gives $\\sum_{ab}T_{ab}c^\\dagger_b c_a$ acting on the state, which is the operator form. Relabeling indices gives $\\hat T=\\sum_{\\nu\\mu}T_{\\nu\\mu}c^\\dagger_\\nu c_\\mu$, Eq. (1.61).\nResult: the one-body operator has the same form for fermions as for bosons, because the sign from the anticommutators cancels.", "source": "Ex. 1.1; Sec. 1.3.4, Eqs. (1.58)-(1.61)"}, {"id": "ch01-H2", "tier": "hard", "type": "free", "prompt": "Tight-binding model: $\\hat H=-t\\sum_{j,\\delta}c^\\dagger_{j+\\delta}c_j$ with nearest neighbors $\\delta$. Diagonalize it for a 1D ring of $N$ sites with lattice constant $a$ and for a 2D square lattice (Book Exercise 1.4).", "solution": "Book Exercise 1.4. Use $c_j=N^{-1/2}\\sum_k e^{ikja}c_k$ with $k=2\\pi n/(Na)$ in the first Brillouin zone. Then\n$$\\sum_j c^\\dagger_{j+\\delta}c_j=\\sum_k e^{-ik\\delta a}c^\\dagger_k c_k,$$\nbecause the sum over $j$ gives $\\delta_{kk'}$. Summing over the two neighbors $\\delta=\\pm a$ in 1D:\n$$\\hat H=\\sum_k\\varepsilon_k c^\\dagger_kc_k,\\qquad \\varepsilon_k=-2t\\cos ka.$$\nIn 2D, each direction contributes its own cosine:\n$$\\varepsilon_{\\mathbf k}=-2t\\left(\\cos k_xa+\\cos k_ya\\right).$$\nFor $t>0$ the band minimum is at $k=0$ and the bandwidth is $4t$ in 1D and $8t$ in 2D. The Hamiltonian is diagonal in $k$ because it is translation invariant.", "source": "Ex. 1.4; Secs. 1.3.5-1.3.6, Eqs. (1.65), (1.72)-(1.73)"}, {"id": "ch01-H3", "tier": "hard", "type": "free", "prompt": "Show that the Yukawa potential $V(r)=\\frac{e^2}{4\\pi\\epsilon_0 r}e^{-k_s r}$ has Fourier transform $V_q=\\frac{e^2}{\\epsilon_0(q^2+k_s^2)}$, and recover the Coulomb $V_q$ for $k_s\\to0$ (Book Exercise 1.6).", "solution": "Book Exercise 1.6. Write $e_0^2=e^2/4\\pi\\epsilon_0$. Use spherical coordinates with $\\mathbf q$ along the polar axis. The angular integral gives $\\int d\\cos\\theta\\,d\\phi\\,e^{-iqr\\cos\\theta}=4\\pi\\,\\sin(qr)/(qr)$, so\n$$V_q=\\int d^3r\\,e^{-i\\mathbf q\\cdot\\mathbf r}V(r)=\\frac{4\\pi e_0^2}{q}\\int_0^\\infty dr\\,e^{-k_sr}\\sin(qr).$$\nThe $r^2$ from the volume element cancels the $1/r$ in the potential. The remaining radial integral is elementary:\n$$\\int_0^\\infty dr\\,e^{-k_sr}\\sin(qr)=\\frac{q}{q^2+k_s^2}.$$\nHence $V_q=4\\pi e_0^2/(q^2+k_s^2)=e^2/[\\epsilon_0(q^2+k_s^2)]$. Setting $k_s\\to0$ gives $e^2/(\\epsilon_0 q^2)$, the Coulomb result of Eq. (1.102).", "source": "Ex. 1.6; Sec. 1.4.4, Eqs. (1.100b), (1.102)"}, {"id": "ch01-H4", "tier": "hard", "type": "free", "prompt": "Bogoliubov transformation for fermions. $\\hat H=E_0(a^\\dagger a+b^\\dagger b)+E_1(a^\\dagger b^\\dagger+ba)$ with $a=u\\alpha-v\\beta^\\dagger$, $b=u\\beta+v\\alpha^\\dagger$, $u,v$ real. Find the conditions on $u,v$ and the diagonal form of $\\hat H$ (Book Exercise 1.7).", "solution": "Book Exercise 1.7. The anticommutators $\\{a,a^\\dagger\\}=1$ and $\\{b,b^\\dagger\\}=1$ with $\\{\\alpha,\\alpha^\\dagger\\}=\\{\\beta,\\beta^\\dagger\\}=1$ give $u^2+v^2=1$.\n\nInsert the transformation. Using $\\alpha\\beta=-\\beta\\alpha$ and $\\alpha\\alpha^\\dagger=1-\\alpha^\\dagger\\alpha$:\n$$a^\\dagger a+b^\\dagger b=(u^2-v^2)(\\alpha^\\dagger\\alpha+\\beta^\\dagger\\beta)+2v^2-2uv(\\alpha^\\dagger\\beta^\\dagger+\\beta\\alpha)$$\n$$a^\\dagger b^\\dagger+ba=(u^2-v^2)(\\alpha^\\dagger\\beta^\\dagger+\\beta\\alpha)+2uv(\\alpha^\\dagger\\alpha+\\beta^\\dagger\\beta-1)$$\n\nCancelling the pair terms $(\\alpha^\\dagger\\beta^\\dagger+\\beta\\alpha)$ requires\n$$E_1(u^2-v^2)-2uvE_0=0.$$\nWith $u=\\cos t$, $v=\\sin t$ this is $E_1\\cos2t=E_0\\sin2t$, so $\\tan2t=E_1/E_0$. Let $\\lambda=\\sqrt{E_0^2+E_1^2}$, so $\\cos2t=E_0/\\lambda$ and $\\sin2t=E_1/\\lambda$. The diagonal coefficient is\n$$E_0\\cos2t+E_1\\sin2t=\\lambda.$$\nResult: $\\hat H=\\lambda(\\alpha^\\dagger\\alpha+\\beta^\\dagger\\beta)+\\text{const}$, with the constant from the $2v^2E_0-2uvE_1$ terms.", "source": "Ex. 1.7; Sec. 1.3.3, Eqs. (1.52)-(1.57)"}]}, {"chapter": "2", "title": "The electron gas", "scope": "Secs. 2.1 (lattice and jellium, non-interacting, finite T) and 2.2 (first and second order perturbation theory). Excluded: 2.3 (electron gases in 3, 2, 1, 0 dimensions, Eqs. 2.50-2.55); its exercises are used here only as 2D and 1D analogues of Sec. 2.1.2.", "sections": [{"id": "2.1", "title": "The non-interacting electron gas", "keyResults": [{"name": "Full electron-ion Hamiltonian", "latex": "$$H=(T_{ion}+V^{ion}_{ion})+(T_{el}+V^{el}_{el})+V^{el}_{ion}$$", "note": "Eqs. (2.1)-(2.4). Each term is written in second quantization, with no double counting in the electron-ion term."}]}, {"id": "2.1.1", "title": "Bloch theory of electrons in a static ion lattice", "keyResults": [{"name": "Bloch theorem", "latex": "$$\\psi_{n\\mathbf k\\sigma}(\\mathbf r)=u_{n\\mathbf k}(\\mathbf r)\\,e^{i\\mathbf k\\cdot\\mathbf r}\\chi_\\sigma,\\qquad u_{n\\mathbf k}(\\mathbf r+\\mathbf R)=u_{n\\mathbf k}(\\mathbf r)$$", "note": "Eqs. (2.7)-(2.15). The reciprocal lattice is in Eqs. (2.7)-(2.10), and k is taken in the first Brillouin zone."}, {"name": "Effective mass approximation", "latex": "$$\\psi_{n\\mathbf k\\sigma}\\to e^{i\\mathbf k\\cdot\\mathbf r}\\chi_\\sigma\\ \\text{with}\\ m\\to m^*$$", "note": "Eq. (2.16). Bloch electrons are treated as plane waves with an effective mass."}]}, {"id": "2.1.2", "title": "Non-interacting electrons in the jellium model", "keyResults": [{"name": "Jellium kinetic Hamiltonian", "latex": "$$\\hat H_{jel}=\\sum_{\\mathbf k\\sigma}\\frac{\\hbar^2k^2}{2m}\\,c^\\dagger_{\\mathbf k\\sigma}c_{\\mathbf k\\sigma}$$", "note": "Eqs. (2.17)-(2.19). The ion jellium and the homogeneous electron background are neutral, so only T_el remains."}, {"name": "Fermi wavenumber and density", "latex": "$$k_F=\\frac{\\sqrt{2m\\varepsilon_F}}{\\hbar},\\qquad k_F^3=3\\pi^2n,\\qquad v_F=\\frac{\\hbar k_F}{m}$$", "note": "Eqs. (2.23), (2.26). Spin degeneracy 2 is included."}, {"name": "Ground state energy", "latex": "$$E^{(0)}=\\tfrac35\\,N\\varepsilon_F$$", "note": "Eq. (2.28). Each electron gets the average of the Fermi-sea kinetic energy."}, {"name": "Density of states (both spins)", "latex": "$$D(\\varepsilon)=\\frac{\\mathcal V}{2\\pi^2}\\left(\\frac{2m}{\\hbar^2}\\right)^{3/2}\\sqrt{\\varepsilon}\\,\\theta(\\varepsilon)$$", "note": "Eqs. (2.29)-(2.31). Per unit volume it is d(eps) = D/V."}]}, {"id": "2.1.3", "title": "Non-interacting electrons at finite temperature", "keyResults": [{"name": "Fermi-Dirac occupation and low-T limit", "latex": "$$n_F(\\varepsilon_k)=\\frac{1}{e^{\\beta(\\varepsilon_k-\\mu)}+1}\\ \\xrightarrow{T\\to0}\\ \\theta(\\mu-\\varepsilon_k)$$", "note": "Eq. (2.32). The chemical potential equals eps_F at T = 0 and changes only weakly with T."}]}, {"id": "2.2", "title": "Electron interactions in perturbation theory", "keyResults": [{"name": "Wigner-Seitz radius", "latex": "$$r_s=\\frac{(9\\pi/4)^{1/3}}{a_0k_F}$$", "note": "Eq. (2.37). Defined by (4 pi/3)(r_s a_0)^3 n = 1."}, {"name": "Coulomb interaction without the q = 0 term", "latex": "$$\\hat V^{el}_{el}=\\frac{1}{2\\mathcal V}\\sum_{\\sigma_1\\sigma_2}\\sum_{k_1k_2q}{}'\\,\\frac{4\\pi e_0^2}{q^2}\\,c^\\dagger_{k_1+q\\sigma_1}c^\\dagger_{k_2-q\\sigma_2}c_{k_2\\sigma_2}c_{k_1\\sigma_1}$$", "note": "Eq. (2.34). The prime removes q = 0, which the positive background cancels. Here e_0^2 = e^2/(4 pi epsilon_0) is the Coulomb constant of Eq. (1.100b)."}]}, {"id": "2.2.1", "title": "Electron interactions in first-order perturbation theory", "keyResults": [{"name": "First-order energy per particle", "latex": "$$\\frac{E^{(0)}+E^{(1)}}{N}=\\frac{2.21}{r_s^2}-\\frac{0.916}{r_s}\\ \\text{Ry}$$", "note": "Eqs. (2.38), (2.42)-(2.43). The 2.21 Ry is the kinetic term and 0.916 Ry is the exchange term."}, {"name": "Equilibrium density", "latex": "$$r_s^*=4.83,\\qquad \\frac{E^*}{N}\\approx-0.095\\ \\text{Ry}\\approx-1.29\\ \\text{eV}$$", "note": "Eq. (2.44). The book lists Na (r_s = 3.96, -0.083 Ry, -1.13 eV) as the experimental comparison."}]}, {"id": "2.2.2", "title": "Electron interactions in second-order perturbation theory", "keyResults": [{"name": "Divergent direct second-order term", "latex": "$$E^{(2)}_{dir}\\propto\\int\\frac{dq}{q}\\ \\to\\ \\infty$$", "note": "Eqs. (2.46)-(2.49). The exchange term stays finite. The divergence is removed only at infinite order (Chap. 14)."}]}], "questions": [{"id": "ch02-E1", "tier": "easy", "type": "mc", "prompt": "In 3D, the Fermi wavenumber in terms of the electron density $n$ (spin 1/2) is", "choices": ["$(3\\pi^2 n)^{1/3}$", "$(6\\pi^2 n)^{1/3}$", "$(2\\pi n)^{1/2}$", "$\\pi n/2$"], "answerIndex": 0, "solution": "Counting states in $k$ space with spin 2 gives $n=k_F^3/(3\\pi^2)$, Eq. (2.26). The option $(6\\pi^2 n)^{1/3}$ forgets the spin factor 2.", "source": "Sec. 2.1.2, Eq. (2.26)"}, {"id": "ch02-E2", "tier": "easy", "type": "free", "prompt": "Show that $E^{(0)}/N=\\tfrac35\\varepsilon_F$ for the free electron gas at $T=0$.", "solution": "Sum the kinetic energy over the Fermi sphere with spin 2:\n$$E^{(0)}=2\\frac{\\mathcal V}{(2\\pi)^3}\\int_{k<k_F}4\\pi k^2dk\\,\\frac{\\hbar^2k^2}{2m}=\\frac{\\mathcal V\\hbar^2k_F^5}{10\\pi^2m}.$$\nWith $N=\\mathcal Vk_F^3/(3\\pi^2)$,\n$$\\frac{E^{(0)}}{N}=\\frac{3\\hbar^2k_F^2}{10m}=\\frac35\\cdot\\frac{\\hbar^2k_F^2}{2m}=\\frac35\\varepsilon_F.$$", "source": "Sec. 2.1.2, Eq. (2.28)"}, {"id": "ch02-E3", "tier": "easy", "type": "mc", "prompt": "At small Wigner-Seitz radius $r_s$ (high density) in the jellium gas:", "choices": ["The kinetic energy dominates, because it scales as $r_s^{-2}$ and the Coulomb term scales as $r_s^{-1}$", "The kinetic energy dominates, because it scales as $r_s^{2}$", "The Coulomb energy dominates, because it scales as $r_s^{-2}$", "Neither dominates, because both scale as $r_s^{-1}$"], "answerIndex": 0, "solution": "Eq. (2.38) gives $E^{(0)}/N\\propto r_s^{-2}$ and Eq. (2.42) gives $E^{(1)}/N\\propto r_s^{-1}$. The ratio is $\\propto r_s$, so the kinetic term wins at small $r_s$.", "source": "Sec. 2.2, Eqs. (2.35)-(2.38), (2.42)"}, {"id": "ch02-E4", "tier": "easy", "type": "free", "prompt": "Why is there no direct first-order (Hartree, $q=0$) energy in jellium, and what sign does the exchange term have?", "solution": "The $q=0$ Coulomb term is cancelled by the uniform positive background, so the prime in Eq. (2.34) removes it.\n\nThe exchange term from Eq. (2.42) is $E^{(1)}/N=-0.916/r_s$ Ry, which is negative. It lowers the energy and binds the gas, because the Pauli principle keeps same-spin electrons apart.", "source": "Sec. 2.2.1, Eqs. (2.34), (2.42)-(2.43)"}, {"id": "ch02-H1", "tier": "hard", "type": "free", "prompt": "Derive $k_F$ and the density of states per area $d(\\varepsilon)$ for a 2D electron gas, in analogy with Sec. 2.1.2 (Book Exercise 2.4).", "solution": "Book Exercise 2.4. With spin 2 and area $A$, the number of states inside a disk of radius $k_F$ is\n$$N=2A\\frac{\\pi k_F^2}{(2\\pi)^2}\\quad\\Rightarrow\\quad n=\\frac{k_F^2}{2\\pi},\\qquad k_F=\\sqrt{2\\pi n}.$$\nThe energy in terms of $n$ is $\\varepsilon=\\hbar^2k^2/2m$, so the number of states per area below $\\varepsilon$ is\n$$n(\\varepsilon)=\\frac{k^2}{2\\pi}=\\frac{m\\varepsilon}{\\pi\\hbar^2}.$$\nDifferentiating gives the density of states per area\n$$d(\\varepsilon)=\\frac{m}{\\pi\\hbar^2}\\,\\theta(\\varepsilon),$$\nwhich is constant in energy (spin included).", "source": "Ex. 2.4; method of Sec. 2.1.2, Eqs. (2.23), (2.29)-(2.31)"}, {"id": "ch02-H2", "tier": "hard", "type": "free", "prompt": "Same as H1 for a 1D electron gas: find $k_F$ and the density of states per length (Book Exercise 2.5).", "solution": "Book Exercise 2.5. With spin 2 and length $L$, the occupied states are $|k|<k_F$, with $k=2\\pi n/L$. Then\n$$N=2\\,L\\frac{2k_F}{2\\pi}\\quad\\Rightarrow\\quad n=\\frac{2k_F}{\\pi},\\qquad k_F=\\frac{\\pi n}{2}.$$\nThe number of states per length below energy $\\varepsilon$ is $n(\\varepsilon)=\\frac{2}{\\pi}k(\\varepsilon)$ with $k=\\sqrt{2m\\varepsilon}/\\hbar$. Therefore\n$$d(\\varepsilon)=\\frac{dn}{d\\varepsilon}=\\frac{1}{\\pi\\hbar}\\sqrt{\\frac{2m}{\\varepsilon}}\\,\\theta(\\varepsilon),$$\nwhich diverges as $\\varepsilon^{-1/2}$ at the band edge.", "source": "Ex. 2.5; method of Sec. 2.1.2"}, {"id": "ch02-H3", "tier": "hard", "type": "free", "prompt": "Minimize the first-order energy $E/N=2.21/r_s^2-0.916/r_s$ Ry to find $r_s^*$ and $E^*/N$, and compare with Na.", "solution": "Set $\\partial_{r_s}(E/N)=0$:\n$$-\\frac{2\\cdot2.21}{r_s^3}+\\frac{0.916}{r_s^2}=0\\quad\\Rightarrow\\quad r_s^*=\\frac{2\\cdot2.21}{0.916}\\approx4.83.$$\nAt this point\n$$\\frac{E^*}{N}=\\frac{2.21}{r_s^{*2}}-\\frac{0.916}{r_s^*}=-\\frac{0.916^2}{4\\cdot2.21}\\approx-0.095\\ \\text{Ry}\\approx-1.29\\ \\text{eV}.$$\nFor comparison, the book's experimental value for Na is $r_s=3.96$ and $-0.083$ Ry, which is $-1.13$ eV (Eq. 2.44). The first-order formula at $r_s=3.96$ gives about $-0.090$ Ry, so the approximation is close but not exact.", "source": "Sec. 2.2.1, Eqs. (2.43)-(2.44)"}]}, {"chapter": "5", "title": "Time dependence in quantum theory", "scope": "Secs. 5.1 to 5.6 and 5.8 (Schrodinger, Heisenberg and interaction pictures, linear response time evolution, time-dependent operators, Fermi's golden rule, Fourier transforms of retarded and advanced functions). Excluded: 5.7 (T-matrix and generalized golden rule, Eqs. 5.35-5.41), 5.9 is a summary.", "sections": [{"id": "5.1", "title": "The Schrodinger picture", "keyResults": [{"name": "Schrodinger time evolution", "latex": "$$|\\psi(t)\\rangle=e^{-iHt}|\\psi(0)\\rangle,\\qquad i\\partial_t|\\psi(t)\\rangle=H|\\psi(t)\\rangle$$", "note": "Eqs. (5.1)-(5.3). Energies are measured in frequency units (hbar = 1)."}]}, {"id": "5.2", "title": "The Heisenberg picture", "keyResults": [{"name": "Heisenberg operators and equation of motion", "latex": "$$A(t)=e^{iHt}Ae^{-iHt},\\qquad \\dot A(t)=i[H,A](t)+(\\partial_tA)(t)$$", "note": "Eqs. (5.4)-(5.6)."}]}, {"id": "5.3", "title": "The interaction picture", "keyResults": [{"name": "Interaction-picture operators and states", "latex": "$$\\hat A(t)=e^{iH_0t}Ae^{-iH_0t},\\qquad i\\partial_t\\hat\\psi(t)=\\hat V(t)\\hat\\psi(t)$$", "note": "Eqs. (5.7)-(5.10). The fast H_0 phase is pulled out, so only V(t) drives the states."}, {"name": "Time-ordered evolution operator", "latex": "$$\\hat U(t,t_0)=\\mathcal T_t\\exp\\!\\left[-i\\int_{t_0}^t dt'\\,\\hat V(t')\\right]$$", "note": "Eqs. (5.11)-(5.18). Solves i d/dt U = V U with U(t0,t0) = 1; the n-th order term has the prefactor (-i)^n/n!."}]}, {"id": "5.4", "title": "Time-evolution in linear response", "keyResults": [{"name": "First-order evolution operator", "latex": "$$\\hat U(t,t_0)\\approx1-i\\int_{t_0}^t dt'\\,\\hat V(t')$$", "note": "Eq. (5.19). Starting point of the Kubo formula in Chap. 6."}]}, {"id": "5.5", "title": "Time-dependent creation and annihilation operators", "keyResults": [{"name": "Free time dependence", "latex": "$$a_\\nu(t)=e^{-i\\varepsilon_\\nu t}a_\\nu,\\qquad a^\\dagger_\\nu(t)=e^{i\\varepsilon_\\nu t}a^\\dagger_\\nu$$", "note": "Eqs. (5.22)-(5.25)."}, {"name": "Two-time (anti)commutator for free operators", "latex": "$$[a_{\\nu_1}(t_1),a^\\dagger_{\\nu_2}(t_2)]_{\\mp}=e^{-i\\varepsilon_{\\nu_1}(t_1-t_2)}\\,\\delta_{\\nu_1\\nu_2}$$", "note": "Eq. (5.26)."}, {"name": "Equation of motion with interaction", "latex": "$$\\dot a_\\nu(t)=-i\\varepsilon_\\nu a_\\nu(t)+\\text{(three-operator terms)}$$", "note": "Eqs. (5.30)-(5.31). The three-operator terms generate a chain of higher products, so the hierarchy does not close."}]}, {"id": "5.6", "title": "Fermi's golden rule", "keyResults": [{"name": "Transition rate", "latex": "$$\\Gamma_{f\\leftarrow i}=2\\pi\\,|\\langle f|V|i\\rangle|^2\\,\\delta(E_f-E_i)$$", "note": "Eqs. (5.32)-(5.34). Valid for many-body states too (used in Chap. 10). hbar = 1."}]}, {"id": "5.8", "title": "Fourier transforms of advanced and retarded functions", "keyResults": [{"name": "Retarded function and its time-translation invariance", "latex": "$$C^R_{AB}(t,t')=-i\\theta(t-t')\\langle[A(t),B(t')]_{\\mp}\\rangle=C^R_{AB}(t-t')$$", "note": "Eqs. (5.42)-(5.43). Commutator for bosons, anticommutator for fermions."}, {"name": "Fourier transform with convergence factor", "latex": "$$C^R_{AB}(\\omega)=\\int dt\\,e^{i\\omega t}e^{-\\eta t}C^R_{AB}(t),\\qquad \\eta\\to0^+$$", "note": "Eqs. (5.44)-(5.46). Equivalent to the real-frequency transform with omega + i eta."}, {"name": "Inverse transform", "latex": "$$C^R_{AB}(t)=\\int\\frac{d\\omega}{2\\pi}\\,e^{-i\\omega t}\\,C^R_{AB}(\\omega)$$", "note": "Eq. (5.47). Standard inverse, applied after eta goes to 0."}, {"name": "Advanced function", "latex": "$$C^A_{AB}(t,t')=i\\theta(t'-t)\\langle[A(t),B(t')]_{\\mp}\\rangle$$", "note": "Eq. (5.48). Fourier transform is taken with omega - i eta."}]}], "questions": [{"id": "ch05-E1", "tier": "easy", "type": "free", "prompt": "Show $[AB,C]=A[B,C]+[A,C]B$ and $[AB,C]=A\\{B,C\\}-\\{A,C\\}B$.", "solution": "For the first identity, add and subtract $ACB$:\n$$[AB,C]=ABC-CAB=ABC-ACB+ACB-CAB=A[B,C]+[A,C]B.$$\nFor the second, add and subtract $ACB$ with the other sign:\n$$[AB,C]=ABC-CAB=ABC+ACB-ACB-CAB=A\\{B,C\\}-\\{A,C\\}B.$$\nThe first form suits bosons and the second suits fermions.", "source": "Ex. 5.4, Eqs. (E.5.3)-(E.5.4); Sec. 5.5, footnote 19 (used in Eqs. 5.23 and 5.31)"}, {"id": "ch05-E2", "tier": "easy", "type": "mc", "prompt": "For $\\hat H=\\sum_\\nu\\varepsilon_\\nu a^\\dagger_\\nu a_\\nu$, the Heisenberg-picture operator $a_\\nu(t)$ is", "choices": ["$a_\\nu e^{i\\varepsilon_\\nu t}$", "$a_\\nu e^{-i\\varepsilon_\\nu t}$", "$a_\\nu$", "$a^\\dagger_\\nu e^{-i\\varepsilon_\\nu t}$"], "answerIndex": 1, "solution": "From $\\dot a_\\nu=i[H,a_\\nu]=-i\\varepsilon_\\nu a_\\nu$, Eq. (5.23). The option $a_\\nu e^{+i\\varepsilon t}$ has the wrong sign in the exponent, and $a^\\dagger$ is the creation operator, not the annihilation operator.", "source": "Sec. 5.5, Eqs. (5.22)-(5.25)"}, {"id": "ch05-E3", "tier": "easy", "type": "mc", "prompt": "Fermi's golden rule for the transition rate between $|i\\rangle$ and $|f\\rangle$ is", "choices": ["$2\\pi|V_{fi}|^2\\,\\delta(E_f-E_i)$", "$|V_{fi}|^2/\\hbar$", "$2\\pi|V_{fi}|\\,\\delta(E_f-E_i)$", "$\\pi|V_{fi}|^2$"], "answerIndex": 0, "solution": "Eq. (5.34) with $\\hbar=1$. The rate is quadratic in the matrix element, and the delta function enforces energy conservation.", "source": "Sec. 5.6, Eq. (5.34)"}, {"id": "ch05-E4", "tier": "easy", "type": "free", "prompt": "What does the interaction picture split off, and why is it useful for perturbation theory?", "solution": "The interaction picture moves the trivial $H_0$ evolution into the operators, $\\hat A(t)=e^{iH_0t}Ae^{-iH_0t}$. The states then evolve only with $\\hat V(t)$, through $\\hat U(t,t_0)$, Eq. (5.11).\n\nExpanding $\\hat U$ in powers of $\\hat V$ gives a perturbation series, Eq. (5.18). Each order contains only the interaction, and the free phases are already in the operators.", "source": "Sec. 5.3, Eqs. (5.7)-(5.11)"}, {"id": "ch05-H1", "tier": "hard", "type": "free", "prompt": "Show that the third-order term of $\\hat U(t,t_0)$ equals $\\frac{(-i)^3}{3!}\\int\\!\\!\\int\\!\\!\\int \\mathcal T_t[\\hat V(t_1)\\hat V(t_2)\\hat V(t_3)]$ (Book Exercise 5.2).", "solution": "Book Exercise 5.2. Iterating $\\hat U=1-i\\int\\hat V\\,\\hat U$ (Eq. 5.14) gives the ordered term\n$$\\hat U_3=(-i)^3\\int_{t_0}^t dt_1\\int_{t_0}^{t_1}dt_2\\int_{t_0}^{t_2}dt_3\\,\\hat V(t_1)\\hat V(t_2)\\hat V(t_3),$$\nwhere the integration region is $t_1>t_2>t_3$.\n\nThe time-ordered product $\\mathcal T_t[\\hat V(t_1)\\hat V(t_2)\\hat V(t_3)]$ is the same for every ordering of the three times, once the operators are placed in time order (Eq. 5.17). Over the full cube $[t_0,t]^3$ each of the $3!=6$ orderings contributes the same integral after relabeling. So the ordered integral is $1/3!$ of the unrestricted integral of the time-ordered product.\n\nHence\n$$\\hat U_3=\\frac{(-i)^3}{3!}\\int\\!\\!\\int\\!\\!\\int_{t_0}^t\\mathcal T_t[\\hat V(t_1)\\hat V(t_2)\\hat V(t_3)],$$\nwhich is the n = 3 term of the exponential in Eq. (5.18).", "source": "Ex. 5.2; Sec. 5.3, Eqs. (5.15)-(5.18)"}, {"id": "ch05-H2", "tier": "hard", "type": "free", "prompt": "Show that $\\int dx\\,\\frac{f(x)}{x+i\\eta}=\\mathcal P\\!\\!\\int dx\\,\\frac{f(x)}{x}-i\\pi f(0)$ for $\\eta\\to0^+$ (Book Exercise 5.7).", "solution": "Book Exercise 5.7. Split the denominator into real and imaginary parts:\n$$\\frac{1}{x+i\\eta}=\\frac{x}{x^2+\\eta^2}-i\\frac{\\eta}{x^2+\\eta^2}.$$\nAs $\\eta\\to0^+$, the first term tends to the principal value $\\mathcal P(1/x)$ in the distributional sense. The second term is a Lorentzian of width $\\eta$ and weight $\\pi$, so $\\frac{\\eta}{x^2+\\eta^2}\\to\\pi\\delta(x)$. Therefore\n$$\\int dx\\,\\frac{f(x)}{x+i\\eta}\\to\\mathcal P\\!\\!\\int dx\\,\\frac{f(x)}{x}-i\\pi f(0).$$", "source": "Ex. 5.7; Sec. 5.8"}, {"id": "ch05-H3", "tier": "hard", "type": "free", "prompt": "For $f^R(t)=-i\\theta(t)e^{-i\\varepsilon t}$, compute $f^R(\\omega)$ with Eq. (5.46) and invert it with Eq. (5.47) (Book Exercise 5.8).", "solution": "Book Exercise 5.8. With the convergence factor,\n$$f^R(\\omega)=\\int_0^\\infty dt\\,e^{i\\omega t}e^{-\\eta t}(-i)e^{-i\\varepsilon t}=-i\\int_0^\\infty dt\\,e^{i(\\omega-\\varepsilon+i\\eta)t}=\\frac{1}{\\omega-\\varepsilon+i\\eta},$$\nusing $\\int_0^\\infty e^{iat}dt=i/a$ for $\\mathrm{Im}\\,a>0$.\n\nInverse transform:\n$$f^R(t)=\\int\\frac{d\\omega}{2\\pi}e^{-i\\omega t}\\frac{1}{\\omega-\\varepsilon+i\\eta}.$$\nFor $t>0$, close the contour in the lower half plane, where $e^{-i\\omega t}$ decays. The only pole is at $\\omega=\\varepsilon-i\\eta$, enclosed clockwise, so\n$$f^R(t)=\\frac{1}{2\\pi}(-2\\pi i)\\,e^{-i\\varepsilon t}e^{-\\eta t}\\to-i\\,e^{-i\\varepsilon t}.$$\nFor $t<0$, close in the upper half plane. There is no pole, so $f^R(t)=0$.\nResult: $f^R(t)=-i\\theta(t)e^{-i\\varepsilon t}$, as required.", "source": "Ex. 5.8; Sec. 5.8, Eqs. (5.46)-(5.47)"}]}, {"chapter": "6", "title": "Linear response theory", "scope": "Secs. 6.1 to 6.4 (Kubo formula, frequency domain, conductivity, conductance, dielectric function, conductivity-dielectric relation). Sec. 6.5 is a summary.", "sections": [{"id": "6.1", "title": "The general Kubo formula", "keyResults": [{"name": "Kubo formula", "latex": "$$\\delta\\langle A\\rangle(t)=\\int_{t_0}^\\infty dt'\\,C^R_{AH'}(t,t'),\\qquad C^R_{AH'}(t,t')=-i\\theta(t-t')\\langle[\\hat A(t),\\hat H'(t')]\\rangle_0$$", "note": "Eqs. (6.6)-(6.8). The expectation value is taken in the unperturbed equilibrium state."}]}, {"id": "6.1.1", "title": "Kubo formula in the frequency domain", "keyResults": [{"name": "Response to a c-number perturbation", "latex": "$$H'(t)=B\\,f(t)\\ \\Rightarrow\\ \\delta\\langle A\\rangle(\\omega)=C^R_{AB}(\\omega)\\,f(\\omega)$$", "note": "Eqs. (6.9)-(6.12). The response depends only on the time difference, so the convolution becomes a product."}]}, {"id": "6.2", "title": "Kubo formula for conductivity", "keyResults": [{"name": "Conductivity tensor", "latex": "$$\\sigma^{\\alpha\\beta}(\\mathbf r,\\mathbf r',\\omega)=\\frac{ie^2}{\\omega}\\,\\Pi^R_{\\alpha\\beta}(\\mathbf r,\\mathbf r',\\omega)+\\frac{ie^2n(\\mathbf r)}{\\omega m}\\,\\delta(\\mathbf r-\\mathbf r')\\,\\delta_{\\alpha\\beta}$$", "note": "Eqs. (6.22)-(6.24). Pi^R is the retarded current-current function of the equilibrium current. The second term is the diamagnetic term (from J^A in Eq. 1.98c)."}, {"name": "Retarded current-current function", "latex": "$$\\Pi^R_{\\alpha\\beta}(\\mathbf r,\\mathbf r',t-t')=-i\\theta(t-t')\\langle[\\hat J^\\alpha_0(\\mathbf r,t),\\hat J^\\beta_0(\\mathbf r',t')]\\rangle$$", "note": "Eq. (6.25), used in Eqs. (6.23)-(6.24). Finding the conductivity reduces to this correlation function."}]}, {"id": "6.3", "title": "Kubo formula for conductance", "keyResults": [{"name": "Conductance from the current correlation function", "latex": "$$G=\\lim_{\\omega\\to0}\\mathrm{Re}\\!\\left[\\frac{ie^2}{\\omega}\\,C^R_{II}(\\omega)\\right],\\qquad C^R_{II}(t-t')=-i\\theta(t-t')\\langle[\\hat I(t),\\hat I(t')]\\rangle$$", "note": "Eqs. (6.29)-(6.31). I is the total particle current through any cross-section. The 1/omega factor is the one consistent with Eq. (6.24)."}]}, {"id": "6.4", "title": "Kubo formula for the dielectric function", "keyResults": [{"name": "Polarizability", "latex": "$$\\chi^R_e(\\mathbf rt,\\mathbf r't')=-i\\theta(t-t')\\langle[\\hat\\rho_e(\\mathbf r,t),\\hat\\rho_e(\\mathbf r',t')]\\rangle$$", "note": "Eqs. (6.37a)-(6.37b). Induced charge response to the external potential."}, {"name": "Inverse dielectric function", "latex": "$$\\varepsilon^{-1}(\\mathbf rt,\\mathbf r't')=\\delta(\\mathbf r-\\mathbf r')\\delta(t-t')+\\int d\\mathbf r''\\,V_c(\\mathbf r-\\mathbf r'')\\,\\chi^R_e(\\mathbf r''t,\\mathbf r't')$$", "note": "Eq. (6.40). V_c is the Coulomb interaction, V_c(r) = 1/(4 pi epsilon_0 r)."}]}, {"id": "6.4.1", "title": "Dielectric function for translation-invariant system", "keyResults": [{"name": "Dielectric function in momentum space", "latex": "$$\\varepsilon^{-1}(q,\\omega)=1+V_c(q)\\,\\chi^R_e(q,\\omega)$$", "note": "Eqs. (6.41)-(6.42). Both Eqs. (6.35) become convolutions after Fourier transformation."}]}, {"id": "6.4.2", "title": "Relation between dielectric function and conductivity", "keyResults": [{"name": "Dielectric function from the conductivity", "latex": "$$\\varepsilon^{-1}(q,\\omega)=1-\\frac{iq^2}{\\omega}\\,V_c(q)\\,\\sigma(q,\\omega)$$", "note": "Eq. (6.46). From Eqs. (6.42)-(6.45): the continuity equation (6.44) with J = -i sigma q phi_ext gives chi = -i q^2 sigma/omega."}]}], "questions": [{"id": "ch06-E1", "tier": "easy", "type": "mc", "prompt": "The Kubo formula expresses the linear response through", "choices": ["an equal-time expectation value in the perturbed state", "a retarded commutator correlation function in the unperturbed equilibrium state, $-i\\theta(t-t')\\langle[\\hat A(t),\\hat H'(t')]\\rangle_0$", "a time-ordered product in the perturbed state", "an anticommutator of the unperturbed Hamiltonian with the observable"], "answerIndex": 1, "solution": "Eq. (6.8). The average is over the unperturbed equilibrium state, and the time dependence of the states is hidden in the commutator. The other options are not the Kubo form.", "source": "Sec. 6.1, Eq. (6.8)"}, {"id": "ch06-E2", "tier": "easy", "type": "free", "prompt": "Why does a convolution in time become a product in frequency? And why is the transform of the retarded function defined with $\\omega+i\\eta$?", "solution": "The retarded function depends only on the time difference, Eq. (6.10), so $\\delta\\langle A\\rangle(t)$ is a convolution in time, Eq. (6.11). The convolution theorem turns it into the product $C^R_{AB}(\\omega)f(\\omega)$, Eq. (6.12).\n\nThe response function does not decay in general, so the transform needs the convergence factor $e^{-\\eta t}$ in Eq. (5.46). This is the $\\omega\\to\\omega+i\\eta$ prescription used for all retarded functions.", "source": "Sec. 6.1.1, Eqs. (6.10)-(6.12); Sec. 5.8, Eq. (5.46)"}, {"id": "ch06-E3", "tier": "easy", "type": "free", "prompt": "Name the two terms in the Kubo conductivity and where each comes from.", "solution": "The conductivity, Eq. (6.24), has two terms:\n\n1. The paramagnetic term $\\frac{ie^2}{\\omega}\\Pi^R$, a retarded current-current correlation function. It comes from the response of the equilibrium current $\\hat J$ to the external vector potential.\n2. The diamagnetic term $\\frac{ie^2n}{\\omega m}\\delta(\\mathbf r-\\mathbf r')$. It comes from the explicit $A$-dependence of the current operator, Eq. (1.98c), which is linear in $A$ and contributes without any correlation function.", "source": "Sec. 6.2, Eqs. (6.20), (6.24); Sec. 1.4.3, Eq. (1.98)"}, {"id": "ch06-E4", "tier": "easy", "type": "mc", "prompt": "For a translation-invariant system, the inverse dielectric function $\\varepsilon^{-1}(q,\\omega)$ equals", "choices": ["$1+V_c(q)\\,\\chi^R(q,\\omega)$", "$1-V_c(q)\\,\\chi^R(q,\\omega)$", "$V_c(q)\\,\\chi^R(q,\\omega)$", "$1/(1+\\chi^R(q,\\omega))$"], "answerIndex": 0, "solution": "Eq. (6.42). The sign is positive because $\\phi_{tot}=\\phi_{ext}+\\phi_{ind}$ and $\\phi_{ind}=V_c\\,\\rho_{ind}=V_c\\chi^R\\phi_{ext}$ (Eqs. 6.38-6.39). The response $\\chi^R$ itself is negative at low frequency, which makes $\\varepsilon^{-1}<1$ (screening). The option $1/(1+\\chi^R)$ is not the form, because the inverse dielectric function is linear in $\\chi^R$.", "source": "Sec. 6.4.1, Eq. (6.42)"}, {"id": "ch06-H1", "tier": "hard", "type": "free", "prompt": "For a translation- and rotation-invariant system, relate $\\sigma(q,\\omega)$ to the current-current correlation function of $\\hat J(q)$ (Book Exercise 6.3).", "solution": "Book Exercise 6.3. With isotropy, $\\sigma_{\\alpha\\beta}(\\mathbf r,\\mathbf r')=\\delta_{\\alpha\\beta}\\sigma(\\mathbf r-\\mathbf r')$. Fourier transform in $\\mathbf r-\\mathbf r'$ and write $\\hat{\\mathbf J}(\\mathbf q)=\\int d\\mathbf r\\,e^{-i\\mathbf q\\cdot\\mathbf r}\\hat{\\mathbf J}(\\mathbf r)$. Then Eq. (6.24) gives\n$$\\sigma(\\mathbf q,\\omega)=\\frac{ie^2}{\\omega}\\left[\\frac{1}{\\mathcal V}\\,C^R_{J_\\alpha(\\mathbf q)J_\\alpha(-\\mathbf q)}(\\omega)+\\frac{n}{m}\\right].$$\nThe factor $1/\\mathcal V$ comes from the normalization of the translation-invariant correlation function (the sum over the volume). The diamagnetic term is $q$-independent and gives the constant $n/m$.\n\nThis is the $q$-space version of Eq. (6.24). It shows that the dc conductivity is set by the current-current correlation at momentum $\\mathbf q$, plus the diamagnetic constant.", "source": "Ex. 6.3; Sec. 6.2, Eq. (6.24)"}, {"id": "ch06-H2", "tier": "hard", "type": "free", "prompt": "Non-interacting gas at $q\\to0$: derive the current operator, check its time dependence, and find the conductivity. Then discuss the interacting translation-invariant case (Book Exercise 6.4 parts a, b and d; part c, the Drude comparison, is not used here).", "solution": "Book Exercise 6.4. (a) For free electrons the velocity is $\\mathbf v_k=\\mathbf k/m$. Taking $q\\to0$ in the current operator gives\n$$\\hat{\\mathbf J}(0)=\\frac1m\\sum_{k\\sigma}\\mathbf k\\,c^\\dagger_{k\\sigma}c_{k\\sigma}.$$\n\n(b) The operator $\\hat{\\mathbf J}(0)$ is diagonal in $k$, like $H_0=\\sum_k\\varepsilon_kc^\\dagger_kc_k$. Hence $[H_0,\\hat{\\mathbf J}(0)]=0$ and $\\hat{\\mathbf J}(0,t)=\\hat{\\mathbf J}(0)$. The retarded correlation function is then time-independent with zero commutator, so $\\Pi^R(0,\\omega)=0$. Eq. (6.24) gives\n$$\\sigma(0,\\omega)=\\frac{ie^2n}{m\\omega}.$$\n\nDissipative part: with $\\omega\\to\\omega+i\\eta$, $\\frac{i}{\\omega+i\\eta}=\\mathcal P\\frac{i}{\\omega}+\\pi\\delta(\\omega)$, so\n$$\\mathrm{Re}\\,\\sigma(0,\\omega)=\\frac{\\pi e^2n}{m}\\,\\delta(\\omega).$$\nThere is no absorption at finite frequency: the electrons accelerate freely.\n\n(d) With interactions, the total momentum $\\mathbf P=\\sum_k\\mathbf k\\,n_k$ still commutes with $H$, because the interaction depends only on differences of positions. So $\\hat{\\mathbf J}(0)=\\mathbf P/m$ commutes with $H$ and the same results follow: $\\Pi^R(0,\\omega)=0$ and the $\\delta(\\omega)$ weight is $\\pi e^2n/m$. The conclusion does not change at $q=0$.", "source": "Ex. 6.4 (a), (b), (d); Sec. 6.2, Eq. (6.24)"}, {"id": "ch06-H3", "tier": "hard", "type": "free", "prompt": "Show the symmetry $G(\\xi,\\xi',\\omega)=G(\\xi',\\xi,\\omega)$ of the dc conductance function (the Lehmann argument of Book Exercise 6.5).", "solution": "Book Exercise 6.5. Insert eigenstates of $H_0$ with weights $\\rho_n=e^{-\\beta E_n}/Z$ into the time-domain function $-i\\theta(t)\\langle[\\hat A(t),\\hat B]\\rangle$ and Fourier transform. The time integral gives the Lehmann representation\n$$C^R_{AB}(\\omega)=\\sum_{nn'}\\frac{(\\rho_n-\\rho_{n'})\\,A_{nn'}B_{n'n}}{\\omega+E_n-E_{n'}+i\\eta},\\qquad A_{nn'}=\\langle n|A|n'\\rangle.$$\n\nUse $1/(x+i\\eta)=\\mathcal P(1/x)-i\\pi\\delta(x)$. The delta-function (absorptive) part is\n$$-\\pi\\sum_{nn'}(\\rho_n-\\rho_{n'})A_{nn'}B_{n'n}\\,\\delta(\\omega+E_n-E_{n'})=-\\tfrac12\\int dt\\,e^{i\\omega t}\\langle[A(t),B(0)]\\rangle,$$\nwhich is the identity of part (a). It is the part that sets the dc dissipation and is the quantity entering $G$ in the book's hint. With $A=\\hat I(\\xi)$ and $B=\\hat I(\\xi')$ this gives\n$$G(\\xi,\\xi',\\omega)=\\frac{e^2}{2\\omega}\\int dt\\,e^{i\\omega t}\\langle[\\hat I(\\xi,t),\\hat I(\\xi',0)]\\rangle.$$\n\nPart (b). Time-translation invariance of the equilibrium average gives $\\langle[A(t),B(0)]\\rangle=\\langle[A(0),B(-t)]\\rangle=-\\langle[B(-t),A(0)]\\rangle$. Substituting $t\\to-t$,\n$$G_{AB}(\\omega)=-\\frac{e^2}{2\\omega}\\int dt\\,e^{-i\\omega t}\\langle[B(t),A(0)]\\rangle=G_{BA}(-\\omega).$$\nAt $\\omega\\to0$ the limit is the derivative, $G_{AB}(0)=\\frac{ie^2}{2}\\int dt\\,t\\,\\langle[A(t),B(0)]\\rangle$. The same substitution shows this integral is unchanged under $A\\leftrightarrow B$, so $G(\\xi,\\xi',0)=G(\\xi',\\xi,0)$.\n\nOnly the dc limit is shown, which is what the book needs.", "source": "Ex. 6.5; Sec. 6.3, Eqs. (6.28)-(6.31)"}]}, {"chapter": 7, "title": "Transport in mesoscopic systems", "scope": "Sec. 7.1 (S-matrix, unitarity, time reversal), Sec. 7.2 (Landauer and Landauer-Buttiker formulas), Sec. 7.3.1 (quantum point contact). Excludes Sec. 7.3.2 (Aharonov-Bohm).", "sections": [{"id": "7.1", "title": "The S-matrix and scattering states", "keyResults": [{"name": "Mesoscopic regime", "latex": "$$a_0 \\ll \\lambda_F \\lesssim \\ell_0 < L < \\ell_\\phi \\lesssim \\ell_{\\rm in}$$", "note": "Eq. (7.1); the sample is coherent over its whole length."}]}, {"id": "7.1.1", "title": "Definition of the S-matrix", "keyResults": [{"name": "Lead modes", "latex": "$$\\varepsilon_n\\chi_n = -\\frac{1}{2m}\\nabla_\\perp^2\\chi_n,\\qquad E = \\frac{k_n^2}{2m}+\\varepsilon_n,\\qquad k_n(E)=\\sqrt{2m(E-\\varepsilon_n)}$$", "note": "Eqs. (7.2a)-(7.2e); right and left movers e^{\\pm i k_n x} times transverse modes chi_n."}, {"name": "S-matrix relation", "latex": "$$c_{\\rm out} = S\\,c_{\\rm in},\\qquad S=\\begin{pmatrix} r & t' \\\\ t & r'\\end{pmatrix}$$", "note": "Eqs. (7.6)-(7.8); r, r' are reflection and t, t' transmission blocks of size N x N."}]}, {"id": "7.1.2", "title": "Definition of the scattering states", "keyResults": [{"name": "Scattering state normalization", "latex": "$$c_{\\rm in}(\\psi^{L}_{nE}) = (\\delta_{nn'},\\,0),\\qquad \\text{i.e. } a^+_{n'}=\\delta_{nn'},\\; b^-_{n'}=0$$", "note": "Eqs. (7.9)-(7.10) and (7.24); one unit incoming amplitude in one channel, none from the other lead."}]}, {"id": "7.1.3", "title": "Unitarity of the S-matrix", "keyResults": [{"name": "Unitarity of S", "latex": "$$S^\\dagger S = SS^\\dagger = 1$$", "note": "Eqs. (7.11)-(7.12); follows from conservation of probability current."}, {"name": "Block form of unitarity", "latex": "$$r^\\dagger r + t^\\dagger t = 1,\\qquad r^\\dagger t' + t^\\dagger r' = 0$$", "note": "Eq. (7.12) gives r^\\dagger r + t^\\dagger t = 1 (and r'^\\dagger r' + t'^\\dagger t' = 1); Eq. (7.13) gives r^\\dagger t' + t^\\dagger r' = 0 (and its partners). SS^\\dagger = 1 gives the same set with the order reversed."}]}, {"id": "7.1.4", "title": "Time-reversal symmetry", "keyResults": [{"name": "Time reversal for the S-matrix", "latex": "$$S(B) = S^{T}(-B)$$", "note": "Eqs. (7.19)-(7.21); reversing B by hand, since the field is treated as external."}]}, {"id": "7.2", "title": "Conductance and transmission coefficients", "keyResults": []}, {"id": "7.2.1", "title": "The Landauer formula, heuristic derivation", "keyResults": [{"name": "Landauer current", "latex": "$$I_e = -\\frac{2e}{h}\\int dE\\,\\mathrm{Tr}\\big[t^\\dagger t\\big]\\,\\big[n_F(E-\\mu_L)-n_F(E-\\mu_R)\\big]$$", "note": "Eqs. (7.28)-(7.29); electric current of electrons (charge -e), hence the minus sign; its magnitude is the particle current times e. The factor 2 is spin and the trace runs over the transverse channels."}, {"name": "Linear conductance at T=0", "latex": "$$G = \\frac{2e^2}{h}\\,\\mathrm{Tr}\\big[t^\\dagger(\\mu)t(\\mu)\\big] = \\frac{2e^2}{h}\\sum_n T_n(\\mu)$$", "note": "Eqs. (7.22) and (7.32); with h = 2 pi hbar, so e^2/h = e^2/(2 pi) in hbar = 1 units."}, {"name": "Finite-temperature conductance", "latex": "$$G = \\frac{2e^2}{h}\\sum_n\\int dE\\,T_n(E)\\left(-\\frac{\\partial n_F}{\\partial E}\\right)$$", "note": "Eq. (7.31); thermal smearing of the transmission."}]}, {"id": "7.2.2", "title": "The Landauer formula, linear response derivation", "keyResults": [{"name": "Linear response from the Kubo formula", "latex": "$$G = \\frac{2e^2}{h}\\int dE\\,\\mathrm{Tr}\\big[t^\\dagger t\\big]\\left(-\\frac{\\partial n_F}{\\partial E}\\right)$$", "note": "Starts from Eq. (6.30); commutator steps in Eqs. (7.33)-(7.42), with the unitarity relation Eq. (7.13) used in Eq. (7.41)."}]}, {"id": "7.2.3", "title": "The Landauer-Buttiker formalism for multiprobe systems", "keyResults": [{"name": "Multiprobe current", "latex": "$$I_\\alpha = \\frac{2e^2}{h}\\int dE\\left(-\\frac{\\partial n_F}{\\partial E}\\right)\\sum_{\\alpha'\\neq\\alpha}\\left(T_{\\alpha'\\alpha}V_\\alpha - T_{\\alpha\\alpha'}V_{\\alpha'}\\right),\\qquad V_\\alpha=\\mu_\\alpha/e$$", "note": "Eq. (7.45); the bracket (T_{alpha'alpha}V_alpha - T_{alpha alpha'}V_alpha') is as printed. The overall prefactor and sign are not legible in the source conversion; they follow from Eq. (7.30) with the 2e^2/h factor.", "checkerNote": "UNVERIFIED: prefactor/sign of Eq. (7.45) not readable in the md; bracket verified."}]}, {"id": "7.3", "title": "Electron wave guides", "keyResults": []}, {"id": "7.3.1", "title": "Quantum point contact and conductance quantization", "keyResults": [{"name": "Quantized conductance at T=0", "latex": "$$G = \\frac{2e^2}{h}\\sum_n \\Theta\\big(E_F-\\varepsilon_n^{\\max}\\big)$$", "note": "Eq. (7.56); each open transverse mode adds 2e^2/h."}, {"name": "Saddle-point transmission", "latex": "$$T_n(E)=\\left[1+\\exp\\left(-2\\pi\\,\\frac{E-V_0-(n+\\tfrac12)\\omega_y}{\\omega_x}\\right)\\right]^{-1}$$", "note": "Eqs. (7.57)-(7.58); saddle-point potential, inverted parabola of frequency omega_x along the wire. The step is a Fermi function in E: T_n = 1/2 at E = V_0 + (n+1/2)omega_y, with width of order omega_x/2pi.", "checkerNote": "UNVERIFIED against the printed book: the md of Eq. (7.58) drops the numeral before pi. The factor 2pi/omega_x follows from the standard Kemble/Buttiker result for an inverted oscillator of frequency omega_x; it agrees with the plan's omega_x/2 form."}]}], "questions": [{"id": "ch07-E1", "tier": "easy", "type": "mc", "prompt": "A single transverse channel with full transmission, $T=1$, is spin degenerate. At low temperature its conductance is", "choices": ["$e^2/h$", "$2e^2/h$", "$e^2/(2h)$", "$4e^2/h$"], "answerIndex": 1, "solution": "Eq. (7.32) gives $G=\\frac{2e^2}{h}\\sum_n T_n$. The factor 2 is the spin sum, so a fully open spin-degenerate channel gives $2e^2/h$. The answer $e^2/h$ would be the spinless result.", "source": "Sec. 7.2.1, Eq. (7.32)"}, {"id": "ch07-E2", "tier": "easy", "type": "free", "prompt": "Write the unitarity relations of the two-terminal S-matrix in terms of $r, r', t, t'$ and state what they express. Give the single-channel form.", "solution": "From $S^\\dagger S = SS^\\dagger = 1$ (Eqs. 7.12-7.13):\n$$r^\\dagger r + t^\\dagger t = 1,\\qquad r^\\dagger t' + t^\\dagger r' = 0.$$\nThey express conservation of probability current: the incoming flux equals the outgoing flux. For one channel, $|r|^2+|t|^2=1$.", "source": "Sec. 7.1.3, Eqs. (7.12)-(7.13)"}, {"id": "ch07-E3", "tier": "easy", "type": "mc", "prompt": "Time-reversal symmetry with the magnetic field reversed implies", "choices": ["$S(B)=S(-B)$", "$S(B)=S^\\dagger$", "$t=t'$ always", "$S(B)=S^{T}(-B)$"], "answerIndex": 3, "solution": "Complex conjugation followed by $B\\to-B$ gives $S(B)=S^{T}(-B)$ (Eq. 7.21). $S(B)=S(-B)$ misses the transpose. At $B=0$ the relation gives $S=S^T$, so $t'=t^T$ (for one channel $t=t'$), but this is not an identity at $B\\neq0$.", "source": "Sec. 7.1.4, Eqs. (7.19)-(7.21)"}, {"id": "ch07-E4", "tier": "easy", "type": "free", "prompt": "Why does a quantum point contact show conductance steps, and what smears them?", "solution": "Transverse confinement gives subbands with thresholds $\\varepsilon_n$. Each subband that is open at the Fermi level adds $2e^2/h$ (Eq. 7.56). Temperature smears the steps over about $k_BT$ compared with the subband spacing. The shape of the saddle barrier also smears them, through the tunneling width $\\omega_x$ of the transmission (Eq. 7.58).", "source": "Sec. 7.3.1, Eqs. (7.49)-(7.58)"}, {"id": "ch07-H1", "tier": "hard", "type": "free", "prompt": "Ex. 7.1. Find the transverse modes and energies for a rectangular cross section $[0,w_y]\\times[0,w_z]$ with hard walls, and for a circular cross section of radius $a$.", "solution": "Book Exercise 7.1. Rectangle: separate $\\chi_{n_yn_z}(y,z)$ into sines that vanish on the hard walls,\n$$\\chi_{n_yn_z}=\\frac{2}{\\sqrt{w_yw_z}}\\sin\\frac{n_y\\pi y}{w_y}\\sin\\frac{n_z\\pi z}{w_z},\\qquad \\varepsilon_{n_yn_z}=\\frac{\\pi^2}{2m}\\left(\\frac{n_y^2}{w_y^2}+\\frac{n_z^2}{w_z^2}\\right),$$\nwith $n_y,n_z\\geq1$ and $\\hbar=1$.\nCircle: $\\chi_{l n}\\propto J_l(\\gamma_{ln}r/a)\\,e^{il\\phi}$ with $J_l(\\gamma_{ln})=0$ ($\\gamma_{ln}$ the $n$-th root of $J_l$), so\n$$\\varepsilon_{ln}=\\frac{\\gamma_{ln}^2}{2ma^2}.$$\nThe modes then enter the lead expansion of Eq. (7.2).", "source": "Ex. 7.1; Sec. 7.1.1, Eq. (7.2)"}, {"id": "ch07-H2", "tier": "hard", "type": "free", "prompt": "Ex. 7.2. A 1D channel has a delta barrier $V_0\\delta(x)$. Find $r$ and $t$ for a wave incident from the left, then the low-temperature current for $\\mu_L\\neq\\mu_R$. Use $\\hbar=1$ and $z=mV_0/k$.", "solution": "Book Exercise 7.2. Continuity of $\\psi$ and the derivative jump $\\psi'(0^+)-\\psi'(0^-)=2mV_0\\,\\psi(0)$ give\n$$t=\\frac{1}{1+iz},\\qquad r=t-1=\\frac{-iz}{1+iz}.$$\nThen $|t|^2 = 1/(1+z^2)$. With $v_F=k/m$, $z=V_0/v_F$, so $T=1/(1+(V_0/v_F)^2)$.\nThe Landauer result (Eq. 7.32) at low temperature gives\n$$I=\\frac{2e^2}{h}\\,\\frac{1}{1+(V_0/v_F)^2}\\,V,$$\nwith $|eV|=|\\mu_L-\\mu_R|$ (the sign depends on the charge convention; the book writes $eV=\\mu_R-\\mu_L$).", "source": "Ex. 7.2; Sec. 7.2.1, Eqs. (7.28)-(7.32)"}, {"id": "ch07-H3", "tier": "hard", "type": "free", "prompt": "Ex. 7.3. (a) Starting from the Landauer current, show that the linear conductance at finite temperature is $G=\\frac{2e^2}{h}\\sum_n\\int dE\\,T_n(E)\\left(-\\partial_E n_F(E-\\mu)\\right)$. (b) For a parabolic transverse confinement take $T_n(E)=\\Theta(E-E_n)$ with $E_n=\\omega_T(n+\\tfrac12)$. Find $G(\\mu)$ and describe the steps. (c) How does the result change for a hard-wall (square-well) confinement? Compare with the saddle-point $T_n$ of Eq. (7.58).", "solution": "Book Exercise 7.3. (a) Expand $n_F(E-\\mu_L)-n_F(E-\\mu_R)$ in Eq. (7.29) to first order in $V_L-V_R$. The bracket becomes $(-\\partial_En_F)\\,e(V_L-V_R)$, which gives Eq. (7.31).\n(b) With $T_n=\\Theta(E-E_n)$ the energy integral is elementary, because $\\int_{E_n}^{\\infty}dE\\,(-\\partial_En_F(E-\\mu))=n_F(E_n-\\mu)$:\n$$G(\\mu)=\\frac{2e^2}{h}\\sum_n n_F(E_n-\\mu)=\\frac{2e^2}{h}\\sum_n\\frac{1}{e^{(E_n-\\mu)/k_BT}+1}.$$\nEach channel gives a step of height $2e^2/h$ centered at $\\mu=E_n=\\omega_T(n+\\tfrac12)$, evenly spaced by $\\omega_T$, and rounded over a width of order $k_BT$. At $k_BT/\\omega_T=0.05$ the steps are sharp, and at $0.15$ they are visibly smeared.\n(c) For a hard-wall channel $E_n\\propto n^2$ (Eq. 7.52), so the same formula holds but the step spacing grows with $n$. For the saddle-point $T_n$ of Eq. (7.58) the steps sit at $V_0+(n+\\tfrac12)\\omega_y$ and acquire an extra intrinsic width of order $\\omega_x/2\\pi$ on top of the thermal one.", "source": "Ex. 7.3; Sec. 7.2.1, Eqs. (7.29)-(7.31); Sec. 7.3.1, Eqs. (7.52), (7.58)"}]}, {"chapter": 8, "title": "Green's functions", "scope": "Sec. 8.1 (classical Green's functions), 8.2 and 8.2.1 (one-particle Green's function, S-matrix link), 8.3 (many-body single-particle functions, spectral function, broadening), 8.4.1 (tunneling spectroscopy), 8.5 (density response and Lindhard function). Summary omitted.", "sections": [{"id": "8.1", "title": "\"Classical\" Green's functions", "keyResults": [{"name": "Coulomb potential as Green's integral", "latex": "$$\\phi(\\mathbf r)=\\frac{1}{4\\pi\\varepsilon_0}\\int d\\mathbf r'\\,\\frac{\\rho_e(\\mathbf r')}{|\\mathbf r'-\\mathbf r|}$$", "note": "Eq. (8.6); a Poisson-type solution built from the free Green's function, Eqs. (8.1)-(8.3)."}]}, {"id": "8.2", "title": "Green's function for the one-particle Schrodinger equation", "keyResults": [{"name": "Free Green's function equation", "latex": "$$(E-H_0)\\,G_0(\\mathbf r,\\mathbf r',E)=\\delta(\\mathbf r-\\mathbf r')$$", "note": "Eq. (8.8); sign convention as printed in the book, with the operator acting on the first argument."}, {"name": "Dyson equation", "latex": "$$G = G_0 + G_0\\,V\\,G$$", "note": "Eq. (8.20); iteration gives the series in Eq. (8.18)."}]}, {"id": "8.2.1", "title": "Example: from the S-matrix to the Green's function", "keyResults": [{"name": "Green's function from S-matrix", "latex": "$$G^R(x,x',E)=t(E)\\,G^R_0(x,x',E)\\quad (x'<0,\\; x>W)$$", "note": "Eq. (8.27); in 1D with hbar = 1, G^R_0 = -(im/k) e^{ik(x-x')} for free motion."}]}, {"id": "8.3", "title": "Single-particle Green's functions of many-body systems", "keyResults": []}, {"id": "8.3.1", "title": "Green's function of translation-invariant systems", "keyResults": [{"name": "Momentum diagonal Green's function", "latex": "$$G(\\mathbf k,\\mathbf k') = \\delta_{\\mathbf k\\mathbf k'}\\,G(\\mathbf k)$$", "note": "Eqs. (8.35)-(8.36); follows from translation invariance."}]}, {"id": "8.3.2", "title": "Green's function of free electrons", "keyResults": [{"name": "Free retarded Green's function", "latex": "$$G^R_0(k\\sigma,\\omega)=\\frac{1}{\\omega-\\xi_k+i\\eta}$$", "note": "Eqs. (8.41c) and (8.55); time form -i theta(t) e^{-i xi_k t}."}, {"name": "Free greater Green's function", "latex": "$$G^>_0(k\\sigma,\\omega)=-2\\pi i\\,\\big(1-n_F(\\xi_k)\\big)\\,\\delta(\\omega-\\xi_k)$$", "note": "Eq. (8.43); the lesser function is G^<_0(k sigma, omega) = +2 pi i n_F(xi_k) delta(omega - xi_k), with the opposite sign and n_F in place of 1-n_F (Eq. 8.41b)."}]}, {"id": "8.3.3", "title": "The Lehmann representation", "keyResults": [{"name": "Lehmann representation", "latex": "$$G^R(\\nu,\\omega)=\\frac{1}{Z}\\sum_{n,n'}\\frac{\\big(e^{-\\beta E_n}+e^{-\\beta E_{n'}}\\big)\\,|\\langle n'|c^\\dagger_\\nu|n\\rangle|^2}{\\omega-(E_{n'}-E_n)+i\\eta}$$", "note": "Eqs. (8.45)-(8.48); poles at exact excitation energies E_{n'}-E_n. Checked against the denominators and the weights e^{-beta E_n}+e^{-beta E_n'} printed in Eq. (8.48)."}]}, {"id": "8.3.4", "title": "The spectral function", "keyResults": [{"name": "Spectral function", "latex": "$$A(\\nu,\\omega)=-2\\,\\mathrm{Im}\\,G^R(\\nu,\\omega)$$", "note": "Eq. (8.50) (definition); Eq. (8.49) is the Lehmann form of 2 Im G^R."}, {"name": "Greater and lesser functions", "latex": "$$iG^>(\\nu,\\omega)=A(\\nu,\\omega)\\big[1-n_F(\\omega)\\big],\\qquad iG^<(\\nu,\\omega)=-A(\\nu,\\omega)\\,n_F(\\omega)$$", "note": "Eqs. (8.51a,b) for fermions, with G^< = +i<c^dagger c> as in Eq. (8.31b). The minus sign in iG^< is fixed by Eqs. (8.41b), (8.62) and by G^R = theta(t)(G^> - G^<). The boson analogue (Ex. 8.4) has iG^< = +A n_B."}, {"name": "Spectral sum rule", "latex": "$$\\int_{-\\infty}^{\\infty}\\frac{d\\omega}{2\\pi}\\,A(\\nu,\\omega)=1$$", "note": "Eq. (8.59); from the equal-time anticommutator."}, {"name": "Occupation from spectral function", "latex": "$$\\langle n_\\nu\\rangle=\\int\\frac{d\\omega}{2\\pi}\\,A(\\nu,\\omega)\\,n_F(\\omega)$$", "note": "Eq. (8.62); follows from n = -iG^<(t=0) and iG^< = -A n_F."}, {"name": "Free spectral function", "latex": "$$A_0(k\\sigma,\\omega)=2\\pi\\,\\delta(\\omega-\\xi_k)$$", "note": "Eq. (8.56)."}]}, {"id": "8.3.5", "title": "Broadening of the spectral function", "keyResults": [{"name": "Lorentzian broadening", "latex": "$$A(\\nu,\\omega)=\\frac{2/\\tau}{(\\omega-\\xi_\\nu)^2+(1/\\tau)^2}$$", "note": "Eqs. (8.63)-(8.64); from G^R(nu,t) proportional to e^{-i xi_nu t - t/tau}."}]}, {"id": "8.4", "title": "Measuring the single-particle spectral function", "keyResults": []}, {"id": "8.4.1", "title": "Tunneling spectroscopy", "keyResults": [{"name": "Tunnel current", "latex": "$$I_p=\\int\\frac{d\\omega}{2\\pi}\\sum_{\\nu\\mu}|T_{\\nu\\mu}|^2A_1(\\nu,\\omega)\\,A_2(\\mu,\\omega+eV)\\,\\big[n_F(\\omega+eV)-n_F(\\omega)\\big]$$", "note": "Eq. (8.74), tunneling Hamiltonian Eq. (8.65), to lowest order in T_{nu mu} (Kubo, Eq. 8.68). A_2 is evaluated at omega+eV, the same shift as the Fermi function it multiplies; this is the form that gives Eq. (8.77).", "checkerNote": "Overall sign/convention of I_p and V not legible in the md; the argument omega+eV of A_2 is consistent with Eqs. (8.75)-(8.77)."}, {"name": "Tunneling conductance", "latex": "$$\\frac{dI}{dV}\\propto\\sum_\\nu A_1(\\nu,-eV)$$", "note": "Eqs. (8.76)-(8.77); system 2 has a flat density of states, so -dn_F(omega+eV)/d omega tends to delta(omega+eV) at low temperature. The argument is -eV for the book's V = V_1 - V_2."}]}, {"id": "8.5", "title": "Two-particle correlation functions of many-body systems", "keyResults": [{"name": "Lindhard function", "latex": "$$\\chi^R_0(q,\\omega)=\\frac{1}{\\mathcal V}\\sum_{k\\sigma}\\frac{n_F(\\xi_k)-n_F(\\xi_{k+q})}{\\omega+\\xi_k-\\xi_{k+q}+i\\eta}$$", "note": "Eq. (8.85); free-electron density response."}, {"name": "Dissipative part", "latex": "$$\\mathrm{Im}\\,\\chi^R_0(q,\\omega)=-\\frac{\\pi}{\\mathcal V}\\sum_{k\\sigma}\\big[n_F(\\xi_k)-n_F(\\xi_{k+q})\\big]\\,\\delta(\\xi_k-\\xi_{k+q}+\\omega)$$", "note": "Eq. (8.86); follows from the Lindhard form with the i eta prescription."}]}], "questions": [{"id": "ch08-E1", "tier": "easy", "type": "mc", "prompt": "The free-electron retarded Green's function $G^R_0(k,\\omega)$ is", "choices": ["$\\frac{1}{\\omega-\\xi_k+i\\eta}$", "$\\frac{1}{\\omega-\\xi_k-i\\eta}$", "$\\frac{1}{\\omega+\\xi_k+i\\eta}$", "$2\\pi\\delta(\\omega-\\xi_k)$"], "answerIndex": 0, "solution": "Fourier transform $-i\\theta(t)e^{-i\\xi_k t}e^{-\\eta t}$ to get $1/(\\omega-\\xi_k+i\\eta)$. The $-i\\eta$ form is the advanced function, and $2\\pi\\delta(\\omega-\\xi_k)$ is the spectral function $A_0$, not $G^R_0$.", "source": "Sec. 8.3.2, Eq. (8.41c); Sec. 8.3.4, Eq. (8.55)"}, {"id": "ch08-E2", "tier": "easy", "type": "free", "prompt": "Define the spectral function $A(\\nu,\\omega)$, state its sum rule, and give its value for free electrons.", "solution": "$A(\\nu,\\omega)=-2\\,\\mathrm{Im}\\,G^R(\\nu,\\omega)$ (Eq. 8.50). The sum rule is $\\int\\frac{d\\omega}{2\\pi}A(\\nu,\\omega)=1$ (Eq. 8.59), which follows from the equal-time anticommutator. For free electrons $A_0(k\\sigma,\\omega)=2\\pi\\,\\delta(\\omega-\\xi_k)$ (Eq. 8.56).", "source": "Sec. 8.3.4, Eqs. (8.50), (8.56), (8.59)"}, {"id": "ch08-E3", "tier": "easy", "type": "mc", "prompt": "A Lorentzian spectral peak of half-width $1/\\tau$ in $A(\\nu,\\omega)=\\frac{2/\\tau}{(\\omega-\\xi_\\nu)^2+1/\\tau^2}$ means", "choices": ["infinite lifetime of the state", "the quasiparticle decays with a lifetime of order $\\tau$", "the temperature is $1/\\tau$", "the occupation is $1/\\tau$"], "answerIndex": 1, "solution": "The retarded function decays as $e^{-t/\\tau}$ (Eq. 8.63), so the quasiparticle has lifetime of order $\\tau$. An infinite lifetime would give a delta peak, and the other choices mix units.", "source": "Sec. 8.3.5, Eqs. (8.63)-(8.64)"}, {"id": "ch08-E4", "tier": "easy", "type": "free", "prompt": "What does a tunneling experiment between a metal and a sample measure at low temperature, and why?", "solution": "At low temperature, with a flat density of states in the metal, $dI/dV\\propto\\sum_\\nu A_1(\\nu,-eV)$ (Eqs. 8.76-8.77; the sign of the argument follows the book's $V=V_1-V_2$). The derivative of the Fermi function tends to a delta function, so the measured curve is the sample's spectral function at energy $\\mp eV$ relative to the Fermi level. Sweeping $V$ scans the energy.", "source": "Sec. 8.4.1, Eqs. (8.74)-(8.77)"}, {"id": "ch08-E5", "tier": "easy", "type": "free", "prompt": "Ex. 8.8. Show that $G^A(\\nu,\\omega)=[G^R(\\nu,\\omega)]^*$ for a diagonal Green's function.", "solution": "Book Exercise 8.8. For a diagonal function, $G^R(\\nu,t)=-i\\theta(t)\\langle\\{c_\\nu(t),c^\\dagger_\\nu\\}\\rangle$ and $G^A(\\nu,t)=i\\theta(-t)\\langle\\{c_\\nu(t),c^\\dagger_\\nu\\}\\rangle$ (Eq. 8.34 and its advanced partner). Take the complex conjugate of $G^A(\\nu,\\omega)=\\int dt\\,e^{i(\\omega-i\\eta)t}G^A(\\nu,t)$. Since $\\langle\\{c(t),c^\\dagger\\}\\rangle^*=\\langle\\{c,c^\\dagger(t)\\}\\rangle=\\langle\\{c(-t),c^\\dagger\\}\\rangle$ by time-translation invariance, the change of variable $t\\to-t$ turns the result into $\\int dt\\,e^{i(\\omega+i\\eta)t}G^R(\\nu,t)$. Hence $[G^A(\\nu,\\omega)]^*=G^R(\\nu,\\omega)$, equivalently $G^A=[G^R]^*$ (Eq. 8.53).", "source": "Ex. 8.8; Sec. 8.3.3, Eqs. (8.34), (8.53)-(8.54)"}, {"id": "ch08-H1", "tier": "hard", "type": "free", "prompt": "Ex. 8.5. Find the DC conductance of a perfect 1D wire from the Kubo formula of Sec. 6.3 with the method of Sec. 8.5. Use the current operator and the small-frequency limit of the response function.", "solution": "Book Exercise 8.5. The 1D particle current operator is\n$$I_p(x)=\\frac{\\hbar}{mL}\\sum_{k q\\sigma}\\Big(k+\\frac q2\\Big)c^\\dagger_{k\\sigma}c_{k+q\\sigma}\\,e^{iqx}.$$\nThe method of Sec. 8.5 gives $\\Pi^R(x-x';t-t')$ as a sum over $k,q,\\sigma$ of $\\big(\\frac{\\hbar}{mL}(k+\\frac q2)\\big)^2e^{i(\\varepsilon_k-\\varepsilon_{k+q})(t-t')}\\,[n_F(\\varepsilon_k)-n_F(\\varepsilon_{k+q})]\\,e^{iq(x-x')}$. Set $x=x'$ and use $G=\\frac{ie^2}{\\omega}\\Pi^R(\\omega)$ (Eq. 6.30). At low frequency $\\mathrm{Im}\\,\\Pi^R$ is proportional to $\\omega\\sum(-\\partial n_F/\\partial\\varepsilon_k)\\,\\delta(\\varepsilon_k-\\varepsilon_{k+q})(k+q/2)^2$. Do the $q$-integral first and then take $\\omega\\to0$. The sum over $k$ then reduces to $\\int d\\varepsilon\\,(-\\partial n_F/\\partial\\varepsilon)$, which is 1 for $\\mu\\gg k_BT$. Each spin contributes $e^2/h$, so\n$$G=\\frac{2e^2}{h}.$$", "source": "Ex. 8.5; Sec. 6.3, Eq. (6.30); Sec. 8.5, Eqs. (8.81)-(8.85)", "checkerNote": "Cites Sec. 6.3 / Eq. (6.30), which lies outside chapters 7-10 (the exercise itself starts from it). The integrals leading to Eq. (E.8.8) are summarized, not reproduced."}, {"id": "ch08-H2", "tier": "hard", "type": "free", "prompt": "Ex. 8.4. Show the boson analogues of the fermion relations in Eq. (8.51). That is, find $A$ in terms of $G^R$ and $iG^>$, $iG^<$ in terms of $A$ and $n_B$.", "solution": "Book Exercise 8.4. Repeat the Lehmann steps with commutators in place of anticommutators. The result is\n$$A=-2\\,\\mathrm{Im}\\,G^R,\\qquad iG^>(\\nu,\\omega)=A(\\nu,\\omega)\\big[1+n_B(\\omega)\\big],\\qquad iG^<(\\nu,\\omega)=A(\\nu,\\omega)\\,n_B(\\omega).$$\nFor fermions the factor $1-n_F$ replaces $1+n_B$, and $iG^<=-A\\,n_F$ (Eq. 8.51).", "source": "Ex. 8.4; Sec. 8.3.3, Eqs. (8.45)-(8.51)"}, {"id": "ch08-H3", "tier": "hard", "type": "free", "prompt": "Ex. 8.6. A 2D electron gas occupies the strip $0<x<L$ with hard walls at $x=0$ and $x=L$. At $T=0$, find the density $n(x)$ as a function of distance from the left edge. State the period of the oscillations.", "solution": "Book Exercise 8.6. Use standing waves $\\sqrt{2/L}\\sin(k_xx)$ in $x$ and plane waves in $y$, and fill all states with $k_x^2+k_y^2<k_F^2$: $n(x)=\\sum_\\nu|\\psi_\\nu(x)|^2\\langle c^\\dagger_\\nu c_\\nu\\rangle$. With the integral $\\int_0^{k_F}\\!ds\\sqrt{k_F^2-s^2}\\cos(2xs)=\\pi k_FJ_1(2k_Fx)/4x$ the result is the Friedel form\n$$n(x)=n_0\\left[1-\\frac{J_1(2k_Fx)}{k_Fx}\\right],\\qquad n_0=\\frac{k_F^2}{2\\pi}.$$\nThe oscillations have period $\\pi/k_F=\\lambda_F/2$ and decay as $x^{-3/2}$ away from the wall. Finite temperature damps them.", "source": "Ex. 8.6; Sec. 8.3.4, Eq. (8.62)"}, {"id": "ch08-H4", "tier": "hard", "type": "free", "prompt": "Ex. 8.7. Show Eq. (8.27): insert the 1D scattering eigenstates into the propagator and evaluate the $k$-integral by contours. Give $G^R(x,x',E)$ for $x'<0$ and $x>W$.", "solution": "Book Exercise 8.7. Inserting the scattering eigenstates into Eq. (8.26) and using Eq. (7.13) gives, for $x'<0$ and $x>W$,\n$$G^R(x,x',E)=\\int_0^\\infty\\frac{dk}{2\\pi}\\frac{t_ke^{ik(x-x')}+[t'_k]^*e^{-ik(x-x')}}{E-k^2/2m+i\\eta}.$$\nFor the first term close the contour in the upper half plane (quarter circle); it picks up the pole at $k=\\sqrt{2mE}$. The second term has no pole inside its contour and vanishes. With $\\hbar=1$ the result is\n$$G^R(x,x',E)=-\\frac{im}{k}\\,t(E)\\,e^{ik(x-x')}.$$", "source": "Ex. 8.7; Sec. 8.2.1, Eqs. (8.26)-(8.27); Sec. 7.1.3, Eq. (7.13)"}]}, {"chapter": 9, "title": "Equation of motion theory", "scope": "Sec. 9.1 (single-particle Green's function, EOM, non-interacting case), 9.2 (single level coupled to a continuum), 9.3 (Anderson model, EOM and mean field), 9.4.1 (RPA by EOM). Summary omitted.", "sections": [{"id": "9.1", "title": "The single-particle Green's function", "keyResults": []}, {"id": "9.1.1", "title": "Non-interacting particles", "keyResults": [{"name": "EOM for the retarded function", "latex": "$$(\\omega+i\\eta)\\,C^R_{AB}(\\omega)=\\langle[A,B]_{B,F}\\rangle+C^R_{[A,H],B}(\\omega)$$", "note": "General form for operators A, B, obtained as in Eqs. (9.1)-(9.9) (the book states it for field operators: Eqs. 9.5, 9.8-9.10). Here i d_t A(t) = [A,H](t).", "checkerNote": "The general A,B form is not printed literally in the book; the field-operator versions Eqs. (9.5), (9.8)-(9.10) are."}, {"name": "Quadratic Hamiltonian", "latex": "$$\\sum_{\\nu''}\\big[(\\omega+i\\eta)\\delta_{\\nu\\nu''}-t_{\\nu\\nu''}\\big]G^R(\\nu''\\nu';\\omega)=\\delta_{\\nu\\nu'}$$", "note": "Eq. (9.11); with interactions the right side gains D^R (Eq. 9.10a)."}, {"name": "Free retarded function", "latex": "$$G^R_0(\\nu,\\omega)=\\frac{1}{\\omega-\\varepsilon_\\nu+i\\eta}$$", "note": "Eqs. (9.12)-(9.14); agrees with Eq. (8.55)."}]}, {"id": "9.2", "title": "Single level coupled to a continuum", "keyResults": [{"name": "Level Green's function", "latex": "$$G^R(l,\\omega)=\\frac{1}{\\omega-\\xi_0-\\Sigma^R(\\omega)},\\qquad \\Sigma^R(\\omega)=\\sum_\\nu\\frac{|t_\\nu|^2}{\\omega-\\xi_\\nu+i\\eta}$$", "note": "Eqs. (9.21)-(9.22)."}, {"name": "Wide-band width", "latex": "$$\\Sigma^R\\approx-\\frac{i\\Gamma}{2},\\qquad \\Gamma=2\\pi\\sum_\\nu|t_\\nu|^2\\,\\delta(\\omega-\\xi_\\nu)$$", "note": "Eqs. (9.39)-(9.42), with the self-energy of Eq. (9.22); constant 2 pi d(eps)|t(eps)|^2 = Gamma gives Re Sigma as a shift and Im Sigma = -Gamma/2. The spectral function is a Lorentzian of full width Gamma."}]}, {"id": "9.3", "title": "Anderson's model for magnetic impurities", "keyResults": []}, {"id": "9.3.1", "title": "The equation of motion for the Anderson model", "keyResults": [{"name": "Anderson Hamiltonian", "latex": "$$H=\\sum_{k\\sigma}(\\varepsilon_k-\\mu)c^\\dagger_{k\\sigma}c_{k\\sigma}+\\sum_\\sigma(\\varepsilon_d-\\mu)\\,n_{d\\sigma}+U\\,n_{d\\uparrow}n_{d\\downarrow}+\\sum_{k\\sigma}\\big(t_k\\,c^\\dagger_{d\\sigma}c_{k\\sigma}+t_k^*\\,c^\\dagger_{k\\sigma}c_{d\\sigma}\\big)$$", "note": "Eqs. (9.23)-(9.26), with the book's convention for t_k. The interaction term generates a two-particle function in the EOM, Eqs. (9.30)-(9.34)."}, {"name": "Dot EOM", "latex": "$$(\\omega+i\\eta-\\varepsilon_d+\\mu)\\,G^R(d\\sigma,\\omega)-\\sum_k t_k\\,G^R(k\\sigma,d\\sigma,\\omega)=1+U\\,D^R(d\\sigma,\\omega)$$", "note": "Eq. (9.30); D^R is the function <<n_{d,sigma-bar} d_sigma; d^dagger_sigma>>."}]}, {"id": "9.3.2", "title": "Mean-field approximation for the Anderson model", "keyResults": [{"name": "Mean-field Green's function", "latex": "$$G^R_\\sigma(\\omega)=\\frac{1}{\\omega-\\varepsilon_d+\\mu-U\\langle n_{\\bar\\sigma}\\rangle-\\Sigma^R(\\omega)}$$", "note": "Eqs. (9.35)-(9.38); the level is shifted by U times the opposite-spin occupation."}, {"name": "Self-consistency", "latex": "$$\\cot(\\pi\\langle n_\\uparrow\\rangle)=(\\langle n_\\downarrow\\rangle-x)\\,y,\\qquad \\cot(\\pi\\langle n_\\downarrow\\rangle)=(\\langle n_\\uparrow\\rangle-x)\\,y$$", "note": "Eqs. (9.45a)-(9.45b) with x=(mu-eps~)/U and y=2U/Gamma, where eps~ = eps_d + Re Sigma. Verified by evaluating the T=0 integral of Eq. (9.44): n_up = 1/2 - (1/pi) arctan[2(eps~-mu+U n_down)/Gamma], so cot(pi n_up) = (n_down - x) y."}]}, {"id": "9.4", "title": "The two-particle correlation function", "keyResults": []}, {"id": "9.4.1", "title": "The random phase approximation", "keyResults": [{"name": "RPA density response", "latex": "$$\\chi^R_{\\rm RPA}(q,\\omega)=\\frac{\\chi^R_0(q,\
