<title>Git from Zero</title>

<style>
/* Layout: sticky top bar, lesson rail on the left, lesson column with a terminal + repo-state lab underneath the reading */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3; --ink: #1c222b; --muted: #5a6472; --line: #dbdfe5;
  --accent: #d9480f; --accent-soft: #fde8dd; --accent-ink: #ffffff;
  --ok: #2b8a3e; --ok-soft: #e3f4e6; --bad: #c92a2a; --bad-soft: #fde4e4; --warn: #a86400;
  --term-bg: #151a21; --term-fg: #d4dbe4; --term-dim: #8691a0; --term-green: #7ee08a; --term-red: #ff8079; --term-yellow: #e7b84b; --term-blue: #80bfff;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1217; --surface: #171b22; --surface-2: #1e232b; --ink: #e7ebf0; --muted: #9ba5b3; --line: #2b313b;
  --accent: #ff7a45; --accent-soft: #3a2018; --accent-ink: #1a0d07;
  --ok: #5cc277; --ok-soft: #15301d; --bad: #ff7b7b; --bad-soft: #3a1a1a; --warn: #e7b84b;
  --term-bg: #0a0d11; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #171b22; --surface-2: #1e232b; --ink: #e7ebf0; --muted: #9ba5b3; --line: #2b313b;
  --accent: #ff7a45; --accent-soft: #3a2018; --accent-ink: #1a0d07;
  --ok: #5cc277; --ok-soft: #15301d; --bad: #ff7b7b; --bad-soft: #3a1a1a; --warn: #e7b84b;
  --term-bg: #0a0d11; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { width: 140px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 0.8rem; padding: 2px; }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; max-width: 1280px; margin: 0 auto;
  padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; }
.side h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.nav { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: grid; grid-template-columns: 26px 1fr 16px; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 0.92rem; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--accent-soft); }
.nav .num { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); text-align: right; }
.nav .tick { color: var(--ok); font-weight: 700; }

.lesson { min-width: 0; max-width: 980px; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0; }
h1 { font-family: var(--font-display); font-size: clamp(1.7rem, 3.5vw, 2.3rem); line-height: 1.15; letter-spacing: -0.02em; margin: 4px 0 18px; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 32px 0 10px; text-wrap: balance; }
h3 { font-family: var(--font-display); font-size: 1.05rem; margin: 22px 0 6px; }
.prose { max-width: 70ch; }
.prose p, .prose li { margin: 0 0 10px; }
.prose ul, .prose ol { padding-left: 1.3em; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.drills { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
.drills > p { margin: 0; }
.drill { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.drill.ok { border-color: var(--ok); }
.drill p { margin: 0 0 8px; font-weight: 600; }
.drow { display: flex; align-items: center; gap: 8px; background: var(--term-bg); border-radius: 8px; padding: 6px 6px 6px 12px; }
.drow .dpr { font-family: var(--font-mono); color: var(--term-blue); font-size: 0.85rem; }
.drow input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--term-fg); font-family: var(--font-mono); font-size: 0.88rem; caret-color: var(--term-green); padding: 4px 0; }
.drow input:disabled { color: var(--term-green); }
.drow .btn { flex: none; }
.dfb { font-size: 0.86rem; margin-top: 6px; min-height: 1em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.dfb .bad { color: var(--bad); } .dfb .good { color: var(--ok); font-weight: 600; }
.dfb .answer { font-family: var(--font-mono); background: var(--surface-2); border-radius: 5px; padding: 1px 6px; }
pre.block { font-family: var(--font-mono); font-size: 0.85rem; background: var(--term-bg); color: var(--term-fg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.5; }
.tablewrap { overflow-x: auto; margin: 12px 0 16px; }
table.ref { border-collapse: collapse; font-size: 0.9rem; min-width: 460px; width: 100%; }
table.ref th, table.ref td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.ref th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.note { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 6px; margin: 14px 0; max-width: 70ch; }
.tip { font-size: 0.85rem; color: var(--muted); }

.flow { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
.flow .box { flex: 1 1 150px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.flow .box b { font-family: var(--font-display); display: block; }
.flow .box span { font-size: 0.82rem; color: var(--muted); }
.flow .arrow { align-self: center; font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); text-align: center; flex: 0 0 auto; }

.quiz { margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.q p { margin: 0 0 10px; font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; color: var(--ink); }
.opt:hover { border-color: var(--accent); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.qfb { font-size: 0.85rem; margin-top: 8px; min-height: 1em; }

.lab { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 6px; }
.labhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.labhead h2 { margin-right: auto; }
.btn { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tasks { list-style: none; padding: 0; margin: 10px 0 12px; display: flex; flex-direction: column; gap: 4px; counter-reset: t; }
.tasks li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--muted); counter-increment: t; }
.tasks li::before { content: counter(t); font-family: var(--font-mono); font-size: 0.75rem; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; margin-top: 1px; }
.tasks li.cur { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.tasks li.cur::before { border-color: var(--accent); color: var(--accent); }
.tasks li.done { color: var(--ink); }
.tasks li.done::before { content: "✓"; background: var(--ok); border-color: var(--ok); color: var(--surface); font-weight: 700; }
.hint { font-size: 0.85rem; margin-top: 4px; color: var(--muted); }
.hint code { cursor: pointer; }

.labgrid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.term { background: var(--term-bg); color: var(--term-fg); border-radius: var(--radius); font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.5; display: flex; flex-direction: column; min-width: 0; height: 460px; }
.term .bar2 { display: flex; gap: 6px; padding: 9px 12px; border-bottom: 1px solid #ffffff14; align-items: center; color: var(--term-dim); font-size: 0.75rem; }
.term .bar2 i { width: 9px; height: 9px; border-radius: 50%; background: #ffffff26; display: inline-block; }
.term .bar2 span { margin-left: 6px; }
.out { flex: 1; overflow-y: auto; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
.out .l-cmd { color: var(--term-fg); }
.out .l-cmd .pr { color: var(--term-blue); }
.out .green { color: var(--term-green); } .out .red { color: var(--term-red); } .out .yellow { color: var(--term-yellow); } .out .dim { color: var(--term-dim); } .out .blue { color: var(--term-blue); }
.out .event { color: var(--term-yellow); border-left: 2px solid var(--term-yellow); padding-left: 8px; margin: 4px 0; }
.out .good { color: var(--term-green); border-left: 2px solid var(--term-green); padding-left: 8px; margin: 4px 0; }
.inrow { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid #ffffff14; }
.inrow .pr { color: var(--term-blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.inrow input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--term-fg); font: inherit; outline: none; caret-color: var(--term-green); }

.state { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.area { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
.area h4 { margin: 0 0 6px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.area h4 em { font-style: normal; text-transform: none; letter-spacing: 0; font-family: var(--font-mono); }
.area ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.area li { font-family: var(--font-mono); font-size: 0.8rem; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.area .empty { font-size: 0.8rem; color: var(--muted); font-family: var(--font-body); }
.fname { background: none; border: 0; padding: 0; color: var(--ink); font: inherit; text-align: left; overflow-wrap: anywhere; }
.fname:hover { text-decoration: underline; }
.badge { font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; padding: 0 5px; border-radius: 4px; flex: none; }
.b-new { background: var(--ok-soft); color: var(--ok); } .b-mod { background: var(--accent-soft); color: var(--accent); } .b-del, .b-con { background: var(--bad-soft); color: var(--bad); } .b-unt { background: var(--surface-2); color: var(--muted); }
.peek { font-family: var(--font-mono); font-size: 0.76rem; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; margin: 2px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.commit { display: grid !important; grid-template-columns: auto 1fr; gap: 2px 8px !important; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.commit:last-child { border-bottom: 0; }
.commit .hash { color: var(--accent); }
.commit .msg { font-family: var(--font-body); overflow-wrap: anywhere; }
.commit .refs { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
.ref { font-size: 0.68rem; padding: 0 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.ref.head { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ref.br { border-color: var(--accent); color: var(--accent); }
.ref.mg { border-style: dashed; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; flex-wrap: wrap; }
.donebox { margin-top: 18px; padding: 12px 16px; border-radius: var(--radius); background: var(--ok-soft); border: 1px solid var(--ok); color: var(--ink); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .side { position: static; }
  .nav { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .nav a { grid-template-columns: auto auto auto; white-space: nowrap; }
  .labgrid { grid-template-columns: minmax(0, 1fr); }
  .term { height: 380px; }
  .bar { width: 80px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
(() => {
/* ============================== Storage ============================== */
const KEY = 'git-from-zero.v1';
let store = { done: [], config: null };
try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v) store = Object.assign(store, v); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

/* ============================== Git simulator ============================== */
let S;
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const L = (...lines) => lines.join('\n') + '\n';
function fresh() { return { files: {}, repo: null, objects: {}, servers: {}, config: {}, clock: 0 }; }
function newId() { let h; do { h = Math.floor(Math.random() * 0xfffffff).toString(16).padStart(7, '0'); } while (S.objects[h]); return h; }
function mkCommit(tree, parents, msg, author) {
  const id = newId();
  S.objects[id] = { id, tree: { ...tree }, parents, msg, time: ++S.clock, author: author || S.config['user.name'] || 'You', email: S.config['user.email'] || 'you@example.com' };
  return id;
}
const headId = () => S.repo.branches[S.repo.head] ?? null;
const treeOf = id => (id ? S.objects[id].tree : {});
function ancestors(id) { const set = new Set(), st = [id]; while (st.length) { const c = st.pop(); if (!c || set.has(c)) continue; set.add(c); st.push(...S.objects[c].parents); } return set; }
const isAnc = (a, b) => !a || (!!b && ancestors(b).has(a));
function mergeBase(a, b) { const A = ancestors(a); let best = null; for (const c of ancestors(b)) if (A.has(c) && (!best || S.objects[c].time > S.objects[best].time)) best = c; return best; }
const union = (...objs) => [...new Set(objs.flatMap(o => Object.keys(o)))].sort();
function diffTree(A, B) { return union(A, B).filter(p => A[p] !== B[p]).map(p => ({ p, type: !has(A, p) ? 'new file' : !has(B, p) ? 'deleted' : 'modified' })); }
function ignorePatterns() {
  const g = S.files['.gitignore']; if (!g) return [];
  return g.split('\n').map(x => x.trim()).filter(x => x && !x.startsWith('#')).map(x => new RegExp('^' + x.replace(/\/$/, '').replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$'));
}
const isIgnored = p => ignorePatterns().some(r => r.test(p));
function changes() {
  const r = S.repo, H = treeOf(headId()), I = r.index, W = S.files;
  const conflicts = r.merging ? r.merging.conflicts : [];
  const staged = diffTree(H, I).filter(c => !conflicts.includes(c.p));
  const unstaged = Object.keys(I).sort().filter(p => !conflicts.includes(p) && W[p] !== I[p]).map(p => ({ p, type: has(W, p) ? 'modified' : 'deleted' }));
  const untracked = Object.keys(W).sort().filter(p => !has(I, p) && !isIgnored(p));
  return { staged, unstaged, untracked, conflicts };
}
const isDirty = () => { const c = changes(); return c.staged.length > 0 || c.unstaged.length > 0 || c.conflicts.length > 0; };
function resolve(ref) {
  const r = S.repo; if (!ref) return null;
  let m = ref.match(/^(.+?)~(\d*)$/) || ref.match(/^(.+?)(\^+)$/);
  if (m) { let id = resolve(m[1]); let n = m[2].startsWith('^') ? m[2].length : (m[2] === '' ? 1 : +m[2]); while (id && n-- > 0) id = S.objects[id].parents[0] || null; return id; }
  if (ref === 'HEAD') return headId();
  if (has(r.branches, ref)) return r.branches[ref];
  if (has(r.tracking, ref)) return r.tracking[ref];
  if (/^[0-9a-f]{4,}$/.test(ref)) { const hits = Object.keys(S.objects).filter(k => k.startsWith(ref)); if (hits.length === 1) return hits[0]; }
  return undefined;
}
function setTree(T, keepUntracked = true) {
  const r = S.repo, H = treeOf(headId());
  const untracked = {}; if (keepUntracked) for (const p in S.files) if (!has(r.index, p) && !has(H, p)) untracked[p] = S.files[p];
  r.index = { ...T }; S.files = { ...untracked, ...T };
}
const short = id => id;
function fmtDate(t) {
  const d = new Date(2026, 10, 20, 9, t * 7);
  const D = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()], M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()];
  const p = n => String(n).padStart(2, '0');
  return `${D} ${M} ${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}:00 2026 +0000`;
}
function decorations(id) {
  const r = S.repo, out = [];
  for (const b of Object.keys(r.branches)) if (r.branches[b] === id) out.push(b === r.head ? { t: 'HEAD -> ' + b, k: 'head' } : { t: b, k: 'br' });
  for (const t of Object.keys(r.tracking)) if (r.tracking[t] === id) out.push({ t, k: 'rt' });
  out.sort((a, b) => (a.k === 'head' ? -1 : b.k === 'head' ? 1 : 0));
  return out;
}

/* ----- terminal output ----- */
let outEl = null, buffer = [];
function print(text, cls) { buffer.push({ text: String(text), cls }); }
function flush() {
  if (!outEl) { buffer = []; return; }
  for (const b of buffer) { const d = document.createElement('div'); if (b.cls) d.className = b.cls; d.textContent = b.text; outEl.appendChild(d); }
  buffer = []; outEl.scrollTop = outEl.scrollHeight;
}
const NOREPO = 'fatal: not a git repository (or any of the parent directories): .git';

/* ----- tokenizer ----- */
function splitAnd(s) { const parts = []; let cur = '', q = null; for (let i = 0; i < s.length; i++) { const c = s[i]; if (q) { if (c === q) q = null; cur += c; continue; } if (c === '"' || c === "'") { q = c; cur += c; continue; } if (c === '&' && s[i + 1] === '&') { parts.push(cur); cur = ''; i++; continue; } if (c === ';') { parts.push(cur); cur = ''; continue; } cur += c; } parts.push(cur); return parts.map(x => x.trim()).filter(Boolean); }
function tokenize(s) {
  const out = []; let cur = '', q = null, any = false;
  const push = () => { if (cur || any) out.push(cur); cur = ''; any = false; };
  for (let i = 0; i < s.length; i++) {

<p>When you work on anything that changes over time, like code, a website or a thesis, you eventually want answers to questions like: <em>What did this look like last week? What exactly did I change? Who changed this line?</em> <strong>Git</strong> is a program that answers those questions. It records <strong>snapshots</strong> of a project folder, one after another, and keeps every one of them.</p>
<p>Think of it as save points in a video game. Each save point remembers the whole project, a short message about what changed, who made it and when. You can look at any of them, compare them, and go back.</p>

<p>Mistakes are normal. Which command fixes one depends on <em>where</em> the mistake is.</p>

<tr><td>I committed something I want to undo</td><td><code>git revert &lt;hash&gt;</code></td><td>Makes a <em>new</em> commit that reverses that commit. History stays intact, which is safe even after sharing.</td></tr>
</table></div>
<p class="tip">You may see older tutorials use <code>git checkout -- file</code> or <code>git reset HEAD file</code>. They do the same as the two restore commands above.</p>
<h3>.gitignore: files Git should never track</h3>

                 \\

<div class="tablewrap"><table class="ref">

<tr><td><code>git branch -d fix-typo</code></td><td>Delete a branch (Git refuses if its work is not merged yet)</td></tr>

<p>When you switch branches, Git changes the files in your folder to match that branch. Files that only exist on another branch disappear from the folder and come back when you switch back. Nothing is lost.</p>

{
  id: 'merge', title: 'Merge branches and resolve conflicts',
  body: `
<p>Merging brings the commits from another branch into the branch you are on. First switch to the branch that should <em>receive</em> the work (usually <code>main</code>), then merge:</p>
<pre class="block">git switch main
git merge add-soup</pre>
<h3>Two kinds of merge</h3>
<p><b>Fast-forward.</b> If <code>main</code> has not moved since the branch was created, Git just slides the <code>main</code> label forward. No new commit is needed.</p>
<p><b>Merge commit.</b> If both branches have new commits, Git combines them and creates a merge commit with two parents.</p>
<h3>Conflicts</h3>
<p>If both branches changed the same lines in different ways, Git cannot decide which version wins. It stops and marks the file:</p>
<pre class="block">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
# Family Recipes             ← your branch's version
=======
# Grandma's Recipes          ← the other branch's version
&gt;&gt;&gt;&gt;&gt;&gt;&gt; change-title</pre>
<p>A conflict is not an error. It is Git asking you a question. To answer it:</p>
<ol>
<li>Open the file and decide what the final text should be. It can be one side, the other, or a mix.</li>
<li>Delete the marker lines (<code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>) and save.</li>
<li><code>git add</code> the file to mark it as resolved.</li>
<li><code>git commit</code> to finish the merge.</li>
</ol>
<p>Changed your mind halfway? <code>git merge --abort</code> puts everything back to how it was before the merge.</p>
<p class="tip">After a branch is merged you can delete it with <code>git branch -d</code>. Its commits stay in the history.</p>`,

    { q: 'After fixing the text in a conflicted file, what are the next two steps?', o: ['git add the file, then git commit', 'git merge again, then git push', 'git restore the file, then git commit', 'Delete the branch, then git commit'], a: 0 },

{
  id: 'remotes', title: 'Share work with remotes',
  body: `
<p>A <strong>remote</strong> is a copy of the repository on a server. By convention the main remote is called <code>origin</code>. GitHub, GitLab and Bitbucket all work the same way from Git's point of view.</p>
<div class="tablewrap"><table class="ref">
<tr><th>Command</th><th>What it does</th></tr>
<tr><td><code>git clone &lt;url&gt;</code></td><td>Download a whole repository, with its history, and set up <code>origin</code> for you</td></tr>
<tr><td>${c('git remote -v')}</td><td>Show which remotes are configured</td></tr>
<tr><td>${c('git push')}</td><td>Upload your new commits to the remote</td></tr>
<tr><td>${c('git pull')}</td><td>Download new commits from the remote and merge them into your branch</td></tr>
<tr><td><code>git remote add origin &lt;url&gt;</code></td><td>Connect an existing local repository to a remote</td></tr>
<tr><td><code>git push -u origin main</code></td><td>First push of a branch. <code>-u</code> remembers the connection so later you can just type <code>git push</code>.</td></tr>
</table></div>
<h3>The daily rhythm when working with others</h3>
<pre class="block">git pull                     # get your teammates' work first
# ...edit files...
git add .
git commit -m "Describe change"
git push                     # share your work</pre>
<p>If someone pushed before you, Git rejects your push with “fetch first”. That is a safety check, not a failure: run <code>git pull</code>, fix any conflicts, then <code>git push</code> again.</p>
<h3>Putting your own project on GitHub</h3>
<ol>
<li>Create an account on github.com and click <b>New repository</b>. Leave it empty (no README).</li>
<li>GitHub shows a URL like <code>https://github.com/you/recipes.git</code>.</li>
<li>In your project: <code>git remote add origin https://github.com/you/recipes.git</code></li>
<li>Then: <code>git push -u origin main</code></li>
</ol>
<p class="tip">When you push to GitHub for the first time, it asks you to sign in. A browser window usually handles this. GitHub does not accept your account password in the terminal; it uses a sign-in through the browser, a personal access token, or an SSH key.</p>`,

LESSONS.forEach(l => { if (DRILLS[l.id]) l.drills = DRILLS[l.id]; });
function drillsHTML(L0) {

}
function drillWrongMsg(d, v) {
  if (/^Git /.test(v)) return 'Commands are case sensitive: write git in lowercase.';
  if (d.show.startsWith('git ') && !v.startsWith('git ')) return 'Git commands start with git.';
  if (d.show.includes('"') && !v.includes('"')) return `Put text with spaces inside quotes, like ${(d.show.match(/"[^"]*"/) || ['"text"'])[0]}.`;
  return 'Not quite. Check the command name, the options and the spelling.';
}
function wireDrills(L0) {

        checkComplete(); return;

}
let drillState = [];

const CHEAT = {

};
const ALL = [...LESSONS, CHEAT];

/* ============================== UI ============================== */
const nav = document.getElementById('nav'), main = document.getElementById('main');
let current = 0, lab = null;
const isDone = id => store.done.includes(id);
function markDone(id) { if (!isDone(id)) { store.done.push(id); save(); renderNav(); } }
function renderNav() {
  nav.innerHTML = ALL.map((l, i) => `<li><a href="#${l.id}" ${i === current ? 'aria-current="page"' : ''}><span class="num">${i < LESSONS.length ? String(i + 1).padStart(2, '0') : '—'}</span><span>${esc(l.title.split(':')[0])}</span><span class="tick">${isDone(l.id) ? '✓' : ''}</span></a></li>`).join('');
  const n = LESSONS.filter(l => isDone(l.id)).length;

function quizHTML(qs) {
  return `<section class="quiz"><h2 style="margin:0">Check your understanding</h2>${qs.map((q, qi) => `<div class="q" data-q="${qi}"><p>${esc(q.q)}</p><div class="opts">${q.o.map((o, oi) => `<button class="opt" type="button" data-o="${oi}">${esc(o)}</button>`).join('')}</div><div class="qfb" aria-live="polite"></div></div>`).join('')}</section>`;
}
function render() {
  const L0 = ALL[current]; renderNav();
  const isLesson = current < LESSONS.length;
  main.innerHTML = `
  <p class="eyebrow">${isLesson ? `Lesson ${current + 1} of ${LESSONS.length}` : 'Reference'}</p>
  <h1>${esc(L0.title)}</h1>
  <div class="prose">${L0.body}</div>
  ${L0.quiz ? quizHTML(L0.quiz) : ''}
  ${L0.drills ? drillsHTML(L0) : ''}
  ${L0.lab ? `<section class="lab"><div class="labhead"><h2>Practice</h2><button class="btn" id="hintbtn" type="button">Show hint</button><button class="btn" id="resetlab" type="button">Start over</button></div>
    <ol class="tasks" id="tasks"></ol>
    <div class="labgrid">
      <div class="term"><div class="bar2"><i></i><i></i><i></i><span>Terminal · practice</span></div><div class="out" id="out" aria-live="polite"></div>
        <div class="inrow"><span class="pr" id="prompt"></span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command"></div></div>
      <div class="state" id="state"></div>

  <nav class="pager">${current > 0 ? `<a class="btn" href="#${ALL[current - 1].id}">← ${esc(ALL[current - 1].title.split(':')[0])}</a>` : '<span></span>'}${current < ALL.length - 1 ? `<a class="btn primary" href="#${ALL[current + 1].id}">${esc(ALL[current + 1].title.split(':')[0])} →</a>` : ''}</nav>`;
  main.querySelectorAll('.pager a').forEach(a => a.style.textDecoration = 'none');
  quizState = L0.quiz ? L0.quiz.map(() => false) : [];
  main.querySelectorAll('.q').forEach(qel => qel.addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b) return;
    const qi = +qel.dataset.q, q = L0.quiz[qi], oi = +b.dataset.o, fb = qel.querySelector('.qfb');
    qel.querySelectorAll('.opt').forEach(x => x.classList.remove('wrong'));
    if (oi === q.a) { b.classList.add('right'); fb.textContent = 'Correct. ' + (q.why || ''); fb.style.color = 'var(--ok)'; quizState[qi] = true; checkComplete(); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.style.color = 'var(--bad)'; }
  }));
  drillState = L0.drills ? L0.drills.map(() => false) : [];

let quizState = [];
function fillCmd(t) { const i = document.getElementById('cmd'); if (!i) return; i.value = t; i.focus(); }
function startLab(L0) {
  L0.lab.setup(); lastCmd = '';
  lab = { def: L0.lab, idx: 0, hint: false, hist: [], hpos: 0 };
  outEl = document.getElementById('out');
  print('Practice terminal. Type a command and press Enter. Type help for the list of commands.', 'dim'); flush();
  const input = document.getElementById('cmd');
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const v = input.value; input.value = ''; exec(v); }
    else if (e.key === 'ArrowUp') { if (lab.hpos > 0) { lab.hpos--; input.value = lab.hist[lab.hpos] || ''; } e.preventDefault(); }
    else if (e.key === 'ArrowDown') { if (lab.hpos < lab.hist.length) { lab.hpos++; input.value = lab.hist[lab.hpos] || ''; } e.preventDefault(); }
  });
  document.querySelector('.term').addEventListener('click', e => { if (!e.target.closest('input') && !window.getSelection().toString()) input.focus(); });
  document.getElementById('hintbtn').onclick = () => { lab.hint = !lab.hint; renderTasks(); };
  document.getElementById('resetlab').onclick = () => { startLab(L0); };
  renderTasks(); renderState();
}
function promptText() { return `you@laptop:~/project${S.repo ? ` (${S.repo.head}${S.repo.merging ? '|MERGING' : ''})` : ''}$`; }
function exec(v) {
  const line = v.trim();
  const row = document.createElement('div'); row.className = 'l-cmd'; row.innerHTML = `<span class="pr">${esc(promptText())}</span> ${esc(v)}`; outEl.appendChild(row);
  if (line) { lab.hist.push(line); lab.hpos = lab.hist.length; }
  for (const part of splitAnd(line)) { let ok; try { ok = runOne(part); } catch (err) { print('Something went wrong in the practice terminal: ' + err.message, 'red'); ok = false; } flush(); if (!ok) break; checkTasks(); }
  if (!line) flush();
  checkTasks(); renderState();
}
function checkTasks() {
  const tasks = lab.def.tasks; let moved = false;
  while (lab.idx < tasks.length) {
    let ok = false; try { ok = !!tasks[lab.idx].ok(); } catch (e) { ok = false; }
    if (!ok) break;
    const t = tasks[lab.idx]; lab.idx++; lab.hint = false; moved = true;
    if (t.after) { const m = t.after(); if (m) print(m, 'event'); }
  }
  if (moved) { if (lab.idx >= tasks.length) print('All practice tasks done. Nice work.', 'good'); flush(); renderTasks(); checkComplete(); }
}
function renderTasks() {
  const el = document.getElementById('tasks'); if (!el) return;
  el.innerHTML = lab.def.tasks.map((t, i) => `<li class="${i < lab.idx ? 'done' : i === lab.idx ? 'cur' : ''}"><div>${esc(t.t)}${i === lab.idx && lab.hint ? `<div class="hint">Try: <code class="hintcmd">${esc(t.h)}</code></div>` : ''}</div></li>`).join('');
  document.getElementById('hintbtn').textContent = lab.hint ? 'Hide hint' : 'Show hint';
  document.getElementById('hintbtn').disabled = lab.idx >= lab.def.tasks.length;
}
const openPeek = new Set();
function renderState() {
  const el = document.getElementById('state'); if (!el) return;
  document.getElementById('prompt').textContent = promptText();
  const r = S.repo; const c = r ? changes() : null;
  const files = Object.keys(S.files).sort();
  const fileRow = p => {
    let b = '';
    if (r) {
      if (c.conflicts.includes(p)) b = '<span class="badge b-con">conflict</span>';
      else if (c.untracked.includes(p)) b = '<span class="badge b-unt">untracked</span>';
      else if (isIgnored(p) && !has(r.index, p)) b = '<span class="badge b-unt">ignored</span>';
      else if (c.unstaged.find(x => x.p === p)) b = '<span class="badge b-mod">modified</span>';
    }
    return `<li style="flex-direction:column;align-items:stretch;gap:0"><div style="display:flex;gap:8px;align-items:baseline"><button class="fname" type="button" data-f="${esc(p)}">${esc(p)}</button>${b}</div>${openPeek.has(p) ? `<div class="peek">${esc(S.files[p] || '(empty file)')}</div>` : ''}</li>`;
  };
  const deleted = r ? c.unstaged.filter(x => x.type === 'deleted').map(x => `<li><span style="text-decoration:line-through;color:var(--muted)">${esc(x.p)}</span><span class="badge b-del">deleted</span></li>`).join('') : '';
  let html = `<div class="area"><h4>Working directory <em>${files.length} file${files.length === 1 ? '' : 's'}</em></h4>${files.length || deleted ? `<ul>${files.map(fileRow).join('')}${deleted}</ul>` : '<div class="empty">Empty folder</div>'}</div>`;
  if (!r) {
    html += `<div class="area"><h4>Staging area</h4><div class="empty">No repository yet. Git is not tracking this folder.</div></div><div class="area"><h4>Commits</h4><div class="empty">No repository yet.</div></div>`;
  } else {
    const badge = t => t === 'new file' ? '<span class="badge b-new">new</span>' : t === 'deleted' ? '<span class="badge b-del">deleted</span>' : '<span class="badge b-mod">modified</span>';
    html += `<div class="area"><h4>Staging area <em>next commit</em></h4>${c.staged.length ? `<ul>${c.staged.map(x => `<li>${esc(x.p)} ${badge(x.type)}</li>`).join('')}</ul>` : '<div class="empty">Nothing staged</div>'}</div>`;
    const starts = [...Object.values(r.branches), ...Object.values(r.tracking)].filter(Boolean);
    const set = new Set(); starts.forEach(s => ancestors(s).forEach(x => set.add(x)));
    const list = [...set].map(id => S.objects[id]).sort((a, b) => b.time - a.time);
    html += `<div class="area"><h4>Commits <em>on ${esc(r.head)}${r.merging ? ' · merging' : ''}</em></h4>${list.length ? `<ul>${list.slice(0, 10).map(cm => {
      const refs = decorations(cm.id).map(d => `<span class="ref ${d.k === 'head' ? 'head' : d.k === 'br' ? 'br' : ''}">${esc(d.t)}</span>`).join('') + (cm.parents.length > 1 ? '<span class="ref mg">merge</span>' : '');
      return `<li class="commit"><span class="hash">${cm.id}</span><span class="msg">${esc(cm.msg.split('\n')[0])}</span>${refs ? `<span class="refs">${refs}</span>` : ''}</li>`;
    }).join('')}</ul>${list.length > 10 ? `<div class="empty">+ ${list.length - 10} older</div>` : ''}` : '<div class="empty">No commits yet</div>'}</div>`;
    const rem = Object.keys(r.remotes);
    if (rem.length) html += `<div class="area"><h4>Remote <em>origin</em></h4><ul>${rem.map(n => { const s = S.servers[r.remotes[n]] || { branches: {} }; const bs = Object.keys(s.branches); return `<li style="flex-direction:column;align-items:stretch;gap:2px"><span style="overflow-wrap:anywhere;color:var(--muted)">${esc(r.remotes[n])}</span>${bs.length ? bs.map(b => `<span>${esc(b)} → <span style="color:var(--accent)">${s.branches[b]}</span></span>`).join('') : '<span class="empty">empty: nothing pushed yet</span>'}</li>`; }).join('')}</ul></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.fname').forEach(b => b.addEventListener('click', () => { const f = b.dataset.f; openPeek.has(f) ? openPeek.delete(f) : openPeek.add(f); renderState(); }));
}
function checkComplete(silent) {
  const L0 = ALL[current]; if (current >= LESSONS.length) return;
  const quizOk = (!L0.quiz || quizState.every(Boolean)) && (!L0.drills || drillState.every(Boolean));
  const labOk = !L0.lab || (lab && lab.idx >= L0.lab.tasks.length);
  const box = document.getElementById('donebox');
  if (quizOk && labOk) {
    const already = isDone(L0.id); markDone(L0.id);
    if (!silent || !already) {}
    box.innerHTML = `<div class="donebox"><b>Lesson complete.</b> ${current === LESSONS.length - 1 ? 'You finished the course. You can now create repositories, commit, branch, merge, resolve conflicts and share work through a remote. Keep the cheat sheet handy.' : 'Move on to the next lesson when you are ready.'}</div>`;
  } else if (isDone(L0.id)) {
    box.innerHTML = `<div class="donebox" style="background:var(--surface);border-color:var(--line)">You already completed this lesson. Feel free to practise again.</div>`;
  } else {
    const parts = []; if (L0.quiz && !quizState.every(Boolean)) parts.push('answer the questions'); if (L0.drills && !drillState.every(Boolean)) parts.push('type the commands'); if (L0.lab && !labOk) parts.push('finish the practice tasks');
    box.innerHTML = `<p class="tip" style="margin-top:20px">To complete this lesson: ${parts.join(' and ')}.</p>`;

function route() { const id = location.hash.slice(1); const i = ALL.findIndex(l => l.id === id); current = i >= 0 ? i : 0; render(); }
window.addEventListener('hashchange', route);
document.getElementById('resetall').addEventListener('click', e => {

  if (b.dataset.arm) { store = { done: [], config: null }; save(); b.textContent = 'Reset progress'; delete b.dataset.arm; render(); }
  else { b.dataset.arm = '1'; b.textContent = 'Click again to confirm'; setTimeout(() => { if (b.dataset.arm) { delete b.dataset.arm; b.textContent = 'Reset progress'; } }, 3000); }

route();
})();
