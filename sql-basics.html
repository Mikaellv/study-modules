<script>
(() => {
const KEY = 'sql-from-zero.v1';
let store = { done: [], solved: {}, drafts: {} };
try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v) store = Object.assign(store, v); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ============================== The practice database ============================== */
const SEED = `
CREATE TABLE authors (id INTEGER PRIMARY KEY, name TEXT NOT NULL, country TEXT, born INTEGER);
CREATE TABLE books (id INTEGER PRIMARY KEY, title TEXT NOT NULL, author_id INTEGER REFERENCES authors(id), genre TEXT, year INTEGER, price REAL, pages INTEGER, in_stock INTEGER);
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT NOT NULL, city TEXT, joined TEXT);
CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER REFERENCES customers(id), book_id INTEGER REFERENCES books(id), quantity INTEGER, order_date TEXT);
INSERT INTO authors VALUES
 (1,'Jane Austen','United Kingdom',1775),(2,'George Orwell','United Kingdom',1903),(3,'Gabriel García Márquez','Colombia',1927),
 (4,'Toni Morrison','United States',1931),(5,'Haruki Murakami','Japan',1949),(6,'Chimamanda Ngozi Adichie','Nigeria',1977),
 (7,'Tove Jansson','Finland',1914),(8,'Mary Shelley','United Kingdom',1797),(9,'Elena Ferrante','Italy',NULL),(10,'Astrid Lindgren','Sweden',1907);
INSERT INTO books VALUES
 (1,'Pride and Prejudice',1,'Romance',1813,9.99,432,12),(2,'Emma',1,'Romance',1815,8.50,474,4),
 (3,'Nineteen Eighty-Four',2,'Dystopia',1949,11.99,328,20),(4,'Animal Farm',2,'Satire',1945,7.99,112,15),
 (5,'One Hundred Years of Solitude',3,'Magical Realism',1967,14.50,417,6),(6,'Love in the Time of Cholera',3,'Romance',1985,13.00,348,0),
 (7,'Beloved',4,'Historical',1987,12.99,324,5),(8,'Song of Solomon',4,'Literary',1977,13.50,337,3),
 (9,'Norwegian Wood',5,'Literary',1987,12.00,296,9),(10,'Kafka on the Shore',5,'Magical Realism',2002,15.99,505,7),
 (11,'Americanah',6,'Literary',2013,16.99,588,11),(12,'Half of a Yellow Sun',6,'Historical',2006,15.50,433,0),
 (13,'Finn Family Moomintroll',7,'Children',1948,8.99,176,14),(14,'The Summer Book',7,'Literary',1972,10.50,172,2),
 (15,'Frankenstein',8,'Horror',1818,6.99,280,18),(16,'My Brilliant Friend',9,'Literary',2011,14.99,331,8);
INSERT INTO customers VALUES
 (1,'Aino Virtanen','Helsinki','2023-02-14'),(2,'Ben Carter','London','2022-11-03'),(3,'Chloé Martin','Paris','2024-01-20'),
 (4,'Diego Ramos','Bogotá','2023-07-08'),(5,'Emma Schmidt','Berlin','2024-03-02'),(6,'Femi Okafor','Lagos','2022-09-15'),
 (7,'Grace Lee',NULL,'2024-05-30'),(8,'Hiro Tanaka','Tokyo','2025-01-11');
INSERT INTO orders VALUES
 (1,1,13,2,'2025-01-05'),(2,1,14,1,'2025-01-05'),(3,2,3,1,'2025-01-12'),(4,2,4,2,'2025-02-01'),(5,3,1,1,'2025-02-03'),
 (6,3,15,1,'2025-02-03'),(7,4,5,1,'2025-02-10'),(8,4,6,1,'2025-02-18'),(9,5,10,1,'2025-03-01'),(10,5,9,1,'2025-03-01'),
 (11,6,11,2,'2025-03-07'),(12,6,12,1,'2025-03-07'),(13,2,15,3,'2025-03-15'),(14,7,16,1,'2025-03-20'),(15,1,3,1,'2025-04-02'),
 (16,3,2,1,'2025-04-09'),(17,6,7,1,'2025-04-11'),(18,4,3,2,'2025-04-21'),(19,5,11,1,'2025-05-02'),(20,7,1,1,'2025-05-06');
`;
const SCHEMA = [
  { t: 'books', n: 16, cols: [['id', 'INTEGER', 1], ['title', 'TEXT'], ['author_id', 'INTEGER'], ['genre', 'TEXT'], ['year', 'INTEGER'], ['price', 'REAL'], ['pages', 'INTEGER'], ['in_stock', 'INTEGER']] },
  { t: 'authors', n: 10, cols: [['id', 'INTEGER', 1], ['name', 'TEXT'], ['country', 'TEXT'], ['born', 'INTEGER']] },
  { t: 'customers', n: 8, cols: [['id', 'INTEGER', 1], ['name', 'TEXT'], ['city', 'TEXT'], ['joined', 'TEXT']] },
  { t: 'orders', n: 20, cols: [['id', 'INTEGER', 1], ['customer_id', 'INTEGER'], ['book_id', 'INTEGER'], ['quantity', 'INTEGER'], ['order_date', 'TEXT']] },
];
let SQL = null;
function freshDb(pre) { const db = new SQL.Database(); db.run(SEED); if (pre) db.run(pre); return db; }
function runAll(db, sql) {
  const results = []; let changed = 0, statements = 0;
  for (const st of db.iterateStatements(sql)) {
    statements++;
    try { const cols = st.getColumnNames(); const rows = []; while (st.step()) rows.push(st.get()); if (cols.length) results.push({ columns: cols, values: rows }); else changed += db.getRowsModified(); }
    finally { st.free(); }
  }
  return { results, changed, statements };
}
function friendly(msg) {
  const m = String(msg);
  if (/no such column: (.+)/.test(m)) { const col = m.match(/no such column: (.+)/)[1]; return `SQLite cannot find a column called ${col}. Check the spelling against the table list. If ${col} is meant to be a text value, put it in single quotes: '${col}'.`; }
  if (/no such table/.test(m)) return 'Check the table name. The tables are books, authors, customers and orders.';
  if (/syntax error/.test(m)) return 'Something in the statement is out of place. Common causes: a missing comma between columns, a comma before FROM, clauses in the wrong order (SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY … LIMIT), or an unclosed quote.';
  if (/incomplete input/.test(m)) return 'The statement ends too early. Is a quote or bracket left open?';
  if (/ambiguous column/.test(m)) return 'Two joined tables have a column with this name. Say which one you mean, for example b.id or a.id.';
  if (/misuse of aggregate/.test(m)) return 'Aggregates like COUNT or SUM cannot go in WHERE. Filter groups with HAVING instead.';
  if (/UNIQUE constraint|PRIMARY KEY/.test(m)) return 'A row with that id already exists. Each primary key value must be unique.';
  if (/NOT NULL constraint/.test(m)) return 'A required column was left empty.';
  if (/already exists/.test(m)) return 'That table already exists.';
  return '';
}
const KW = /\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|BETWEEN|LIKE|IS|NULL|ORDER|BY|ASC|DESC|LIMIT|DISTINCT|AS|COUNT|SUM|AVG|MIN|MAX|ROUND|GROUP|HAVING|JOIN|INNER|LEFT|ON|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DROP|ALTER|ADD|COLUMN|PRIMARY|KEY|INTEGER|TEXT|REAL|REFERENCES|UNIQUE|DEFAULT|OFFSET|CASE|WHEN|THEN|ELSE|END)\b/g;
function hl(sql) { return esc(sql).split(/('(?:[^']|'')*')/).map((part, i) => i % 2 ? `<span class="str">${part}</span>` : part.replace(KW, '<span class="kw">$1</span>')).join(''); }
function gridHTML(r) {
  if (!r.values.length) return `<div class="grid"><table><thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead></table></div><div class="meta">0 rows</div>`;
  const body = r.values.map(row => `<tr>${row.map(v => v === null ? '<td class="null">NULL</td>' : typeof v === 'number' ? `<td class="num">${esc(Number.isInteger(v) ? v : +v.toFixed(4))}</td>` : `<td>${esc(v)}</td>`).join('')}</tr>`).join('');
  return `<div class="grid"><table><thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div><div class="meta">${r.values.length} row${r.values.length === 1 ? '' : 's'}</div>`;
}
function errHTML(e) { const w = friendly(e.message); return `<div class="err">${esc(e.message)}${w ? `<span class="why">${esc(w)}</span>` : ''}</div>`; }
function outcomeHTML(o) {
  if (o.results.length) return gridHTML(o.results[o.results.length - 1]);
  if (!o.statements) return '<div class="meta">Nothing to run. Type a statement first.</div>';
  return `<div class="meta">Statement ran. ${o.changed} row${o.changed === 1 ? '' : 's'} changed.</div>`;
}

/* ============================== Checking answers ============================== */
const norm = row => row.map(v => typeof v === 'number' ? Math.round(v * 100) / 100 : v);
const key = r => JSON.stringify(r);
function compare(user, exp, ex) {
  if (!user) return 'Your SQL did not return a result table. This exercise needs a SELECT statement.';
  if (user.columns.length !== exp.columns.length) return `Expected ${exp.columns.length} column${exp.columns.length === 1 ? '' : 's'}, you returned ${user.columns.length}.`;
  if (ex.names) for (let i = 0; i < ex.names.length; i++) if (ex.names[i] && String(user.columns[i]).toLowerCase() !== ex.names[i]) return `Name column ${i + 1} “${ex.names[i]}”. Use AS to rename it.`;
  const U = user.values.map(norm), E = exp.values.map(norm);
  if (U.length !== E.length) return `Expected ${E.length} row${E.length === 1 ? '' : 's'}, you returned ${U.length}.`;
  const us = U.map(key).sort(), es = E.map(key).sort();
  if (us.join('|') !== es.join('|')) {
    const sortRow = r => key([...r].map(v => (v === null ? 'null' : String(v))).sort());

<tr><td><code>REAL</code></td><td>numbers with decimals</td><td><code>DECIMAL(10,2)</code> for money, <code>FLOAT</code></td></tr>
<tr><td><code>TEXT</code></td><td>text of any length</td><td><code>VARCHAR(100)</code></td></tr>
<tr><td><code>TEXT</code> as 'YYYY-MM-DD'</td><td>dates (SQLite has no separate date type)</td><td><code>DATE</code>, <code>TIMESTAMP</code></td></tr>
</table></div>
<h3>Constraints: rules the database enforces</h3>
<ul>
<li><code>PRIMARY KEY</code>: unique identifier for each row. The database rejects duplicates.</li>
<li><code>NOT NULL</code>: the column must always have a value.</li>
<li><code>DEFAULT x</code>: value used when an INSERT leaves the column out.</li>
<li><code>UNIQUE</code>: no two rows may have the same value.</li>
<li><code>REFERENCES other(id)</code>: a <em>foreign key</em>; the value must point at a row of another table, like <code>books.author_id</code> points at <code>authors.id</code>.</li>
</ul>
<h3>Changing and removing tables</h3>
${ex('ALTER TABLE customers ADD COLUMN email TEXT;\nSELECT * FROM customers LIMIT 3;')}
<p><code>DROP TABLE name;</code> deletes a table with all its data. Like <code>DELETE</code> without <code>WHERE</code>, it cannot be undone.</p>`,
  quiz: [
    { q: 'Which column type fits a price like 12.99 in SQLite?', o: ['INTEGER', 'REAL', 'TEXT', 'PRIMARY KEY'], a: 1 },
    { q: 'What does NOT NULL on a column do?', o: ['The column can only contain 0', 'The column must always have a value', 'The column is hidden', 'The column is deleted'], a: 1 },
  ],
  exercises: [
    { q: 'Create a table reviews with the columns: id (INTEGER, primary key), book_id (INTEGER, must not be empty), stars (INTEGER), comment (TEXT).', sol: 'CREATE TABLE reviews (id INTEGER PRIMARY KEY, book_id INTEGER NOT NULL, stars INTEGER, comment TEXT);',
      check: db => { const c = columnsOf(db, 'reviews'); if (!c.length) return 'There is no table called reviews yet.'; const names = c.map(r => String(r[0]).toLowerCase()); const want = ['id', 'book_id', 'stars', 'comment']; if (names.join() !== want.join()) return `Expected the columns ${want.join(', ')} in that order. Your table has: ${names.join(', ')}.`; if (!c[0][3]) return 'id should be the PRIMARY KEY.'; if (!c[1][2]) return 'book_id should be NOT NULL.'; const types = c.map(r => String(r[1]).toUpperCase()); if (!/INT/.test(types[0]) || !/INT/.test(types[1]) || !/INT/.test(types[2]) || !/TEXT|CHAR/.test(types[3])) return 'Check the column types: INTEGER for id, book_id and stars; TEXT for comment.'; return null; },
      hint: 'CREATE TABLE reviews (id INTEGER PRIMARY KEY, book_id INTEGER NOT NULL, …);' },
    { q: "The reviews table now exists. Add two reviews: (1, book 3, 5 stars, 'Chilling and brilliant') and (2, book 13, 4 stars, 'Lovely for kids').", pre: 'CREATE TABLE reviews (id INTEGER PRIMARY KEY, book_id INTEGER NOT NULL, stars INTEGER, comment TEXT);',
      sol: "INSERT INTO reviews (id, book_id, stars, comment) VALUES (1, 3, 5, 'Chilling and brilliant'), (2, 13, 4, 'Lovely for kids');", check: 'SELECT * FROM reviews ORDER BY id;', hint: 'One INSERT with two value lists: VALUES (…), (…);' },
    { q: 'Add a column reviewer of type TEXT to the reviews table.', pre: 'CREATE TABLE reviews (id INTEGER PRIMARY KEY, book_id INTEGER NOT NULL, stars INTEGER, comment TEXT);', sol: 'ALTER TABLE reviews ADD COLUMN reviewer TEXT;',
      check: db => columnsOf(db, 'reviews').some(r => String(r[0]).toLowerCase() === 'reviewer') ? null : 'The reviews table has no column called reviewer yet.', hint: 'ALTER TABLE reviews ADD COLUMN reviewer TEXT;' },
    { q: 'The shop decided against reviews. Delete the whole reviews table.', pre: 'CREATE TABLE reviews (id INTEGER PRIMARY KEY, book_id INTEGER NOT NULL, stars INTEGER, comment TEXT);', sol: 'DROP TABLE reviews;',
      check: db => columnsOf(db, 'reviews').length ? 'The reviews table still exists.' : (columnsOf(db, 'books').length ? null : 'The books table is gone. Only drop reviews.'), hint: 'DROP TABLE reviews;' },
  ],
},
{
  id: 'final', title: 'Final challenge: answer the shop\'s questions',
  body: `
<p>The shop owner has questions. Each one needs several things you have learned. Write each query from scratch; the hints are there if you need them.</p>
<p>Before you start: work in small steps. Write the <code>FROM</code> and <code>JOIN</code> part first and run it with <code>SELECT *</code>. When the rows look right, add <code>WHERE</code>, then <code>GROUP BY</code>, then the final columns and <code>ORDER BY</code>. Professionals build queries this way too.</p>`,
  exercises: [
    { q: 'Who are the 3 best customers? Show name and total_spent (quantity × price), highest first.', sol: 'SELECT c.name, SUM(o.quantity * b.price) AS total_spent FROM orders o JOIN customers c ON o.customer_id = c.id JOIN books b ON o.book_id = b.id GROUP BY c.id, c.name ORDER BY total_spent DESC LIMIT 3;', ordered: true, orderKey: [1], names: [null, 'total_spent'], hint: 'Same as the joins lesson, plus LIMIT 3.' },
    { q: 'Which books have never been ordered? Show their titles.', sol: 'SELECT b.title FROM books b LEFT JOIN orders o ON o.book_id = b.id WHERE o.id IS NULL;', hint: 'books LEFT JOIN orders … WHERE o.id IS NULL' },
    { q: 'For each author country, how many books does the shop carry? Show country and book_count, most books first.', sol: 'SELECT a.country, COUNT(*) AS book_count FROM books b JOIN authors a ON b.author_id = a.id GROUP BY a.country ORDER BY book_count DESC;', ordered: true, orderKey: [1], hint: 'Join books to authors, GROUP BY a.country.' },
    { q: 'Which different book titles were bought by customers from London?', sol: "SELECT DISTINCT b.title FROM orders o JOIN customers c ON o.customer_id = c.id JOIN books b ON o.book_id = b.id WHERE c.city = 'London';", hint: "Join all three tables, WHERE c.city = 'London', and DISTINCT." },
    { q: 'What is the revenue (quantity × price) per genre? Show genre and revenue, highest first.', sol: 'SELECT b.genre, SUM(o.quantity * b.price) AS revenue FROM orders o JOIN books b ON o.book_id = b.id GROUP BY b.genre ORDER BY revenue DESC;', ordered: true, orderKey: [1], hint: 'Join orders and books, GROUP BY b.genre, SUM(o.quantity * b.price).' },
  ],
},
];
const EXTRA = [
{
  id: 'playground', title: 'Playground', body: `
<p>Write any SQL against the bookshop database. Changes stay until you reset the database or reload the page.</p>
${schemaHTML()}`,
  playground: true,
},
{
  id: 'cheatsheet', title: 'Cheat sheet', body: `
<p>The whole course on one page.</p>
<h3>Reading data</h3>
<pre class="example" style="padding:12px 14px;font-family:var(--font-mono);font-size:0.86rem">${hl(`SELECT column1, column2, AGG(column3) AS alias
FROM table1 t1
JOIN table2 t2 ON t1.id = t2.table1_id      -- or LEFT JOIN
WHERE condition                              -- filters rows
GROUP BY column1, column2
HAVING AGG(column3) > 10                     -- filters groups
ORDER BY alias DESC                          -- ASC is the default
LIMIT 10;`)}</pre>
<div class="tablewrap"><table class="ref">
<tr><th>Need</th><th>SQL</th></tr>
<tr><td>All columns</td><td><code>SELECT * FROM books;</code></td></tr>
<tr><td>Filter</td><td><code>=, &lt;&gt;, &lt;, &gt;, BETWEEN, IN (…), LIKE '%x%', IS NULL, AND, OR, NOT</code></td></tr>
<tr><td>Unique values</td><td><code>SELECT DISTINCT genre FROM books;</code></td></tr>

</table></div>

UPDATE books SET price = 12.49 WHERE id = 17;     -- never forget WHERE
DELETE FROM books WHERE id = 17;                  -- never forget WHERE`)}</pre>

<pre class="example" style="padding:12px 14px;font-family:var(--font-mono);font-size:0.86rem">${hl(`CREATE TABLE reviews (
  id INTEGER PRIMARY KEY,

ALTER TABLE reviews ADD COLUMN reviewer TEXT;

];
function schemaHTML() {
  return `<div class="schema">${SCHEMA.map(s => `<div class="tcard"><b>${s.t}<span>${s.n} rows</span></b><ul>${s.cols.map(c => `<li class="${c[2] ? 'pk' : ''}"><span>${c[0]}${c[2] ? ' · PK' : ''}</span><i>${c[1]}</i></li>`).join('')}</ul></div>`).join('')}</div>`;
}
const ALL = [...LESSONS, ...EXTRA];

/* ============================== UI ============================== */
const nav = document.getElementById('nav'), main = document.getElementById('main');
let current = 0, quizState = [], playDb = null;
const isDone = id => store.done.includes(id);
const exKey = (lid, i) => `${lid}:${i}`;
function renderNav() {
  nav.innerHTML = ALL.map((l, i) => `<li><a href="#${l.id}" ${i === current ? 'aria-current="page"' : ''}><span class="num">${i < LESSONS.length ? String(i + 1).padStart(2, '0') : '—'}</span><span>${esc(l.title.split(':')[0])}</span><span class="tick">${isDone(l.id) ? '✓' : ''}</span></a></li>`).join('');
  const n = LESSONS.filter(l => isDone(l.id)).length;
  document.getElementById('progtext').textContent = `${n} / ${LESSONS.length} lessons`;
  document.getElementById('progbar').style.width = (n / LESSONS.length * 100) + '%';
}
function exerciseHTML(L0) {
  return `<section><h2>Exercises</h2><details class="schemabox"><summary>Show the tables</summary>${schemaHTML()}</details><div class="exs">${L0.exercises.map((e, i) => {
    const k = exKey(L0.id, i), solved = !!store.solved[k];
    return `<div class="ex ${solved ? 'solved' : ''}" data-i="${i}">
      <div class="exhead"><span class="exnum">${solved ? '✓' : i + 1}</span><div style="min-width:0"><p class="exq">${esc(e.q)}</p>
      <textarea class="sql" id="ed-${L0.id}-${i}" spellcheck="false" aria-label="SQL for exercise ${i + 1}" placeholder="Write your SQL here">${esc(store.drafts[k] || '')}</textarea>
      <div class="exbtns"><button class="btn primary run" type="button">Run and check</button><button class="btn hintb" type="button">Hint</button><button class="btn solb" type="button">Show solution</button><span class="kbd">Ctrl + Enter runs</span></div>
      <div class="reveal" hidden></div><div class="fbx"></div><div class="res"></div></div></div></div>`;
  }).join('')}</div></section>`;
}
function render() {
  const L0 = ALL[current]; renderNav();
  const isLesson = current < LESSONS.length;
  main.innerHTML = `
  <p class="eyebrow">${isLesson ? `Lesson ${current + 1} of ${LESSONS.length}` : 'Reference'}</p>
  <h1>${esc(L0.title)}</h1>
  <div class="prose">${L0.body}</div>
  ${L0.quiz ? `<section class="quiz"><h2 style="margin:0">Check your understanding</h2>${L0.quiz.map((q, qi) => `<div class="q" data-q="${qi}"><p>${esc(q.q)}</p><div class="opts">${q.o.map((o, oi) => `<button class="opt" type="button" data-o="${oi}">${esc(o)}</button>`).join('')}</div><div class="qfb" aria-live="polite"></div></div>`).join('')}</section>` : ''}
  ${L0.exercises ? exerciseHTML(L0) : ''}
  ${L0.playground ? `<div class="ex"><textarea class="sql" id="playsql" spellcheck="false" aria-label="SQL playground" style="min-height:140px">SELECT b.title, a.name AS author, b.price
FROM books b
JOIN authors a ON b.author_id = a.id
ORDER BY b.price DESC;</textarea><div class="exbtns"><button class="btn primary" id="playrun" type="button">Run</button><button class="btn" id="playreset" type="button">Reset database</button><span class="kbd">Ctrl + Enter runs</span></div><div class="res" id="playres"></div></div>` : ''}
  <div id="donebox"></div>
  <nav class="pager">${current > 0 ? `<a class="btn" href="#${ALL[current - 1].id}">← ${esc(ALL[current - 1].title.split(':')[0])}</a>` : '<span></span>'}${current < ALL.length - 1 ? `<a class="btn primary" href="#${ALL[current + 1].id}">${esc(ALL[current + 1].title.split(':')[0])} →</a>` : ''}</nav>`;
  quizState = L0.quiz ? L0.quiz.map(() => false) : [];
  main.querySelectorAll('.q').forEach(qel => qel.addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b) return;
    const qi = +qel.dataset.q, q = L0.quiz[qi], oi = +b.dataset.o, fb = qel.querySelector('.qfb');
    qel.querySelectorAll('.opt').forEach(x => x.classList.remove('wrong'));
    if (oi === q.a) { b.classList.add('right'); fb.textContent = 'Correct. ' + (q.why || ''); fb.style.color = 'var(--ok)'; quizState[qi] = true; checkComplete(); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.style.color = 'var(--bad)'; }
  }));
  main.querySelectorAll('.runex').forEach(b => b.addEventListener('click', () => {
    const res = b.closest('.example').querySelector('.res'); const db = freshDb();
    try { res.innerHTML = outcomeHTML(runAll(db, b.dataset.sql)); } catch (e) { res.innerHTML = errHTML(e); } finally { db.close(); }
  }));
  main.querySelectorAll('.ex[data-i]').forEach(el => wireExercise(L0, el));
  if (L0.playground) wirePlayground();
  main.querySelectorAll('textarea.sql').forEach(ta => ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); }
  }));
  checkComplete();
  window.scrollTo(0, 0);
}
function wireExercise(L0, el) {
  const i = +el.dataset.i, e = L0.exercises[i], k = exKey(L0.id, i);
  const ta = el.querySelector('textarea'), fbx = el.querySelector('.fbx'), res = el.querySelector('.res'), rev = el.querySelector('.reveal');
  const run = () => {
    const sql = ta.value; store.drafts[k] = sql; save();
    if (!sql.trim()) { fbx.innerHTML = '<div class="fb bad">Write a query first.</div>'; return; }
    const r = checkExercise(e, sql);
    if (r.err) { fbx.innerHTML = ''; res.innerHTML = errHTML(r.err); return; }
    res.innerHTML = outcomeHTML(r.out);
    if (r.msg) fbx.innerHTML = `<div class="fb bad">${esc(r.msg)}</div>`;
    else {
      fbx.innerHTML = '<div class="fb good"><b>Correct.</b></div>';
      if (!store.solved[k]) { store.solved[k] = true; save(); }
      el.classList.add('solved'); el.querySelector('.exnum').textContent = '✓'; checkComplete();
    }
  };
  el.querySelector('.run').addEventListener('click', run);
  ta.addEventListener('keydown', ev => { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); run(); } });
  ta.addEventListener('input', () => { store.drafts[k] = ta.value; save(); });
  el.querySelector('.hintb').addEventListener('click', () => { rev.hidden = false; rev.innerHTML = `<b>Hint:</b> ${esc(e.hint)}`; });
  const solb = el.querySelector('.solb');
  if (!store.solved[k]) { solb.disabled = true; solb.title = 'Run your own attempt first'; }
  el.querySelector('.run').addEventListener('click', () => { if (ta.value.trim()) { solb.disabled = false; solb.title = ''; } });
  solb.addEventListener('click', () => { rev.hidden = false; rev.innerHTML = `<b>One possible solution</b> (other correct queries exist). Type it into the editor yourself:<pre>${hl(e.sol)}</pre>`; });
}
function wirePlayground() {
  if (!playDb) playDb = freshDb();
  const ta = document.getElementById('playsql'), res = document.getElementById('playres');
  const run = () => { try { res.innerHTML = outcomeHTML(runAll(playDb, ta.value)); } catch (e) { res.innerHTML = errHTML(e); } };
  document.getElementById('playrun').onclick = run;
  document.getElementById('playreset').onclick = () => { playDb.close(); playDb = freshDb(); res.innerHTML = '<div class="meta">Database reset to the original bookshop data.</div>'; };
  ta.addEventListener('keydown', ev => { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); run(); } });
  run();
}
function checkComplete() {
  const L0 = ALL[current]; if (current >= LESSONS.length) return;
  const quizOk = !L0.quiz || quizState.every(Boolean);
  const exOk = L0.exercises.every((_, i) => store.solved[exKey(L0.id, i)]);
  const box = document.getElementById('donebox');
  if (quizOk && exOk) {
    if (!isDone(L0.id)) { store.done.push(L0.id); save(); renderNav(); }
    box.innerHTML = `<div class="donebox"><b>Lesson complete.</b> ${current === LESSONS.length - 1 ? 'You finished the course. You can now read, filter, sort, summarize and join data, change rows, and create tables. Use the playground and cheat sheet to keep practising.' : 'Move on to the next lesson when you are ready.'}</div>`;
  } else if (isDone(L0.id)) {
    box.innerHTML = '<p class="tip" style="margin-top:20px">You already completed this lesson.</p>';
  } else {
    const left = L0.exercises.filter((_, i) => !store.solved[exKey(L0.id, i)]).length;
    const parts = []; if (L0.quiz && !quizOk) parts.push('answer the questions'); if (left) parts.push(`solve ${left} more exercise${left === 1 ? '' : 's'}`);
    box.innerHTML = `<p class="tip" style="margin-top:20px">To complete this lesson: ${parts.join(' and ')}.</p>`;
  }
}
function route() { const id = location.hash.slice(1); const i = ALL.findIndex(l => l.id === id); current = i >= 0 ? i : 0; render(); }
document.getElementById('resetall').addEventListener('click', e => {
  const b = e.currentTarget;
  if (b.dataset.arm) { store = { done: [], solved: {}, drafts: {} }; save(); b.textContent = 'Reset progress'; delete b.dataset.arm; render(); }
  else { b.dataset.arm = '1'; b.textContent = 'Click again to confirm'; setTimeout(() => { if (b.dataset.arm) { delete b.dataset.arm; b.textContent = 'Reset progress'; } }, 3000); }
});
if (typeof initSqlJs !== 'function') { main.innerHTML = '<p class="err">The SQL engine could not be loaded. Check your internet connection and reload the page.</p>'; return; }
initSqlJs().then(lib => { SQL = lib; window.addEventListener('hashchange', route); route(); })
  .catch(e => { main.innerHTML = `<p class="err">The SQL engine could not start: ${esc(e.message)}</p>`; });
renderNav();
})();
</script>
